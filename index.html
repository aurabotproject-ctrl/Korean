    <div class="gicon">${emoji}</div>
    <div style="flex:1;display:grid;gap:4px"><h3>${title}</h3><p class="muted">${blurb}</p>
      <div class="row" style="gap:8px"><span class="pill">${stat}</span><span class="pill ${stampEarned(p, st) ? 'done' : ''}">${stampEarned(p, st) ? '✓ Stamp earned' : '🎯 ' + esc(st.how)}</span></div></div>
    <img class="gstamp ${stampEarned(p, st) ? 'got' : ''}" src="assets/stamps/${st.id}.webp" alt="">
    <button class="btn red" data-game="${id}">Play</button></div>`;
  main.innerHTML = `<div class="section-h" style="margin-top:0"><div><span class="eyebrow">Practice</span><h1>Games</h1></div><p class="muted" style="max-width:42ch">Games use ${src}. Learn more words on the Hangul Path to fill the decks!</p></div>
  <div class="grid">
    ${card('memory', '🃏', 'Memory Match', 'Flip two cards and find the pairs: Korean ↔ meaning.', `🏆 ${g.memory.wins} wins · best ${g.memory.best ? g.memory.best + ' moves' : '—'}`, D.stamps.find(s => s.game === 'memory'))}
    ${card('swipe', '👆', 'Swipe Cards', 'Flip a cue card. Swipe right if you knew it, left if you’re still learning.', `✓ ${g.swipe.known} cards known`, D.stamps.find(s => s.game === 'swipe'))}
    ${card('speed', '⚡', 'Speed Read', 'How many Korean words can you read in 60 seconds?', `⭐ best ${g.speed.best}`, D.stamps.find(s => s.game === 'speed'))}
  </div>`;
  $$('[data-game]', main).forEach(b => b.onclick = () => ({ memory: playMemory, swipe: playSwipe, speed: playSpeed })[b.dataset.game]());
};
let G = null;
function openGame(title) {
  const root = $('#player-root');
  root.innerHTML = `<div class="player" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <div class="p-top"><button class="x" id="g-x" aria-label="Close">✕</button><h3 style="flex:1">${esc(title)}</h3><span class="stat" id="g-stat"></span></div>
    <div class="p-body" style="padding-bottom:40px"><div class="p-in" id="g-in"></div></div></div>`;
  document.body.style.overflow = 'hidden';
  G = { before: earnedIds(me()), cleanup: null };
  $('#g-x').onclick = closeGame;
  return $('#g-in');
}
function closeGame() {
  if (G && G.cleanup) G.cleanup();
  $('#player-root').innerHTML = ''; document.body.style.overflow = '';
  if (window.speechSynthesis) speechSynthesis.cancel();
  G = null; go(route.name, route.arg);
}
function gameOver(box, { title, text, pose, again }) {
  const p = me(); save();
  box.innerHTML = `<img src="${tiger(pose)}" alt="" style="width:170px"><h1>${title}</h1><p class="mn-text">${text}</p>
    <div class="row" style="justify-content:center"><button class="btn ghost" id="g-done">Done</button><button class="btn red" id="g-again">Play again</button></div>`;
  $('#g-done', box).onclick = closeGame;
  $('#g-again', box).onclick = again;
  checkGameStamps(G.before);
  G.before = earnedIds(p);
}

/* --- Memory Match --- */
function playMemory() {
  const p = me(), pool = gamePool(p);
  const box = G ? $('#g-in') : openGame('Memory Match');
  const pairs = shuffle(pool.items).slice(0, 6);
  const cards = shuffle(pairs.flatMap((it, i) => [{ i, side: 'ko', it }, { i, side: 'en', it }]));
  let open = [], matched = 0, moves = 0, lock = false;
  const stat = () => $('#g-stat').textContent = `🔄 ${moves} moves`;
  box.innerHTML = `<p class="muted">Find each Korean ${pool.kind === 'words' ? 'word' : 'letter'} and its ${pool.kind === 'words' ? 'meaning' : 'sound'}.</p>
    <div class="mem">${cards.map((c, k) => `<button class="mcard" data-k="${k}" aria-label="Hidden card"><span class="mback">🐯</span><span class="mface ${c.side}">${c.side === 'ko' ? `<span class="ko">${esc(c.it.ko)}</span>` : `<span class="em">${c.it.emoji}</span><span class="en">${esc(c.it.en)}</span>`}</span></button>`).join('')}</div>`;
  stat();
  $$('.mcard', box).forEach(b => b.onclick = () => {
    const k = +b.dataset.k, c = cards[k];
    if (lock || b.classList.contains('up')) return;
    b.classList.add('up'); b.setAttribute('aria-label', c.side === 'ko' ? c.it.ko : c.it.en);
    if (c.side === 'ko') say(c.it.say);
    open.push([b, c]);
    if (open.length < 2) return;
    moves++; stat();
    const [[b1, c1], [b2, c2]] = open; open = [];
    if (c1.i === c2.i) {
      matched++; sfx('good'); b1.classList.add('ok'); b2.classList.add('ok'); addXP(1);
      if (matched === pairs.length) {
        const g = gameStats(p).memory; g.plays++; g.wins++; if (!g.best || moves < g.best) g.best = moves;
        addXP(10);
        setTimeout(() => { sfx('win'); burst(); gameOver(box, { title: '짝 맞추기 성공!', pose: 'cheer', text: `All pairs found in <b>${moves} moves</b>. ${moves <= 8 ? 'Amazing memory!' : 'Try to beat it with fewer moves!'} (+16 XP)`, again: playMemory }); }, 700);
      }
    } else {
      lock = true; sfx('bad');
      setTimeout(() => { b1.classList.remove('up'); b2.classList.remove('up'); lock = false; }, 950);
    }
  });
}

/* --- Swipe Cards --- */
function playSwipe(mode) {
  const p = me(), pool = gamePool(p);
  const box = G ? $('#g-in') : openGame('Swipe Cards');
  mode = typeof mode === 'string' ? mode : 'ko';
  // due words first, then the rest
  const now = Date.now();
  const items = pool.items.slice().sort((a, b) => {
    const ra = a.word && p.words[a.key], rb = b.word && p.words[b.key];
    return ((ra ? ra.box : 0) - (rb ? rb.box : 0)) || ((ra && ra.due <= now ? 0 : 1) - (rb && rb.due <= now ? 0 : 1));
  });
  const deck = shuffle(items.slice(0, 20)).slice(0, 15);
  let i = 0, known = 0, again = [];
  box.innerHTML = `<div class="chips" style="justify-content:center"><button class="chip" data-mode="ko" aria-pressed="${mode === 'ko'}">Korean first</button><button class="chip" data-mode="en" aria-pressed="${mode === 'en'}">English first</button></div>
    <div class="swipe-zone"><div class="hint left">✗ Still learning</div><div class="hint right">Knew it ✓</div><div id="sw-stack"></div></div>
    <p class="muted" style="font-size:.9rem">Tap the card to flip it. Swipe or use the buttons (← / → keys work too).</p>
    <div class="row" style="justify-content:center">
      <button class="btn red swbtn" id="sw-no" aria-label="Still learning">✗</button>
      <button class="btn ghost" id="sw-flip">↻ Flip</button>
      <button class="btn green swbtn" id="sw-yes" aria-label="Knew it">✓</button></div>`;
  $$('[data-mode]', box).forEach(b => b.onclick = () => playSwipe(b.dataset.mode));
  const stat = () => $('#g-stat').textContent = `${Math.min(i + 1, deck.length)} / ${deck.length}`;
  function render() {
    stat();
    const it = deck[i];
    const front = mode === 'ko' ? `<span class="ko big">${esc(it.ko)}</span>` : `<span class="em">${it.emoji}</span><span class="en">${esc(it.en)}</span>`;
    const back = mode === 'ko' ? `<span class="em">${it.emoji}</span><span class="en">${esc(it.en)}</span>${pool.kind === 'words' && showRom(it.word.stage) ? `<span class="rom">${esc(it.rom)}</span>` : ''}` : `<span class="ko big">${esc(it.ko)}</span><span class="rom">${esc(it.rom)}</span>`;
    $('#sw-stack', box).innerHTML = `${deck[i + 1] ? '<div class="scard under"></div>' : ''}<div class="scard" id="sc" tabindex="0"><div class="sin"><div class="sf front">${front}<span class="muted small">tap to flip</span></div><div class="sf back">${back}</div></div></div>`;
    if (mode === 'ko') say(it.say);
    bindCard($('#sc', box));
  }
  function flip() { const c = $('#sc', box); if (!c) return; c.classList.toggle('flipped'); if (c.classList.contains('flipped') && mode === 'en') say(deck[i].say); }
  function decide(ok) {
    const c = $('#sc', box); if (!c || c.dataset.gone) return;
    c.dataset.gone = 1;
    c.style.transition = 'transform .3s ease, opacity .3s'; c.style.transform = `translateX(${ok ? 140 : -140}%) rotate(${ok ? 18 : -18}deg)`; c.style.opacity = 0;
    const it = deck[i];
    sfx(ok ? 'good' : 'bad');
    if (ok) { known++; addXP(1); } else again.push(it);
    if (it.word) { const r = p.words[it.key]; if (r) { if (ok) { r.right++; if (r.due <= Date.now()) { r.box = Math.min(5, r.box + 1); r.due = Date.now() + BOX_GAP[r.box]; } } else { r.wrong++; r.box = 1; r.due = Date.now() + 10 * 60000; } } }
    else markLetter(it.key, ok);
    save();
    setTimeout(() => {
      i++;
      if (i < deck.length) return render();
      const g = gameStats(p).swipe; g.plays++; g.known += known; addXP(5);
      gameOver(box, { title: known === deck.length ? '완벽해요! Perfect!' : '잘했어요! Deck done!', pose: known >= deck.length * .7 ? 'cheer' : 'thumbs',
        text: `You knew <b>${known} of ${deck.length}</b> cards.${again.length ? `<br>Keep practising: <span class="ko">${again.map(x => esc(x.ko)).join(', ')}</span>` : ''}`, again: () => playSwipe(mode) });
    }, 280);
  }
  function bindCard(c) {
    let x0 = null, dx = 0, moved = false;
    c.addEventListener('pointerdown', e => { x0 = e.clientX; dx = 0; moved = false; c.setPointerCapture(e.pointerId); c.style.transition = 'none'; });
    c.addEventListener('pointermove', e => {
      if (x0 === null) return; dx = e.clientX - x0; if (Math.abs(dx) > 6) moved = true;
      c.style.transform = `translateX(${dx}px) rotate(${dx / 18}deg)`;
      box.querySelector('.hint.left').style.opacity = Math.min(1, Math.max(0, -dx / 90));
      box.querySelector('.hint.right').style.opacity = Math.min(1, Math.max(0, dx / 90));
    });
    const up = () => {
      if (x0 === null) return; x0 = null;
      $$('.hint', box).forEach(h => h.style.opacity = 0);
      if (!moved) { c.style.transform = ''; flip(); return; }
      if (Math.abs(dx) > 90) decide(dx > 0);
      else { c.style.transition = 'transform .2s'; c.style.transform = ''; }
    };
    c.addEventListener('pointerup', up); c.addEventListener('pointercancel', up);
  }
  $('#sw-no', box).onclick = () => decide(false);
  $('#sw-yes', box).onclick = () => decide(true);
  $('#sw-flip', box).onclick = flip;
  const key = e => { if (!$('#sc')) return; if (e.key === 'ArrowLeft') decide(false); else if (e.key === 'ArrowRight') decide(true); else if (e.key === ' ' || e.key === 'ArrowUp') { e.preventDefault(); flip(); } };
  if (G.cleanup) G.cleanup();
  document.addEventListener('keydown', key);
  G.cleanup = () => document.removeEventListener('keydown', key);
  render();
}

/* --- Speed Read --- */
function playSpeed() {
  const p = me(), pool = gamePool(p);
  const box = G ? $('#g-in') : openGame('Speed Read');
  let score = 0, left = 60, timer = null, cur = null, busy = false;
  const stat = () => $('#g-stat').textContent = `⏱ ${left}s · ⭐ ${score}`;
  box.innerHTML = `<img src="${tiger('point')}" alt="" style="width:140px"><h2>60 seconds. Ready?</h2>
    <p class="muted">Read the Korean and tap the right meaning, as fast as you can.</p><button class="btn red" id="sp-go">Start!</button>`;
  $('#g-stat').textContent = `best ${gameStats(p).speed.best}`;
  $('#sp-go', box).onclick = () => {
    box.innerHTML = `<div class="bar"><i id="sp-t" style="width:100%;transition:width 1s linear"></i></div><div id="sp-q" style="display:grid;gap:18px;width:100%;justify-items:center"></div>`;
    stat(); next();
    timer = setInterval(() => {
      left--; stat(); $('#sp-t').style.width = (left / 60 * 100) + '%';
      if (left <= 0) end();
    }, 1000);
  };
  if (G.cleanup) G.cleanup();
  G.cleanup = () => clearInterval(timer);
  function next() {
    busy = false;
    let it; do { it = pick(pool.items); } while (cur && it.key === cur.key && pool.items.length > 1);
    cur = it;
    const opts = shuffle([it, ...shuffle(pool.items.filter(x => x.key !== it.key && x.en !== it.en)).slice(0, 3)]);
    $('#sp-q').innerHTML = `<span class="ko" style="font-size:clamp(3rem,14vw,4.5rem);line-height:1.1">${esc(it.ko)}</span>
      <div class="opts">${opts.map(o => `<button class="opt" data-k="${esc(o.key)}"><span class="em">${o.emoji}</span><span>${esc(o.en)}</span></button>`).join('')}</div>`;
    $$('#sp-q .opt').forEach(b => b.onclick = () => {
      if (busy) return; busy = true;
      const ok = b.dataset.k === it.key;
      b.classList.add(ok ? 'right' : 'wrong');
      if (!ok) $$('#sp-q .opt').find(x => x.dataset.k === it.key).classList.add('right');
      sfx(ok ? 'good' : 'bad');
      if (ok) { score++; stat(); }
      setTimeout(next, ok ? 250 : 900);
    });
  }
  function end() {
    clearInterval(timer);
    const g = gameStats(p).speed; g.plays++;
    const best = score > g.best; if (best) g.best = score;
    addXP(score);
    if (score) { sfx('win'); if (best) burst(); }
    gameOver(box, { title: best && score ? '신기록! New record!' : `${score} correct!`, pose: score >= 10 ? 'cheer' : 'thumbs',
      text: `You read <b>${score}</b> ${pool.kind === 'words' ? 'words' : 'letters'} in 60 seconds. Best: <b>${g.best}</b>. (+${score} XP)`, again: playSpeed });
  }
}

/* ================= Track D: Korea Missions ================= */
const WAVE_GATE = { 1: 3, 2: 6, 3: 9 };
const WAVE_NAME = { 1: 'Getting there', 2: 'Eating & shopping', 3: 'Out and about' };
function missionState(p) { p.missions = p.missions || {}; return p.missions; }
function missionOpen(p, m) { return stagePassed(p, WAVE_GATE[m.wave]); }
function missionDone(p, m) { return !!missionState(p)[m.id]; }
function missionsDoneCount(p) { return D.missions.filter(m => missionDone(p, m)).length; }
function missionsOpenCount(p) { return D.missions.filter(m => missionOpen(p, m)).length; }

VIEWS.missions = main => {
  const p = me(), done = missionsDoneCount(p), open = missionsOpenCount(p);
  const card = m => {
    const unlocked = missionOpen(p, m), fin = missionDone(p, m), sc = missionState(p)[m.id];
    return `<button class="card mission${unlocked ? '' : ' locked'}${fin ? ' done' : ''}" ${unlocked ? `data-mission="${m.id}"` : 'disabled'}>
      <span class="mshot"><img src="assets/scenes/${m.scene}.webp" alt="" loading="lazy">
        <img class="mcard-cast" src="assets/cast/${m.face}.webp" alt="" loading="lazy">
        ${unlocked ? '' : `<span class="mlock">🔒 Pass Stage ${WAVE_GATE[m.wave]}</span>`}
        ${fin ? '<span class="mtick">✓</span>' : ''}</span>
      <span class="mbody">
        <span class="eyebrow">${m.emoji} <span class="ko">${esc(m.place)}</span></span>
        <h3>${esc(m.title)}</h3>
        <span class="muted">${esc(m.blurb)}</span>
        <span class="row" style="gap:6px;margin-top:2px">
          ${fin ? `<span class="pill done">✓ Completed${sc && sc.best ? ` · best ${sc.best}/${sc.of}` : ''}</span>` : unlocked ? '<span class="pill">▶ Start mission</span>' : ''}
        </span>
      </span></button>`;
  };
  main.innerHTML = `<div class="section-h" style="margin-top:0">
      <div><span class="eyebrow">Track D</span><h1>Korea Missions</h1></div>
      <p class="muted" style="max-width:44ch">Real situations from your trip. A Korean person talks to you, and you answer. ${done} of ${D.missions.length} missions completed.</p>
    </div>
    ${open === 0 ? `<div class="card" style="padding:18px;display:flex;gap:14px;align-items:center"><img src="${tiger('think')}" alt="" style="width:92px">
      <div><h3>Missions open after Stage 3</h3><p class="muted">Keep going on the Hangul Path — once you pass Stage 3 you'll be able to read enough to survive the airport!</p></div></div>` : ''}
    ${[1, 2, 3].map(w => `<div class="section-h"><h2>${WAVE_NAME[w]}</h2><span class="muted">Opens after Stage ${WAVE_GATE[w]}</span></div>
      <div class="grid missions">${D.missions.filter(m => m.wave === w).map(card).join('')}</div>`).join('')}`;
  $$('[data-mission]', main).forEach(b => b.onclick = () => startMission(b.dataset.mission));
};

function startMission(id) {
  const m = D.missions.find(x => x.id === id); if (!m) return;
  const steps = [{ type: 'mIntro', m }];
  m.turns.forEach(t => {
    if (t.npc) steps.push({ type: 'mLine', m, npc: t.npc, alone: !t.q });
    if (t.q) {
      if (t.q.kind === 'reply') steps.push({ type: 'mReply', m, q: t.q });
      else if (t.q.kind === 'listen') steps.push({ type: 'mListen', m, q: t.q });
      else steps.push({ type: 'mSay', m, q: t.q });
    }
  });
  steps.push({ type: 'mDone', m });
  openPlayer(steps, { title: m.title });
}

const castSrc = (m, n) => `assets/cast/${(n && n.face) || m.face || 'staff'}.webp`;
const mScene = (m, cast) => `<div class="mscene"><img src="assets/scenes/${m.scene}.webp" alt="" onerror="this.closest('.mscene').classList.add('noart');this.remove()"><span class="mplace">${m.emoji} <span class="ko">${esc(m.place)}</span></span>${cast ? `<img class="mcast" src="${castSrc(m)}" alt="">` : ''}</div>`;
function koLine(ko, rom, big) { return `<span class="ko${big ? ' big' : ''}">${esc(ko)}</span>${S.settings.rom === 'never' ? '' : `<span class="rom">${esc(rom)}</span>`}`; }

STEP.mIntro = (box, st) => {

STEP.mReply = (box, st) => {
  const q = st.q, opts = shuffle(q.options.map((o, k) => ({ o, k })));
  box.innerHTML = `${mScene(st.m)}
    <div class="q-prompt">${esc(q.prompt)}</div>
    <div class="opts">${opts.map(({ o }, i) => `<button class="opt mopt" data-i="${i}">${koLine(o.ko, o.rom)}<span class="en">${esc(o.en)}</span></button>`).join('')}</div>`;
  let chosen = null;
  $$('.mopt', box).forEach(b => b.onclick = () => {
    chosen = +b.dataset.i; $$('.mopt', box).forEach(x => x.classList.toggle('sel', x === b));
    say(opts[chosen].o.ko);
    foot('', '', 'Say it', submit);
  });
  function submit() {
    const ok = !!opts[chosen].o.ok;
    $$('.mopt', box).forEach((x, i) => { x.disabled = true; x.classList.remove('sel'); if (opts[i].o.ok) x.classList.add('right'); else if (i === chosen) x.classList.add('wrong'); });
    P.total++; if (ok) { P.right++; gainXP(3); }
    sfx(ok ? 'good' : 'bad');
    const right = opts.find(x => x.o.ok).o;
    say(right.ko);
    if (q.tip) box.insertAdjacentHTML('beforeend', `<div class="tipbox">💡 ${q.tip}</div>`);
    save();
    foot(ok ? pick(['✓ 완벽해요! Perfect!', '✓ 잘했어요! Well said!', '✓ 대박! Nailed it!'])
           : `✗ Better: <span class="ko">${esc(right.ko)}</span> — ${esc(right.en)}`, ok ? 'good' : 'bad', 'Continue', advance);
  }
  foot('', '', 'Say it', null, false);
};

STEP.mListen = (box, st) => {
  const q = st.q, opts = shuffle(q.options.map((o, k) => ({ o, k })));
  const written = !canSpeak() || S.settings.noVoice;
  box.innerHTML = `${mScene(st.m)}
    <div class="q-prompt">${esc(q.prompt)}</div>
    <div class="listen-box">
      ${written ? `<div style="width:100%">${koLine(q.ko, q.rom, true)}</div>`
                : `<button class="btn blue listen-btn" id="q-play">🔊 Play the line</button>
                   <button class="btn ghost small" id="q-slow">🐢 Slower</button>
                   <button class="btn ghost small" id="q-deaf">🔇 I can't hear it</button>`}
      <div class="tipbox warn" id="q-hint" hidden></div>
    </div>
    <div class="opts">${opts.map(({ o }, i) => `<button class="opt mopt" data-i="${i}"><span class="en big">${esc(o.en)}</span></button>`).join('')}</div>`;
  if (!written) {
    const hint = () => { const h = $('#q-hint', box); if (!h || !h.hidden) return; h.hidden = false; h.innerHTML = `🔇 <b>No sound?</b> They said: ${koLine(q.ko, q.rom)}`; };
    const play = slow => { say(q.ko, slow); setTimeout(() => { if (!speakStarted) hint(); }, 700); };
    $('#q-play', box).onclick = () => play(false);
    $('#q-slow', box).onclick = () => play(true);
    $('#q-deaf', box).onclick = hint;
    if (unlocked) setTimeout(() => play(false), 300);
  }
  let chosen = null;
  $$('.mopt', box).forEach(b => b.onclick = () => { chosen = +b.dataset.i; $$('.mopt', box).forEach(x => x.classList.toggle('sel', x === b)); foot('', '', 'Check', submit); });
  function submit() {
    const ok = !!opts[chosen].o.ok;
    $$('.mopt', box).forEach((x, i) => { x.disabled = true; x.classList.remove('sel'); if (opts[i].o.ok) x.classList.add('right'); else if (i === chosen) x.classList.add('wrong'); });
    P.total++; if (ok) { P.right++; gainXP(3); }
    sfx(ok ? 'good' : 'bad');
    box.insertAdjacentHTML('beforeend', `<div class="tipbox">They said ${koLine(q.ko, q.rom)} ${q.tip ? '<br>💡 ' + q.tip : ''}</div>`);
    save();
    foot(ok ? '✓ You understood it!' : '✗ Listen once more next time — you\'ll get it.', ok ? 'good' : 'bad', 'Continue', advance);
  }
  foot('', '', 'Check', null, false);
};

STEP.mSay = (box, st) => {
  const q = st.q;
  box.innerHTML = `${mScene(st.m)}
    <span class="eyebrow">Your turn to speak</span>
    <div class="say-card">${koLine(q.ko, q.rom, true)}<span class="en">${esc(q.en)}</span>
      <button class="btn blue" data-say="${esc(q.ko)}">🔊 Hear it</button></div>
    ${q.note ? speech('cheer', esc(q.note)) : ''}
    <p class="muted">Say it out loud three times — loud enough that someone else in the room can hear you.</p>`;
  if (unlocked) setTimeout(() => say(q.ko), 300);
  gainXP(2);
  foot('', '', 'I said it! ✓', advance);
};

STEP.mDone = (box, st) => {
  const m = st.m, p = me(), acc = P.total ? P.right / P.total : 1;
  const ms = missionState(p);
  const prev = ms[m.id];
  ms[m.id] = { done: true, best: Math.max(P.right, prev ? prev.best : 0), of: P.total, at: todayStr() };
  save();
  const win = acc >= 0.6;
  if (win) { sfx('win'); burst(); }
  const nextM = D.missions.find(x => !missionDone(p, x) && missionOpen(p, x));
  box.innerHTML = `<img src="${tiger(win ? 'cheer' : 'thumbs')}" alt="" style="width:180px">
    <h1>${win ? `${m.emoji} Mission complete!` : 'Good try!'}</h1>
    <p class="mn-text">${win ? `You handled <b>${esc(m.title.toLowerCase())}</b> in Korean. When you're really there, you'll know exactly what to say.`
                             : `You got through it — run the mission again and those phrases will start to stick.`}</p>
    <div class="row" style="justify-content:center"><span class="pill">✓ ${P.right}/${P.total} correct</span><span class="pill">⭐ +${P.xp} XP</span></div>
    ${nextM && nextM.id !== m.id ? `<p class="muted" style="margin-top:12px">Next up: ${nextM.emoji} ${esc(nextM.title)}</p>` : ''}`;
  $('#p-bar').style.width = '100%';
  foot('', '', 'Done', closePlayer);
};

function printPDF(src) {
  const f = document.createElement('iframe');
  f.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0';
  f.src = src;
  f.onload = () => {
    try { f.contentWindow.focus(); f.contentWindow.print(); }
    catch (e) { window.open(src, '_blank', 'noopener'); }   // some browsers block it — just open the file
    setTimeout(() => f.remove(), 60000);
  };
  f.onerror = () => { f.remove(); window.open(src, '_blank', 'noopener'); };
  document.body.appendChild(f);
  toast('Opening the print dialogue…');
}

/* ================= Level 2: 친구와 가족 ================= */
const L2 = window.HQ_L2 || { units: [], patterns: {}, cast: {}, words: [] };
const CAST = L2.cast;
const L2_GATE = 9;                       // Stage 9 must be passed before Level 2 opens
const ACTIVE_WORDS = 250;                // how many words sit in daily review at once

function l2Open(p) { return stagePassed(p, L2_GATE) || S.settings.l2Early; }
function l2State(p) { p.l2 = p.l2 || { sets: {}, patterns: {}, dialogues: {}, units: {} }; return p.l2; }
function unitOf(id) { return L2.units.find(u => u.id === id); }
function setDone(p, sid) { return !!l2State(p).sets[sid]; }
function patternDone(p, pid) { return !!l2State(p).patterns[pid]; }
function dialogueDone(p, did) { return !!l2State(p).dialogues[did]; }
function unitParts(u) {
  return [...u.sets.map(s => ({ kind: 'set', id: s.id, o: s })),
          ...u.patterns.map(pid => ({ kind: 'pattern', id: pid, o: L2.patterns[pid] })),
          ...u.dialogues.map(d => ({ kind: 'dialogue', id: d.id, o: d }))];
}
function unitDoneCount(p, u) {
  const st = l2State(p);
  return unitParts(u).filter(x => (x.kind === 'set' ? st.sets : x.kind === 'pattern' ? st.patterns : st.dialogues)[x.id]).length;
}
const unitComplete = (p, u) => unitDoneCount(p, u) === unitParts(u).length;
function unitOpen(p, u) { return u.id === 1 || unitComplete(p, unitOf(u.id - 1)); }
function l2WordCount(p) { return L2.words.filter(w => p.words[w.ko]).length; }
// Only a slice of the bank is in daily rotation, so review never becomes a chore.
function activeCount(p) { return Object.values(p.words).filter(w => !w.parked).length; }

/* ---------- the Learn view: Level 1 / Level 2 switch ---------- */
VIEWS.learn = (main, arg) => {
  const p = me();
  const lvl = arg ? +arg : (S.settings.lvl || 1);
  S.settings.lvl = lvl; save();
  const tabs = `<div class="lvl-switch" role="group" aria-label="Level">
    <button data-lvl="1" aria-pressed="${lvl === 1}"><span class="ko">가</span> Level 1 · Read</button>
    <button data-lvl="2" aria-pressed="${lvl === 2}" ${l2Open(p) ? '' : 'class="locked"'}>💬 Level 2 · Talk${l2Open(p) ? '' : ' 🔒'}</button>
  </div>`;
  main.innerHTML = tabs + '<div id="lvl-body"></div>';
  $$('[data-lvl]', main).forEach(b => b.onclick = () => go('learn', b.dataset.lvl));
  (lvl === 2 ? renderL2 : renderL1)($('#lvl-body', main));
};

function renderL2(box) {
  const p = me();
  if (!l2Open(p)) {
    box.innerHTML = `<div class="card" style="padding:20px;display:flex;gap:16px;align-items:center">
      <img src="${tiger('think')}" alt="" style="width:110px">
      <div><h2>Level 2 opens after Stage 9</h2>
        <p class="muted">Level 1 teaches you to <b>read</b> Korean. Level 2 teaches you to <b>talk</b> — with friends, and with family.
        Finish the Hangul Path first, then come back and we'll get you chatting.</p>
        <p class="muted" style="margin-top:8px">A grown-up can open it early in <b>Grown-ups</b> if you already read Korean.</p></div></div>`;
    return;
  }
  const done = L2.units.filter(u => unitComplete(p, u)).length;
  box.innerHTML = `<div class="section-h" style="margin-top:14px">
      <div><span class="eyebrow">Level 2 · 친구와 가족</span><h1>Talk with friends & family</h1></div>
      <p class="muted" style="max-width:44ch">${l2WordCount(p)} of ${L2.words.length} words learned · ${done} of ${L2.units.length} units complete.
        Every unit teaches words, one sentence pattern, and two real conversations.</p>
    </div>
    <div class="grid units">${L2.units.map(u => unitCard(p, u)).join('')}</div>
    ${L2.units.length < 12 ? `<p class="muted" style="margin-top:18px">Units ${L2.units.length + 1}–12 are being written next.</p>` : ''}`;
  $$('[data-unit]', box).forEach(b => b.onclick = () => go('unit', b.dataset.unit));
}

function unitCard(p, u) {
  const open = unitOpen(p, u), done = unitDoneCount(p, u), total = unitParts(u).length;
  return `<button class="card unit${open ? '' : ' locked'}${done === total ? ' done' : ''}" ${open ? `data-unit="${u.id}"` : 'disabled'}>
    <span class="ushot"><img src="assets/units/${u.img}.webp" alt="" loading="lazy"
        onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'uemoji',textContent:'${u.emoji}'}))">
      ${open ? '' : '<span class="mlock">🔒 Finish the unit before</span>'}
      ${done === total ? '<span class="mtick">✓</span>' : ''}</span>
    <span class="mbody">
      <span class="eyebrow">Unit ${u.id} · <span class="ko">${esc(u.ko)}</span></span>
      <h3>${esc(u.title)}</h3>
      <span class="muted">${esc(u.blurb)}</span>
      <span class="bar" style="margin-top:6px"><i style="width:${(done / total) * 100}%"></i></span>
      <span class="muted" style="font-size:.85rem">${done} / ${total} parts</span>
    </span></button>`;
}

/* ---------- one unit ---------- */
VIEWS.unit = (main, id) => {
  const p = me(), u = unitOf(+id); if (!u) return go('learn', 2);
  const st = l2State(p);
  const row = (kind, key, icon, eyebrow, title, sub, open) => {
    const fin = (kind === 'set' ? st.sets : kind === 'pattern' ? st.patterns : st.dialogues)[key];
    return `<button class="card lesson${open ? '' : ' locked'}" ${open ? `data-part="${kind}:${key}"` : 'disabled'}>
      <span class="lnum ${kind}">${icon}</span>
      <span style="flex:1;text-align:left"><span class="eyebrow">${eyebrow}</span><h3>${title}</h3><span class="muted">${sub}</span></span>
      <span class="pill${fin ? ' done' : ''}">${fin ? '✓ Done' : open ? 'Start →' : '🔒'}</span></button>`;
  };
  const parts = unitParts(u);
  let openUpTo = true;
  const rows = parts.map((x, i) => {
    const open = i === 0 || (parts[i - 1] && (parts[i - 1].kind === 'set' ? st.sets : parts[i - 1].kind === 'pattern' ? st.patterns : st.dialogues)[parts[i - 1].id]);
    if (x.kind === 'set') return row('set', x.id, '📚', `Words · set ${x.id}`, esc(x.o.title), `${x.o.words.length} new words`, open);
    if (x.kind === 'pattern') return row('pattern', x.id, '🧩', 'Sentence Lab', esc(x.o.name), `<span class="ko">${esc(x.o.ko)}</span>`, open);
    return row('dialogue', x.id, x.o.talk === 'banmal' ? '🧒' : '👵', `Conversation · ${x.o.talk === 'banmal' ? '반말 (friend)' : '존댓말 (polite)'}`, esc(x.o.title), esc(x.o.intro), open);
  }).join('');
  main.innerHTML = `<button class="btn ghost small" id="bk">← All units</button>
    <div class="section-h"><div><span class="eyebrow">Unit ${u.id} · <span class="ko">${esc(u.ko)}</span></span><h1>${u.emoji} ${esc(u.title)}</h1>
      <p class="muted">${esc(u.blurb)}</p></div></div>
    <div class="grid" style="gap:12px">${rows}</div>
    <div class="card panel" style="margin-top:20px"><h3>By the end of this unit I can…</h3>
      <ul class="can-list">${u.can.map(c => `<li>${esc(c)}</li>`).join('')}</ul></div>`;
  $('#bk', main).onclick = () => go('learn', 2);
  $$('[data-part]', main).forEach(b => b.onclick = () => {
    const [kind, key] = b.dataset.part.split(':');
    if (kind === 'set') startWordSet(u, key);
    else if (kind === 'pattern') startPattern(u, key);
    else startDialogue(u, key);
  });
};

/* ---------- word set lesson ---------- */
function startWordSet(u, sid) {
  const set = u.sets.find(s => s.id === sid);
  const steps = [{ type: 'intro', eyebrow: `Unit ${u.id} · words`, title: set.title,
    html: `<b>${set.words.length} new words</b> for talking about ${esc(u.title.toLowerCase())}. You'll meet each one, then be asked a few.` }];
  set.words.forEach(w => steps.push({ type: 'l2word', w }));
  const quiz = shuffle(set.words).slice(0, 8);
  quiz.forEach(w => steps.push(l2WordQ(w, set.words)));
  steps.push({ type: 'l2done', kind: 'sets', key: sid, unit: u, title: 'Words learned!',
    text: `<b>${set.words.length}</b> new words are in your word bank. They'll come back in your reviews and games.` });
  openPlayer(steps, { title: set.title });
}
STEP.l2word = (box, st) => {
  const w = st.w;
  box.innerHTML = `<span class="eyebrow">New word</span>
    <div class="l2-word"><span class="em">${w.emoji}</span>
      <span class="ko big">${esc(w.ko)}</span>
      ${S.settings.rom === 'never' ? '' : `<span class="rom">${esc(w.rom)}</span>`}
      <span class="en">${esc(w.en)}</span>
      <button class="btn blue" data-say="${esc(w.ko)}">🔊 Hear it</button></div>
    ${w.note ? `<div class="tipbox">💡 ${esc(w.note)}</div>` : ''}`;
  if (unlocked) setTimeout(() => say(w.ko), 300);
  if (addWord(w)) P.newWords++;
  gainXP(1); save();
  foot('', '', 'Next word →', advance);
};
function l2WordQ(w, pool) {
  const others = shuffle(pool.filter(x => x.ko !== w.ko)).slice(0, 3);
  const opts = shuffle([w, ...others]).map(x => ({ value: x.ko, html: `<span class="en big">${esc(x.en)}</span>` }));
  return { type: 'choice', eyebrow: 'Quick check', prompt: `What does <span class="ko">${esc(w.ko)}</span> mean?`,
    audio: w.ko, hint: `It means “${esc(w.en)}”.`, options: opts, answer: w.ko,
    answerText: `<b>${esc(w.en)}</b>`,
    onResult: ok => { const p = me(); const rec = p.words[w.ko]; if (rec) { rec[ok ? 'right' : 'wrong']++; } } };
}

/* ---------- Sentence Lab ---------- */
function startPattern(u, pid) {
  const pat = L2.patterns[pid];
  const steps = [
    { type: 'intro', eyebrow: `Unit ${u.id} · Sentence Lab`, title: pat.name,
      html: `Today's pattern: <b class="ko">${esc(pat.ko)}</b><br><br>${pat.teach}` },
    { type: 'l2examples', pat },
    { type: 'l2build', pat },
    { type: 'l2done', kind: 'patterns', key: pid, unit: u, title: 'Pattern unlocked!',
      text: `You can now use <b class="ko">${esc(pat.ko)}</b> in your own sentences. Listen for it in the conversations.` }
  ];
  openPlayer(steps, { title: pat.name });
}
STEP.l2examples = (box, st) => {
  const pat = st.pat;
  box.innerHTML = `<span class="eyebrow">See it three times</span><h2 class="ko">${esc(pat.ko)}</h2>
    <div class="ex-list">${pat.examples.map(e => `<button class="ex" data-say="${esc(e[0])}">
      <span class="ko">${esc(e[0])}</span>${S.settings.rom === 'never' ? '' : `<span class="rom">${esc(e[1])}</span>`}<span class="en">${esc(e[2])}</span>
      <span class="spk">🔊</span></button>`).join('')}</div>
    <p class="muted">Tap any sentence to hear it.</p>`;
  if (unlocked) setTimeout(() => say(pat.examples[0][0]), 300);
  gainXP(2);
  foot('', '', 'Now build one ✍️', advance);
};
STEP.l2build = (box, st) => {
  const pat = st.pat, want = pat.build.answer;
  let picked = [];
  box.innerHTML = `<span class="eyebrow">Build it</span><div class="q-prompt">${esc(pat.build.prompt)}</div>
    <div class="slot tiles" id="slot"><span class="muted">Tap the tiles in order</span></div>
    <div class="tile-tray" id="tray">${shuffle(pat.build.tiles).map(t => `<button class="tile ko" data-t="${esc(t)}">${esc(t)}</button>`).join('')}</div>
    <div class="row" style="justify-content:center"><button class="btn ghost small" id="t-undo">↺ Start again</button></div>`;
  const slot = $('#slot', box);
  const draw = () => {
    slot.innerHTML = picked.length ? picked.map(t => `<span class="ko">${esc(t)}</span>`).join(' ') : '<span class="muted">Tap the tiles in order</span>';
    foot('', '', 'Check', picked.length ? submit : null, !!picked.length);
  };
  $$('.tile', box).forEach(b => b.onclick = () => {
    if (b.disabled) return;
    b.disabled = true; picked.push(b.dataset.t); say(b.dataset.t); draw();
  });
  $('#t-undo', box).onclick = () => { picked = []; $$('.tile', box).forEach(b => b.disabled = false); draw(); };
  function submit() {
    const ok = picked.join(' ') === want.join(' ');
    $$('.tile', box).forEach(b => b.disabled = true);
    P.total++; if (ok) { P.right++; gainXP(4); }
    sfx(ok ? 'good' : 'bad');
    slot.innerHTML = `<span class="ko">${esc(want.join(' '))}</span>`;
    say(want.join(' '));
    foot(ok ? '✓ 완벽해요! That is exactly it.' : `✗ It should be: <span class="ko">${esc(want.join(' '))}</span>`, ok ? 'good' : 'bad', 'Continue', advance);
  }
  draw();
}

/* ---------- conversations ---------- */
function startDialogue(u, did) {
  const d = u.dialogues.find(x => x.id === did);
  const steps = [{ type: 'l2dIntro', u, d }];
  d.turns.forEach(t => {
    if (t.ko) steps.push({ type: 'mLine', m: dScene(d), npc: { who: CAST[t.who].name, ko: t.ko, rom: t.rom, en: t.en, face: t.who }, alone: !t.q });
    if (t.q) {
      if (t.q.kind === 'reply') steps.push({ type: 'mReply', m: dScene(d), q: t.q });
      else if (t.q.kind === 'listen') steps.push({ type: 'mListen', m: dScene(d), q: t.q });
      else steps.push({ type: 'mSay', m: dScene(d), q: t.q });
    }
  });
  steps.push({ type: 'l2replay', u, d });
  steps.push({ type: 'l2done', kind: 'dialogues', key: did, unit: u, title: 'Conversation complete!',
    text: `You just held a whole conversation in Korean${d.talk === 'banmal' ? ' — in <b>반말</b>, like friends do' : ' — in polite <b>존댓말</b>'}.` });
  openPlayer(steps, { title: d.title });
}
// dialogues borrow the mission renderer, so they need the same shape a mission has
const dScene = d => ({ scene: d.scene, emoji: d.talk === 'banmal' ? '🧒' : '👵', place: d.talk === 'banmal' ? '반말' : '존댓말', face: d.with[0] });

STEP.l2dIntro = (box, st) => {
  const d = st.d;
  box.innerHTML = `<span class="eyebrow">Unit ${st.u.id} · conversation</span><h1>${esc(d.title)}</h1>
    ${mScene(dScene(d), true)}
    <div class="who-row">${d.with.map(c => `<span class="who-chip"><img src="assets/cast/${c}.webp" alt=""><b class="ko">${esc(CAST[c].name)}</b><span class="muted">${esc(CAST[c].en)}</span></span>`).join('')}</div>
    <div class="tipbox ${d.talk === 'banmal' ? '' : 'warn'}">${d.talk === 'banmal'
      ? '🧒 <b>반말</b> — they are your age, so drop the 요.'
      : '👵 <b>존댓말</b> — they are older, so every ending keeps its 요.'}</div>
    ${speech('point', esc(d.intro))}`;
  foot('', '', 'Start the conversation →', advance);
};
STEP.l2replay = (box, st) => {
  const d = st.d;
  const lines = [];
  const lead = d.with[0];
  d.turns.forEach(t => {
    if (t.ko) lines.push({ who: CAST[t.who].name, face: t.who, ko: t.ko, rom: t.rom, en: t.en, me: false });
    if (!t.q) return;
    if (t.q.kind === 'say') { lines.push({ who: 'You', ko: t.q.ko, rom: t.q.rom, en: t.q.en, me: true }); return; }
    if (t.q.kind === 'listen') {
      // a listening question with no spoken line above it is still something they said
      if (!t.ko) lines.push({ who: CAST[t.who || lead].name, face: t.who || lead, ko: t.q.ko, rom: t.q.rom, en: (t.q.options.find(o => o.ok) || {}).en || '', me: false });
      return;
    }
    const r = (t.q.options || []).find(o => o.ok);
    if (r && r.ko) lines.push({ who: 'You', ko: r.ko, rom: r.rom, en: r.en, me: true });
  });
  box.innerHTML = `<span class="eyebrow">The whole conversation</span><h2>${esc(d.title)}</h2>
    <div class="script">${lines.map((l, i) => `<div class="sline ${l.me ? 'mine' : ''}" data-i="${i}">
      ${l.me ? '' : `<img class="sface" src="assets/cast/${l.face}.webp" alt="">`}
      <div class="sbubble"><span class="swho">${esc(l.who)}</span><span class="ko">${esc(l.ko)}</span>
        ${S.settings.rom === 'never' ? '' : `<span class="rom">${esc(l.rom)}</span>`}<span class="en">${esc(l.en)}</span></div></div>`).join('')}</div>
    <div class="row" style="justify-content:center"><button class="btn blue" id="play-all">▶ Play the whole thing</button></div>`;
  $$('.sline', box).forEach(el => el.onclick = () => say(lines[+el.dataset.i].ko));
  $('#play-all', box).onclick = () => {
    let i = 0;
    const next = () => {
      if (i >= lines.length) return;
      const el = $$('.sline', box)[i];
      $$('.sline', box).forEach(x => x.classList.remove('now'));
      el.classList.add('now'); el.scrollIntoView({ block: 'center', behavior: 'smooth' });
      const u = say(lines[i].ko); i++;
      if (u) u.onend = () => setTimeout(next, 420); else setTimeout(next, 1600);
    };
    next();
  };
  gainXP(3);
  foot('', '', 'Finish', advance);
};

/* ---------- shared finish step ---------- */
STEP.l2done = (box, st) => {
  const p = me(), s = l2State(p);
  s[st.kind][st.key] = { at: todayStr(), right: P.right, of: P.total };
  const u = st.unit;
  const finishedUnit = unitComplete(p, u);
  if (finishedUnit) s.units[u.id] = { at: todayStr() };
  save();
  if (finishedUnit) { sfx('win'); burst(); } else sfx('good');
  box.innerHTML = `<img src="${tiger(finishedUnit ? 'cheer' : 'thumbs')}" alt="" style="width:170px">
    <h1>${finishedUnit ? `Unit ${u.id} complete! 🎉` : st.title}</h1>
    <p class="mn-text">${finishedUnit ? `You've finished <b>${esc(u.title)}</b>. ${esc(u.can[0].charAt(0).toUpperCase() + u.can[0].slice(1))} — and three other things you couldn't do this morning.` : st.text}</p>
    <div class="row" style="justify-content:center">${P.total ? `<span class="pill">✓ ${P.right}/${P.total}</span>` : ''}<span class="pill">⭐ +${P.xp} XP</span>${P.newWords ? `<span class="pill done">📚 +${P.newWords} words</span>` : ''}</div>`;
  $('#p-bar').style.width = '100%';
  foot('', '', 'Done', closePlayer);
};

/* ================= boot ================= */
go(me() ? 'home' : 'profiles');
})();
</script>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="assets/icon-192.webp">
<link rel="apple-touch-icon" href="assets/icon-192.webp">
<meta name="theme-color" content="#FBF6EC">
<title>한글 Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&family=Noto+Sans+KR:wght@500;700;900&family=Anton&family=Black+Han+Sans&display=swap">
<style>
:root{
  --paper:#F4EFF9; --paper-2:#E6DCF2; --card:#FFFFFF; --ink:#1A1030; --muted:#6A5A86; --line:#D5C7EA;
  --con:#E8175D; --con-soft:#FFDCE8; --vow:#1E7FD6; --vow-soft:#D8ECFB; --fin:#F0A80C; --fin-soft:#FCEFD0;
  --green:#12A57E; --green-soft:#D2F5EA; --gold:#F5C518; --plum:#7B2CBF; --plum-soft:#EDE0FA;
  --shadow:0 3px 0 rgba(26,16,48,.18), 0 10px 26px -14px rgba(123,44,191,.5);
  --r-lg:16px; --r-md:10px; --r-sm:7px;
  --f-display:"Anton","Black Han Sans",system-ui,sans-serif;
  --f-body:"Nunito",ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-ko:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-ko-fun:"Black Han Sans","Noto Sans KR",sans-serif;
  --nav-h:68px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#120B22; --paper-2:#1D1136; --card:#221441; --ink:#F6EEFF; --muted:#AC9BD0; --line:#3E2A68;
    --con:#FF2E74; --con-soft:#45102C; --vow:#34B4FF; --vow-soft:#102E4D; --fin:#FFC01E; --fin-soft:#3E2E0C;
    --green:#1FE0A0; --green-soft:#0A3A2E; --gold:#FFD84D; --plum:#B072FF; --plum-soft:#2E1A55;
    --shadow:0 3px 0 rgba(0,0,0,.55), 0 14px 34px -16px rgba(232,23,93,.55);
  }
}
:root[data-theme="dark"]{
  --paper:#120B22; --paper-2:#1D1136; --card:#221441; --ink:#F6EEFF; --muted:#AC9BD0; --line:#3E2A68;
  --con:#FF2E74; --con-soft:#45102C; --vow:#34B4FF; --vow-soft:#102E4D; --fin:#FFC01E; --fin-soft:#3E2E0C;
  --green:#1FE0A0; --green-soft:#0A3A2E; --gold:#FFD84D; --plum:#B072FF; --plum-soft:#2E1A55;
  --shadow:0 3px 0 rgba(0,0,0,.55), 0 14px 34px -16px rgba(232,23,93,.55);
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
img{max-width:100%;display:block}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--vow);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);line-height:1.1;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(1.9rem,4.5vw,2.6rem)} h2{font-size:1.5rem} h3{font-size:1.15rem}
p{margin:0}
.ko{font-family:var(--f-ko);font-weight:700}
.c-con{color:var(--con)} .c-vow{color:var(--vow)} .c-fin{color:var(--fin)}
.muted{color:var(--muted)}
.eyebrow{font-size:.74rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
[hidden]{display:none!important}

/* dancheong band — the painted-palace stripe */
.dancheong{height:8px;background:
  repeating-linear-gradient(90deg,var(--con) 0 18px,var(--gold) 18px 24px,var(--green) 24px 42px,var(--gold) 42px 48px,var(--vow) 48px 66px,var(--gold) 66px 72px)}

/* ---------- shell ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1240px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:12px;flex-wrap:nowrap}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;flex:none}
.brand img{width:126px;height:126px;flex:none;object-fit:contain}
.brand b{font-family:var(--f-ko-fun);font-size:1.45rem;font-weight:400;letter-spacing:.01em;white-space:nowrap}
.brand b span{font-family:var(--f-display);font-weight:800}
.tabs{display:flex;gap:4px;margin-left:8px;flex-wrap:nowrap}
.tab{border:0;background:none;padding:8px 14px;border-radius:999px;font-weight:800;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.tab[aria-current="page"]{background:var(--ink);color:var(--paper)}
.tab .ti{font-size:1.1rem}
.spacer{flex:1;min-width:0}
#mebar{margin-left:auto;flex-wrap:nowrap;gap:12px}
.stat{display:flex;align-items:center;gap:4px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.me{display:flex;align-items:center;gap:10px;flex:none;border:2px solid var(--line);background:var(--card);border-radius:999px;padding:4px 18px 4px 4px;font-weight:800;font-size:1.1rem}
.me img{width:102px;height:102px;border-radius:50%;flex:none;object-fit:cover}
main{max-width:1040px;margin:0 auto;padding:22px 16px calc(var(--nav-h) + 40px)}
@media (min-width:761px){ main{padding-bottom:60px} }
/* keep the top bar on ONE row: the logo carries the brand, so the wordmark steps aside for the tabs */
@media (min-width:761px){ .brand b{display:none} }
@media (max-width:1270px){ .me span{display:none} .me{padding:4px} }
@media (max-width:1010px){ .topbar-in{gap:8px} .tabs{margin-left:4px} .tab{padding:6px 8px;font-size:.95rem} .brand img{width:72px;height:72px} .me img{width:64px;height:64px} }
@media (max-width:880px){ .stat.hide-sm{display:none} }
@media (max-width:760px){
  .tabs{position:fixed;left:0;right:0;bottom:0;margin:0;justify-content:space-around;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:30}
  .tab{flex-direction:column;gap:0;font-size:.72rem;padding:6px 10px;border-radius:14px;flex:1 1 0;min-width:0}
  .tab .ti{font-size:1.35rem}
  /* six tabs have to share a phone screen, so let the labels shrink rather than overflow */
  @media (max-width:430px){ .tabs{padding-left:2px;padding-right:2px} .tab{padding:6px 2px;font-size:.62rem} .tab .ti{font-size:1.2rem} }
  .brand b{font-size:1.2rem}
  .brand img{width:62px;height:62px}
  .me img{width:52px;height:52px}
  .me span{display:none} .me{padding:3px}
  .stat.hide-sm{display:none}
}

/* ---------- common ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:16px;padding:12px 20px;font-weight:800;font-size:1rem;background:var(--ink);color:var(--paper);box-shadow:0 4px 0 rgba(0,0,0,.25);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.btn.red{background:var(--con);color:#fff} .btn.blue{background:var(--vow);color:#fff} .btn.green{background:var(--green);color:#fff}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:none;border:2px solid var(--line)}
.btn.small{padding:8px 14px;font-size:.9rem;border-radius:12px}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:16px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:.78rem;font-weight:800;background:var(--paper-2);color:var(--muted)}
.pill.done{background:var(--green-soft);color:var(--green)}
.pill.soon{background:var(--plum-soft);color:var(--plum)}
.bar{height:12px;border-radius:99px;background:var(--paper-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--con),var(--gold));transition:width .4s}
.listen-box{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;width:100%}
.listen-btn{font-size:1.15rem;padding:16px 28px}
.tipbox.warn{background:var(--con-soft);color:var(--ink);font-size:.9rem}
.tipbox.good{background:var(--green-soft);color:var(--ink);font-size:.9rem}
.say{border:0;background:var(--vow-soft);color:var(--vow);border-radius:999px;width:44px;height:44px;display:inline-grid;place-items:center;font-size:1.25rem;flex:none}
.say.big{width:64px;height:64px;font-size:1.8rem}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 24px);transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:14px;font-weight:700;z-index:100;width:max-content;max-width:calc(100% - 32px);text-align:center;box-shadow:var(--shadow)}
.field{display:grid;gap:6px}
.field label{font-weight:800;font-size:.9rem}
.input{width:100%;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 12px;font:inherit}
textarea.input{min-height:110px;font-family:ui-monospace,Menlo,monospace;font-size:.8rem}

/* ---------- profiles ---------- */
.who{max-width:760px;margin:10px auto 0;text-align:center;display:grid;gap:22px;justify-items:center}
.who .hero-tiger{width:180px}
.who-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px;width:100%}
.who-card{padding:18px 14px;display:grid;justify-items:center;gap:8px;cursor:pointer;border:2px solid var(--line);background:var(--card);border-radius:var(--r-lg);box-shadow:var(--shadow);transition:transform .12s}
.who-card:hover{transform:translateY(-3px)}
.who-card img{width:110px;height:110px}
.who-card b{font-family:var(--f-display);font-size:1.35rem}
.who-card.add{border-style:dashed;box-shadow:none;background:transparent;color:var(--muted)}
.who-card.add .plus{width:110px;height:110px;border-radius:50%;display:grid;place-items:center;font-size:3rem;background:var(--paper-2)}
.avatars{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.av-opt{border:3px solid transparent;border-radius:50%;padding:2px;background:none}
.av-opt[aria-pressed="true"]{border-color:var(--con)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg button{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:12px;text-align:left;font-weight:700}
.seg button[aria-pressed="true"]{border-color:var(--vow);background:var(--vow-soft)}
.form-card{max-width:560px;margin:0 auto;padding:24px;display:grid;gap:18px}

/* ---------- home ---------- */
.home-top{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
@media (max-width:760px){.home-top{grid-template-columns:1fr}}
.greet{padding:22px;display:flex;gap:16px;align-items:center;position:relative;overflow:hidden}
.greet img{width:120px;flex:none;margin:-6px -6px -22px 0}
.greet h1 .ko{font-family:var(--f-ko-fun);font-weight:400}
.dday{padding:20px;display:grid;gap:6px;align-content:center;background:var(--ink);color:var(--paper);border:0}
.dday .num{font-family:var(--f-display);font-size:3.2rem;line-height:1;font-variant-numeric:tabular-nums}
.dday .num small{font-family:var(--f-ko-fun);font-size:1.2rem;margin-left:6px;opacity:.8}
.dday .eyebrow{color:inherit;opacity:.7}
.next{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-top:16px}
.action{padding:18px;display:flex;gap:14px;align-items:center;text-align:left;border:1px solid var(--line)}
.action .glyph{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;font-family:var(--f-ko);font-weight:900;font-size:2rem;flex:none}
.action .glyph.con{background:var(--con-soft);color:var(--con)} .action .glyph.vow{background:var(--vow-soft);color:var(--vow)} .action .glyph.grn{background:var(--green-soft);color:var(--green)} .action .glyph.plm{background:var(--plum-soft);color:var(--plum)}
.action .go{margin-left:auto;font-size:1.4rem;color:var(--muted)}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:30px 0 12px;flex-wrap:wrap}
.statrow{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media (max-width:760px){.statrow{grid-template-columns:repeat(2,1fr)}}
.tile{padding:14px 16px}
.tile .v{font-family:var(--f-display);font-size:1.9rem;line-height:1.1;font-variant-numeric:tabular-nums}
.tile .v small{font-size:1rem;color:var(--muted)}
/* journey map + passport */
.journey{display:grid;grid-template-columns:2fr 1fr;gap:16px;align-items:stretch}
@media (max-width:760px){.journey{grid-template-columns:1fr}}
.kmap{position:relative;border-radius:16px;overflow:hidden;aspect-ratio:1672/941;max-width:100%}
.kmap>.map-base{width:100%;height:100%;object-fit:cover}
.kmap svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.kmap polyline{fill:none;stroke:#fff;stroke-width:.6;stroke-dasharray:1.4 1.2;vector-effect:non-scaling-stroke;stroke-width:3;opacity:.9}
.pin{position:absolute;transform:translate(-50%,-50%);width:clamp(24px,4.4vw,36px);height:clamp(24px,4.4vw,36px);border-radius:50%;border:3px solid #fff;font-family:var(--f-display);font-weight:800;font-size:clamp(.75rem,1.6vw,1rem);display:grid;place-items:center;box-shadow:0 3px 8px rgba(0,0,0,.35);padding:0;color:#fff}
.pin.done{background:#23965F}
.pin.here{background:#E0483D;animation:pulse 1.6s infinite}
.pin.locked{background:#7d7891}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(224,72,61,.7)}50%{box-shadow:0 0 0 10px rgba(224,72,61,0)}}
.map-tiger{position:absolute;width:clamp(44px,9%,80px);transform:translate(-15%,-105%);pointer-events:none;filter:drop-shadow(0 3px 4px rgba(0,0,0,.3))}
.pass-card{display:flex;flex-direction:column;align-items:center;gap:12px;padding:18px;text-align:center;border:1px solid var(--line)}
.pass-card>img{width:min(150px,45%);filter:drop-shadow(0 6px 10px rgba(0,0,0,.25));transform:rotate(-4deg)}
.pass-card>span{display:grid;gap:8px;justify-items:center}
.mini-stamps{display:flex;gap:4px;justify-content:center;flex-wrap:wrap}
.mini-stamps img{width:44px;height:44px}
@media (max-width:760px){.pass-card{flex-direction:row;text-align:left}.pass-card>img{width:90px}.pass-card>span{justify-items:start}}
.passport-top{display:grid;grid-template-columns:minmax(0,220px) 1fr;gap:24px;align-items:center}
@media (max-width:560px){.passport-top{grid-template-columns:1fr;justify-items:center;text-align:center}}
.pcover{position:relative;max-width:220px;width:100%}
.pcover img{width:100%;filter:drop-shadow(0 10px 18px rgba(0,0,0,.3))}
.pname{position:absolute;left:0;right:0;bottom:12%;text-align:center;color:#F7C948;font-family:var(--f-display);font-weight:800;font-size:1.3rem;letter-spacing:.06em;text-transform:uppercase;text-shadow:0 1px 0 rgba(0,0,0,.4)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:18px;padding:20px;background:var(--card);background-image:repeating-linear-gradient(0deg,transparent 0 27px,var(--paper-2) 27px 28px)}
.pstamp{display:grid;justify-items:center;gap:4px;text-align:center;font-size:.85rem}
.pstamp .pimg{width:110px;height:110px;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center}
.pstamp img{width:100%;opacity:.12;filter:grayscale(1)}
.pstamp.got .pimg{border:0}
.pstamp.got img{opacity:.95;filter:none;animation:stampin .4s ease-out}
.pstamp .muted{font-size:.75rem;line-height:1.25}
.bar.thin{height:6px;width:80%}
@keyframes stampin{from{transform:scale(1.6);opacity:0}}
.stamp-won{width:200px;animation:stampin .5s ease-out;transform:rotate(-8deg)}
/* games */
.game{display:flex;gap:16px;align-items:center;padding:18px;flex-wrap:wrap}
.gicon{width:64px;height:64px;border-radius:18px;background:var(--plum-soft);display:grid;place-items:center;font-size:2.2rem;flex:none}
.gstamp{width:64px;height:64px;opacity:.15;filter:grayscale(1)}
.gstamp.got{opacity:1;filter:none;transform:rotate(-8deg)}
@media (max-width:560px){.game .btn{width:100%}.gstamp{display:none}}
.mem{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;width:100%}
@media (max-width:480px){.mem{grid-template-columns:repeat(3,minmax(0,1fr))}}
.mcard{position:relative;aspect-ratio:3/4;border:0;padding:0;background:none;perspective:600px;max-width:100%}
.mback,.mface{position:absolute;inset:0;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;backface-visibility:hidden;transition:transform .35s;padding:6px}
.mback{background:linear-gradient(135deg,#E0483D,#F2B43A);font-size:2rem;box-shadow:0 3px 0 rgba(0,0,0,.2)}
.mface{background:var(--card);border:2px solid var(--line);transform:rotateY(180deg)}
.mface .ko{font-size:clamp(1.3rem,5vw,2rem);line-height:1.1;word-break:keep-all}
.mface .em{font-size:1.6rem}
.mface .en{font-size:.78rem;font-weight:700;line-height:1.2}
.mcard.up .mback{transform:rotateY(180deg)}
.mcard.up .mface{transform:rotateY(0)}
.mcard.ok .mface{border-color:var(--green);background:var(--green-soft)}
.swipe-zone{position:relative;width:min(320px,100%);height:400px;max-width:100%}
.hint{position:absolute;top:8px;font-weight:800;padding:4px 10px;border-radius:10px;opacity:0;z-index:3;transition:opacity .1s}
.hint.left{left:0;background:var(--con-soft);color:var(--con)}
.hint.right{right:0;background:var(--green-soft);color:var(--green)}
#sw-stack{position:absolute;inset:0}
.scard{position:absolute;inset:40px 0 0;border-radius:24px;perspective:900px;touch-action:none;cursor:grab;user-select:none}
.scard.under{transform:scale(.94) translateY(12px);background:var(--paper-2);border:1px solid var(--line)}
.sin{position:absolute;inset:0;transition:transform .45s;transform-style:preserve-3d}
.scard.flipped .sin{transform:rotateY(180deg)}
.sf{position:absolute;inset:0;border-radius:24px;background:var(--card);border:2px solid var(--line);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px;backface-visibility:hidden}
.sf.back{transform:rotateY(180deg);background:var(--vow-soft);border-color:var(--vow)}
.sf .big{font-size:clamp(2.6rem,12vw,4rem);line-height:1.1;text-align:center}
.sf .em{font-size:4rem}
.sf .en{font-family:var(--f-display);font-size:1.5rem;text-align:center}
.sf .small{font-size:.8rem}
.swbtn{width:64px;height:64px;border-radius:50%;font-size:1.6rem;padding:0}
@media (prefers-reduced-motion:reduce){.pin.here{animation:none}.mback,.mface,.sin{transition:none}}
.stamps{display:grid;grid-template-columns:repeat(9,1fr);gap:10px}
@media (max-width:760px){.stamps{grid-template-columns:repeat(5,1fr)}}
.stamp{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;border:3px dashed var(--line);color:var(--line);font-family:var(--f-ko-fun);font-size:1.2rem;max-width:100%}
.stamp.got{border:3px solid var(--con);color:var(--con);background:var(--con-soft);transform:rotate(-8deg)}

/* ---------- path ---------- */
.path{display:grid;gap:14px;position:relative}
.stage{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;padding:16px 18px;text-align:left;border:1px solid var(--line);width:100%}
.stage .num{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-size:1.6rem;background:var(--paper-2);color:var(--muted)}
.stage.open .num{background:var(--con);color:#fff}
.stage.passed .num{background:var(--green);color:#fff}
.stage .lts{font-family:var(--f-ko);font-weight:700;font-size:1.15rem;letter-spacing:.12em}
.stage.locked{opacity:.6;box-shadow:none}
.stage h3{margin:2px 0}
@media (max-width:560px){.stage{grid-template-columns:auto 1fr}.stage .right{grid-column:1/-1}}
.lessons{display:grid;gap:12px}
.lesson{display:flex;gap:14px;align-items:center;padding:14px 16px;text-align:left;border:1px solid var(--line);width:100%}
.lesson .ic{width:50px;height:50px;border-radius:14px;display:grid;place-items:center;font-family:var(--f-ko);font-weight:900;font-size:1.3rem;background:var(--paper-2);flex:none}
.lesson.print-row{text-decoration:none;color:inherit}
.chips a.chip{text-decoration:none}
.lesson.locked{opacity:.55;box-shadow:none}
.stars{color:var(--gold);letter-spacing:2px;white-space:nowrap}
.stars .off{color:var(--line)}
.stage-head{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:end;margin-bottom:18px}
.stage-head .big-lts{font-family:var(--f-ko);font-weight:900;font-size:clamp(2rem,6vw,3.2rem);letter-spacing:.1em}
.back{border:0;background:none;font-weight:800;color:var(--muted);padding:0;margin-bottom:10px}

/* ---------- lesson player ---------- */
.player{position:fixed;inset:0;z-index:50;background:var(--paper);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.p-top{display:flex;align-items:center;gap:14px;max-width:760px;width:100%;margin:0 auto;padding:14px 16px}
.p-top .bar{flex:1}
.x{border:0;background:var(--paper-2);width:40px;height:40px;border-radius:50%;font-size:1.2rem;flex:none}
.p-body{flex:1;overflow-y:auto;padding:8px 16px 130px}
.p-in{max-width:680px;margin:0 auto;display:grid;gap:18px;justify-items:center;text-align:center}
.p-foot{position:fixed;left:0;right:0;bottom:0;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));background:var(--paper);border-top:1px solid var(--line);z-index:55}
.p-foot-in{max-width:680px;margin:0 auto;display:flex;align-items:center;gap:12px}
.p-foot.good{background:var(--green-soft);border-color:transparent}
.p-foot.bad{background:var(--con-soft);border-color:transparent}
.p-foot .msg{flex:1;font-weight:800;text-align:left}
.p-foot.good .msg{color:var(--green)} .p-foot.bad .msg{color:var(--con)}
.p-foot .btn{min-width:150px}
.speech{display:flex;gap:12px;align-items:flex-end;text-align:left;width:100%}
.speech img{width:110px;flex:none}
.bubble{background:var(--card);border:2px solid var(--line);border-radius:20px 20px 20px 4px;padding:14px 16px;font-size:1.05rem;position:relative}
.q-prompt{font-family:var(--f-display);font-size:1.5rem;font-weight:700}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;width:100%}
.opt{border:2px solid var(--line);border-bottom-width:5px;background:var(--card);border-radius:18px;padding:16px 12px;font-weight:800;font-size:1.1rem;min-height:74px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.opt .ko{font-size:2.1rem;line-height:1.1}
.opt .em{font-size:1.8rem;line-height:1}
.opt.sel{border-color:var(--vow);background:var(--vow-soft)}
.opt.right{border-color:var(--green);background:var(--green-soft)}
.opt.wrong{border-color:var(--con);background:var(--con-soft)}
.opt[disabled]{cursor:default}

/* meet */
.meet{display:grid;grid-template-columns:1fr 1fr;gap:16px;width:100%;align-items:stretch}

.mn-pic{aspect-ratio:1;border-radius:var(--r-lg);background:var(--paper-2);display:grid;place-items:center;overflow:hidden;max-width:100%}
.mn-pic img{width:100%;height:100%;object-fit:contain}
.mn-pic .em{font-size:clamp(4rem,16vw,7rem)}
.glyph-card{border-radius:var(--r-lg);display:grid;place-items:center;align-content:center;gap:4px;padding:16px;aspect-ratio:1;max-width:100%}
.glyph-card.con{background:var(--con-soft);color:var(--con)} .glyph-card.vow{background:var(--vow-soft);color:var(--vow)}
.glyph-card .g{font-family:var(--f-ko);font-weight:700;font-size:clamp(4.5rem,20vw,10rem);line-height:1}
.glyph-card .rom{font-family:var(--f-display);font-size:clamp(1.1rem,4vw,1.6rem);color:var(--ink)}
.intro-img{width:min(260px,70%);aspect-ratio:1;object-fit:cover;border-radius:var(--r-lg);max-width:100%}
.mn-text{font-size:1.15rem;font-weight:700;max-width:52ch}
.tipbox{background:var(--fin-soft);border-radius:var(--r-md);padding:12px 16px;text-align:left;width:100%;font-size:.98rem}
.tipbox b{color:var(--ink)}

.clue{display:flex;gap:14px;align-items:center;text-align:left;background:var(--paper-2);border-radius:var(--r-md);padding:12px;margin-top:12px;width:100%}
.clue .mn-pic{width:120px;height:120px;flex:none;aspect-ratio:auto;background:var(--card)}
.clue .mn-pic .em{font-size:3.4rem}
.clue-text{display:grid;gap:2px}
.clue-text .ko{font-size:2.2rem;line-height:1}
.clue-text p{font-size:.88rem}
@media (max-width:480px){.clue{flex-direction:column;text-align:center}.clue-text{justify-items:center}}

/* trace */
.trace-wrap{position:relative;width:min(340px,100%);aspect-ratio:1;max-width:100%}
.trace-wrap canvas{position:absolute;inset:0;width:100%;height:100%;border-radius:var(--r-lg);touch-action:none}
.trace-bg{background:var(--card);border:2px solid var(--line);background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:50% 50%;background-position:center}

/* build */
.slot{width:150px;height:150px;border-radius:var(--r-lg);border:3px dashed var(--line);display:grid;place-items:center;background:var(--card);max-width:100%}
.slot .ko{font-size:6rem;line-height:1}
.parts{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;width:100%}
.parts .label{width:100%;font-weight:800;font-size:.85rem;color:var(--muted)}
.jamo{width:66px;height:66px;border-radius:16px;border:2px solid var(--line);border-bottom-width:5px;background:var(--card);font-family:var(--f-ko);font-weight:700;font-size:2rem}
.jamo.con{color:var(--con)} .jamo.vow{color:var(--vow)}
.jamo[aria-pressed="true"].con{background:var(--con-soft);border-color:var(--con)}
.jamo[aria-pressed="true"].vow{background:var(--vow-soft);border-color:var(--vow)}

/* word card & block anatomy */
.wordcard{width:100%;padding:22px;display:grid;gap:14px;justify-items:center}
.wordcard .em{font-size:4.5rem;line-height:1}
.wordcard .en{font-family:var(--f-display);font-size:1.6rem}
.blocks{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.blk{width:92px;height:92px;border-radius:16px;background:var(--paper-2);display:grid;padding:8px;font-family:var(--f-ko);font-weight:700;font-size:2rem;line-height:1}
.blk.v{grid-template-columns:1fr 1fr;align-items:center;justify-items:center}
.blk.h{grid-template-rows:1fr 1fr;align-items:center;justify-items:center}
.blk.vt{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;align-items:center;justify-items:center}
.blk.vt .t{grid-column:1/-1}
.blk.ht{grid-template-rows:1fr 1fr 1fr;align-items:center;justify-items:center;font-size:1.5rem}
.blk .i{color:var(--con)} .blk .m{color:var(--vow)} .blk .t{color:var(--fin)}
.wk{font-family:var(--f-ko);font-weight:900;font-size:clamp(3rem,12vw,4.5rem);line-height:1.1}
.rom{font-family:var(--f-display);color:var(--muted);font-size:1.2rem}
.note{font-size:.95rem;color:var(--muted);max-width:48ch}

/* result */
.result-stars{font-size:3.2rem;letter-spacing:6px;color:var(--gold)}
.result-stars .off{color:var(--line)}
.burst{position:fixed;inset:0;pointer-events:none;z-index:90;overflow:hidden}
.burst span{position:absolute;top:-40px;font-size:1.6rem;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){.burst{display:none}.who-card,.btn{transition:none}}

.opts .opt:last-child:nth-child(odd){grid-column:1/-1}
.jamo.fin{color:var(--fin)}
.jamo[aria-pressed="true"].fin{background:var(--fin-soft);border-color:var(--fin)}
.big-blk .blk{width:120px;height:120px;font-size:2.6rem}
.big-blk .blk.ht{font-size:2rem}
.blocks .wtile{min-width:96px}
.rule-row{display:grid;grid-template-columns:auto auto auto 1fr auto;gap:10px;align-items:center;padding:10px 14px;text-align:left}
.rule-row .w{font-size:1.5rem}
.rule-row .s{font-size:1.3rem}
.rule-row .en{font-size:.9rem}
@media (max-width:480px){.rule-row{grid-template-columns:auto auto 1fr auto}.rule-row .en{grid-column:1/-1;grid-row:2}}
.big-lts.many{font-size:clamp(1.3rem,4vw,2rem);letter-spacing:.05em}
@media (max-width:560px){.stage-head{grid-template-columns:1fr}}

/* words */
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.wtile{padding:14px 10px;display:grid;justify-items:center;gap:2px;border:1px solid var(--line);text-align:center}
.wtile .em{font-size:1.8rem}
.wtile .ko{font-size:1.6rem}
.wtile .en{font-size:.85rem;color:var(--muted);line-height:1.25}
.boxes{display:flex;gap:3px;margin-top:6px}
.boxes i{width:10px;height:10px;border-radius:3px;background:var(--line)}
.boxes i.on{background:var(--green)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-weight:800;font-size:.85rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* parent */
.ptable{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.ptable th,.ptable td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.ptable th{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.scroll-x{overflow-x:auto}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:760px){.two{grid-template-columns:1fr}}
.panel{padding:20px;display:grid;gap:14px;align-content:start}

/* ---------- the app's bold manga look ---------- */
h1,h2,h3{letter-spacing:.02em;text-transform:uppercase}
h1{font-size:clamp(2rem,5vw,2.9rem)}
h1 .ko,h3 .ko{text-transform:none}
.eyebrow{letter-spacing:.16em}
.dancheong{height:7px;background:repeating-linear-gradient(115deg,var(--con) 0 24px,#160A26 24px 30px,var(--gold) 30px 50px,#160A26 50px 56px,var(--plum) 56px 78px,#160A26 78px 84px)}
.greet,.dday,.gicon{background-image:radial-gradient(currentColor .8px,transparent .9px);background-size:7px 7px;background-blend-mode:soft-light}
.greet{background-color:var(--card)}
.stage.open .num,.pin.here{box-shadow:0 0 0 4px var(--gold)}
.btn{border-radius:10px;text-transform:uppercase;letter-spacing:.04em;font-size:.95rem}
.btn.red{box-shadow:0 4px 0 #8C0B36,0 0 20px -6px var(--con)}
.btn.blue{box-shadow:0 4px 0 #10497E,0 0 20px -6px var(--vow)}
.btn.green{box-shadow:0 4px 0 #076A51}
.btn{border:2px solid rgba(0,0,0,.25)}
.card{border-width:2px}
.opt{border-radius:12px}
.jamo{border-radius:10px}
.glyph-card,.mn-pic{border-radius:14px}
.mback{background:linear-gradient(135deg,var(--vow),var(--plum))}
.bar i{background:linear-gradient(90deg,var(--vow),var(--con))}

/* ---- Track D: Korea Missions ---- */
.grid.missions{grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.card.mission{padding:0;overflow:hidden;text-align:left;display:flex;flex-direction:column;gap:0;border-bottom-width:5px}
.card.mission:disabled,.card.mission.locked{opacity:.62;cursor:default}
.mshot{position:relative;display:block;aspect-ratio:16/9;background:var(--paper-2);overflow:hidden}
.mshot img{width:100%;height:100%;object-fit:cover;display:block}
.card.mission.locked .mshot img{filter:grayscale(.85) brightness(.75)}
.mlock{position:absolute;inset:auto 0 0 0;background:rgba(0,0,0,.6);color:#fff;font-weight:800;font-size:.85rem;padding:6px 10px;text-align:center}
.mtick{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-weight:900;font-size:1.1rem;box-shadow:0 2px 0 rgba(0,0,0,.2)}
.mbody{display:grid;gap:5px;padding:14px 16px 16px}
.mbody h3{font-size:1.15rem}
.mbody .muted{font-size:.92rem;line-height:1.35}
.mscene{position:relative;width:100%;border-radius:var(--r-lg);overflow:hidden;aspect-ratio:16/9;background:var(--paper-2)}
.mscene img{width:100%;height:100%;object-fit:cover;display:block}
.mplace{position:absolute;left:10px;bottom:10px;background:rgba(0,0,0,.58);color:#fff;border-radius:999px;padding:5px 12px;font-weight:800;font-size:.95rem;backdrop-filter:blur(3px)}
.npc-line{display:grid;gap:10px;justify-items:center;width:100%}
.npc-line .who{font-family:var(--f-display);color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.04em;font-size:.82rem}
.npc-bubble{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:16px 20px;display:grid;gap:4px;justify-items:center;max-width:100%}
.npc-bubble .ko.big{font-size:clamp(1.7rem,6vw,2.4rem);line-height:1.25}
.npc-bubble .en{font-size:1.05rem;color:var(--muted);font-weight:700}
.opt.mopt{font-size:1rem;min-height:92px;padding:14px 12px;gap:3px}
.opt.mopt .ko{font-size:clamp(1.15rem,4vw,1.45rem);line-height:1.25}
.opt.mopt .rom{font-size:.92rem}
.opt.mopt .en{font-size:.92rem;color:var(--muted);font-weight:700;line-height:1.25}
.opt.mopt .en.big{font-size:1.1rem;color:var(--ink)}
.say-card{display:grid;gap:8px;justify-items:center;background:var(--plum-soft,var(--paper-2));border-radius:var(--r-lg);padding:20px 16px;width:100%}
.say-card .ko.big{font-size:clamp(1.8rem,7vw,2.8rem);line-height:1.25;text-align:center}
.say-card .en{font-size:1.1rem;color:var(--muted);font-weight:700;text-align:center}
@media (max-width:560px){.opts{grid-template-columns:1fr}}


/* mission characters */
.npc-line{grid-template-columns:auto 1fr;justify-items:stretch;align-items:end}
.npc-line .cast{width:clamp(96px,22vw,150px);align-self:end;filter:drop-shadow(0 6px 10px rgba(0,0,0,.22));flex:none}
.npc-said{display:grid;gap:8px;justify-items:start;min-width:0}
.npc-line .who{justify-self:start}
.npc-said .npc-bubble{border-radius:22px 22px 22px 6px;justify-items:start;text-align:left}
.npc-said .npc-bubble .ko.big{text-align:left}
.mscene .mcast{position:absolute;right:8px;bottom:0;width:26%;max-width:150px;height:auto;object-fit:contain;filter:drop-shadow(0 6px 10px rgba(0,0,0,.3))}
.mshot .mcard-cast{position:absolute;right:4px;bottom:0;width:30%;max-width:104px;height:auto;object-fit:contain;filter:drop-shadow(0 4px 7px rgba(0,0,0,.3))}
.card.mission.locked .mcard-cast{filter:grayscale(.85) brightness(.8)}
@media (max-width:430px){ .npc-line .cast{width:86px} }


/* ---- Level 2: 친구와 가족 ---- */
.lvl-switch{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
.lvl-switch button{border:2px solid var(--line);border-bottom-width:4px;background:var(--card);border-radius:14px;padding:12px 10px;font-weight:800;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:8px}
.lvl-switch button[aria-pressed="true"]{border-color:var(--plum);background:var(--plum-soft);color:var(--ink)}
.lvl-switch button.locked{opacity:.62}
.grid.units{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.card.unit{padding:0;overflow:hidden;text-align:left;display:flex;flex-direction:column;border-bottom-width:5px}
.card.unit.locked{opacity:.62;cursor:default}
.ushot{position:relative;display:block;aspect-ratio:16/9;overflow:hidden;background:linear-gradient(135deg,var(--vow),var(--plum));display:grid;place-items:center}
.ushot img{width:100%;height:100%;object-fit:cover;display:block}
.uemoji{font-size:3.4rem;filter:drop-shadow(0 3px 6px rgba(0,0,0,.35))}
.card.unit.locked .ushot img{filter:grayscale(.85) brightness(.75)}
.mscene.noart{background:linear-gradient(135deg,var(--vow),var(--plum));display:grid;place-items:center}
.mscene.noart .mplace{position:static;font-size:1.05rem}
.card.lesson .lnum.set{background:var(--vow-soft);color:var(--vow)}
.card.lesson .lnum.pattern{background:var(--plum-soft);color:var(--plum)}
.card.lesson .lnum.dialogue{background:var(--fin-soft);color:var(--fin)}
.can-list{margin:8px 0 0;padding-left:20px;display:grid;gap:5px;color:var(--muted);font-weight:700}
.can-list li::marker{color:var(--green)}
.l2-word{display:grid;gap:8px;justify-items:center;background:var(--paper-2);border-radius:var(--r-lg);padding:22px 16px;width:100%}
.l2-word .em{font-size:3.6rem;line-height:1}
.l2-word .ko.big{font-size:clamp(2.2rem,8vw,3.2rem);line-height:1.2;text-align:center}
.l2-word .en{font-family:var(--f-display);font-size:1.45rem;text-align:center}
.ex-list{display:grid;gap:10px;width:100%}
.ex{position:relative;border:2px solid var(--line);border-bottom-width:4px;background:var(--card);border-radius:14px;padding:14px 46px 14px 16px;display:grid;gap:2px;text-align:left}
.ex .ko{font-size:1.35rem}
.ex .en{color:var(--muted);font-weight:700}
.ex .spk{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:1.2rem}
.slot.tiles{min-height:74px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:12px}
.slot.tiles .ko{font-size:1.6rem}
.tile-tray{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;width:100%}
.tile{border:2px solid var(--line);border-bottom-width:5px;background:var(--card);border-radius:12px;padding:12px 16px;font-size:1.3rem;font-weight:700}
.tile:disabled{opacity:.35}
.who-row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;width:100%}
.who-chip{display:flex;align-items:center;gap:8px;background:var(--paper-2);border-radius:999px;padding:6px 16px 6px 6px}
.who-chip img{width:46px;height:46px;border-radius:50%;object-fit:cover;object-position:top}
.who-chip .muted{font-size:.85rem}
.script{display:grid;gap:12px;width:100%}
.sline{display:flex;gap:10px;align-items:flex-end;text-align:left;background:none;border:0;padding:0;cursor:pointer}
.sline.mine{flex-direction:row-reverse;justify-content:flex-start}
.sface{width:52px;height:52px;border-radius:50%;object-fit:cover;object-position:top;flex:none}
.sbubble{background:var(--card);border:2px solid var(--line);border-radius:18px 18px 18px 4px;padding:10px 14px;display:grid;gap:1px}
.sline.mine .sbubble{border-radius:18px 18px 4px 18px;background:var(--vow-soft);border-color:var(--vow)}
.sbubble .swho{font-size:.72rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sbubble .ko{font-size:1.25rem}
.sbubble .rom{font-size:.9rem}
.sbubble .en{font-size:.92rem;color:var(--muted);font-weight:700}
.sline.now .sbubble{border-color:var(--gold);box-shadow:0 0 0 4px var(--fin-soft)}


.booklet{display:flex;gap:16px;align-items:flex-start;background:var(--paper-2);border-radius:var(--r-lg);padding:14px;margin-top:6px}
.booklet img{width:124px;flex:none;border-radius:var(--r-md);box-shadow:var(--shadow)}
.booklet>div{display:grid;gap:4px}
@media (max-width:480px){ .booklet{flex-direction:column;align-items:center;text-align:center} .booklet .row{justify-content:center} }

</style>
</head>
<body>
<div class="topbar" id="topbar">
  <div class="dancheong"></div>
  <div class="topbar-in">
    <button class="brand" id="brand" aria-label="한글 Quest home"><img src="assets/logo.webp" alt=""><b>한글 <span>Quest</span></b></button>
    <nav class="tabs" id="tabs" hidden>
      <button class="tab" data-go="home"><span class="ti">🏠</span>Home</button>
      <button class="tab" data-go="learn"><span class="ti ko">가</span>Learn</button>

    </div>
  </div>
</div>
<main id="main"></main>
<div id="player-root"></div>

<script>
(() => {

/* ================= Hangul maths ================= */
const CHO = 'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ'.split('');

const JONG = ['', ...'ㄱㄲㄳㄴㄵㄶㄷㄹㄺㄻㄼㄽㄾㄿㅀㅁㅂㅄㅅㅆㅇㅈㅊㅋㅌㅍㅎ'.split('')];
const VERT = new Set('ㅏㅐㅑㅒㅓㅔㅕㅖㅣ'.split(''));
const HORZ = new Set('ㅗㅛㅜㅠㅡ'.split(''));
const ROM_I = {'ㄱ':'g','ㄲ':'kk','ㄴ':'n','ㄷ':'d','ㄸ':'tt','ㄹ':'r','ㅁ':'m','ㅂ':'b','ㅃ':'pp','ㅅ':'s','ㅆ':'ss','ㅇ':'','ㅈ':'j','ㅉ':'jj','ㅊ':'ch','ㅋ':'k','ㅌ':'t','ㅍ':'p','ㅎ':'h'};
const ROM_V = {'ㅏ':'a','ㅐ':'ae','ㅑ':'ya','ㅒ':'yae','ㅓ':'eo','ㅔ':'e','ㅕ':'yeo','ㅖ':'ye','ㅗ':'o','ㅘ':'wa','ㅙ':'wae','ㅚ':'oe','ㅛ':'yo','ㅜ':'u','ㅝ':'wo','ㅞ':'we','ㅟ':'wi','ㅠ':'yu','ㅡ':'eu','ㅢ':'ui','ㅣ':'i'};
function compose(i, v, t = '') { return String.fromCharCode(0xAC00 + (CHO.indexOf(i) * 21 + JUNG.indexOf(v)) * 28 + JONG.indexOf(t)); }
function decompose(ch) {
  const c = ch.charCodeAt(0) - 0xAC00;
  if (c < 0 || c > 11171) return null;
  return { i: CHO[Math.floor(c / 588)], v: JUNG[Math.floor((c % 588) / 28)], t: JONG[c % 28] };
}
const ROM_F = {'ㄱ':'k','ㄲ':'k','ㅋ':'k','ㄴ':'n','ㄷ':'t','ㅅ':'t','ㅆ':'t','ㅈ':'t','ㅊ':'t','ㅌ':'t','ㅎ':'t','ㄹ':'l','ㅁ':'m','ㅂ':'p','ㅍ':'p','ㅇ':'ng'};
const FIN_ROM = {'ㄱ':'k','ㄴ':'n','ㄷ':'t','ㄹ':'l','ㅁ':'m','ㅂ':'p','ㅇ':'ng'};
const BASIC_CON = 'ㄱㄴㄷㄹㅁㅂㅅㅈㅊㅎ'.split('');
const BASIC_VOW = 'ㅏㅓㅗㅜㅡㅣㅐ'.split('');
function romSyl(s) { const d = decompose(s); if (!d) return s; let r = ROM_I[d.i] + ROM_V[d.v]; if (d.i === 'ㅅ' && d.v === 'ㅣ') r = 'shi'; return r + (ROM_F[d.t] || ''); }
function blockHTML(ch) {
  const d = decompose(ch); if (!d) return '';
  const hz = HORZ.has(d.v), cls = (hz ? 'h' : 'v') + (d.t ? 't' : '');
  const cl = hz && d.t ? 'ht' : cls;
  return `<div class="blk ${cl}" aria-label="${esc(ch)}"><span class="i">${d.i}</span><span class="m">${d.v}</span>${d.t ? `<span class="t">${d.t}</span>` : ''}</div>`;
}

/* ================= progress helpers ================= */
function addXP(n) {

  p.xp += n;
  const t = todayStr();
  if (p.lastDay !== t) {
    const y = todayStr(new Date(Date.now() - DAY));

const stageOf = id => D.stages.find(s => s.id === id);
const lessonById = id => { for (const s of D.stages) for (const l of (s.lessons || [])) if (l.id === id) return { stage: s, lesson: l }; return null; };
const stagePassed = (p, id) => !!(p.stages[id] && p.stages[id].passed);
const stageOpen = (p, id) => { const s = stageOf(id); return !!s && !s.soon && (id === 1 || stagePassed(p, id - 1)); };
function lessonOpen(p, stage, idx) { if (!stageOpen(p, stage.id)) return false; return idx === 0 || !!p.lessons[stage.lessons[idx - 1].id]; }
const allLessonsDone = (p, stage) => (stage.lessons || []).every(l => p.lessons[l.id]);
function knownLetters(uptoStage) { const out = []; D.stages.forEach(s => { if (s.id <= uptoStage && !s.soon) out.push(...s.letters); }); return out; }
function wordsFor(p, stageId) { return D.words.filter(w => w.stage === stageId && (!w.for || w.for === p.family)); }
function lessonWords(p, stage, lesson) { const ws = wordsFor(p, stage.id); return lesson.slice ? ws.slice(lesson.slice[0], lesson.slice[1]) : ws; }
function lettersLearned(p) { return Object.values(p.letters).filter(x => x.seen).length; }
function wordCount(p) { return Object.keys(p.words).length; }
function addWord(w, box = 1) {
  const p = me(); if (!p || p.words[w.ko]) return false;
  p.words[w.ko] = { box, due: Date.now() + (box > 1 ? BOX_GAP[box] : 0), right: 0, wrong: 0, added: Date.now() };
  rotateWords(p);
  return true;
}
const BOX_GAP = { 1: 0, 2: DAY, 3: 3 * DAY, 4: 7 * DAY, 5: 14 * DAY };
function dueWords(p) {
  const now = Date.now();
  return D.words.filter(w => { const r = p.words[w.ko]; return r && !r.parked && r.due <= now; });
}
// A word bank of 1,000+ would make daily review a chore, so only ACTIVE_WORDS are in
// rotation. New words park themselves until older ones are well known, then take their place.
function rotateWords(p) {
  const recs = Object.entries(p.words);
  const live = recs.filter(([, r]) => !r.parked);
  if (live.length <= ACTIVE_WORDS) {
    // room to spare: wake the oldest parked words
    const parked = recs.filter(([, r]) => r.parked).sort((a, b) => a[1].added - b[1].added);
    parked.slice(0, ACTIVE_WORDS - live.length).forEach(([, r]) => { delete r.parked; r.due = Date.now(); });
  } else {
    // too many: park the newest ones that haven't been answered yet
    live.filter(([, r]) => r.box === 1 && !r.right).sort((a, b) => b[1].added - a[1].added)
        .slice(0, live.length - ACTIVE_WORDS).forEach(([, r]) => { r.parked = true; });
  }
}
function nextStep(p) {
  for (const s of D.stages) {
    if (s.soon) break;
    if (!stageOpen(p, s.id)) break;
    if (stagePassed(p, s.id)) continue;
    const i = s.lessons.findIndex(l => !p.lessons[l.id]);
    if (i >= 0) return { kind: 'lesson', stage: s, lesson: s.lessons[i] };
    return { kind: 'challenge', stage: s };
  }
  return null;
}

/* ================= audio ================= */
let koVoice = null;
function pickVoice() {
  if (!('speechSynthesis' in window)) return;
  const vs = speechSynthesis.getVoices();
  // "Google 한국의" is far and away the most natural-sounding Korean voice, so it wins
  // whenever it's installed. The system voices below it are the fallbacks, in order.
  koVoice = (S.settings.voiceURI && vs.find(v => v.voiceURI === S.settings.voiceURI))
    || vs.find(isBestKo)
    || vs.find(v => /^ko/i.test(v.lang) && /yuna|sora/i.test(v.name))
    || vs.find(v => /^ko/i.test(v.lang)) || null;
}
// The Google Korean voice ships with Chrome; its name is localised, so match on the vendor word
// in a few spellings rather than the whole label.
const isBestKo = v => /^ko/i.test(v.lang) && /google|구글/i.test(v.name);
const hasBestKo = () => ('speechSynthesis' in window) && speechSynthesis.getVoices().some(isBestKo);
// Rough English-letter reading, used only when the device has no Korean voice at all.
function romanize(text) {
  return [...text].map(ch => {
    const d = decompose(ch);
    if (!d) return ch;
    let r = ROM_I[d.i] + ROM_V[d.v] + (ROM_F[d.t] || '');
    if (d.i === 'ㅅ' && d.v === 'ㅣ') r = 'shee';
    return r.replace(/eo/g, 'aw').replace(/eu/g, 'uh').replace(/ae/g, 'eh');
  }).join(' ');
}
if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
let speechBroken = false, unlocked = false;
// Browsers block speech until the page has been tapped once, so prime it on the first touch.
function unlockSpeech() {
  if (unlocked || !('speechSynthesis' in window)) return;
  unlocked = true;
  try { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); } catch (e) {}
}
document.addEventListener('pointerdown', unlockSpeech, true);
document.addEventListener('keydown', unlockSpeech, true);
function canSpeak() {
  if (!('speechSynthesis' in window) || speechBroken || S.settings.noVoice) return false;
  if (!koVoice) pickVoice();
  return !!koVoice || !!S.settings.romVoice;
}
// Chrome quietly wedges its speech queue (an utterance collected by the garbage collector,
// a cancel() that never clears, a pause after ~15s). Hence the kept reference, the resume
// ticker and the one retry: without them the very first lesson sound can silence the rest.
let curUtter = null, resumeTicker = null;
let speakStarted = false;
function speakNow(text, rate, korean) {
  const u = new SpeechSynthesisUtterance(text);
  u.onstart = () => { speakStarted = true; };
  if (korean) { u.lang = 'ko-KR'; if (koVoice) { try { u.voice = koVoice; } catch (e) {} } }
  u.rate = rate;
  u.onerror = e => { if (e.error !== 'interrupted' && e.error !== 'canceled') { speechBroken = true; showVoiceNote(); } };
  u.onend = () => { clearInterval(resumeTicker); resumeTicker = null; };
  curUtter = u;                       // keep a reference so it isn't garbage-collected mid-sentence
  try {
    if (speechSynthesis.speaking || speechSynthesis.pending) speechSynthesis.cancel();
    speechSynthesis.resume();
    speechSynthesis.speak(u);
  } catch (e) {}
  clearInterval(resumeTicker);
  resumeTicker = setInterval(() => { try { if (speechSynthesis.speaking) speechSynthesis.resume(); else { clearInterval(resumeTicker); resumeTicker = null; } } catch (e) {} }, 6000);
  return u;
}
// Chrome on macOS silently skips very short phrases (a single syllable like 아), so short
// items are said twice with a pause — which is what you want when learning a letter anyway.
function padShort(t) {
  const n = [...t].length;
  if (n <= 2) return t + ', ' + t;
  if (n <= 4) return t + '.';
  return t;
}
function say(text, slow) {
  if (!('speechSynthesis' in window)) { toast('This browser can’t speak. Try Safari or Chrome.'); return; }
  if (!koVoice) pickVoice();
  const approx = !koVoice && S.settings.romVoice;
  const spoken = padShort(approx ? romanize(text) : text);
  const rate = approx ? (slow ? 0.6 : 0.8) : (slow ? 0.55 : S.settings.rate);
  unlockSpeech();
  speakStarted = false;
  const utter = speakNow(spoken, rate, !approx);
  // if the queue was wedged, nothing starts at all: clear it out and try once more
  setTimeout(() => {
    try {
      if (!speakStarted && !speechSynthesis.speaking && !speechSynthesis.pending) {
        speechSynthesis.cancel(); speechSynthesis.resume(); speakNow(spoken, rate, !approx);
      }
    } catch (e) {}
  }, 300);
  return utter;
}
function voiceHelp() {

let actx = null;
function sfx(kind) {
  if (!S.settings.sfx) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const notes = kind === 'good' ? [660, 880] : kind === 'win' ? [523, 659, 784, 1046] : [220, 180];
    notes.forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = kind === 'bad' ? 'triangle' : 'sine'; o.frequency.value = f;
      const t = actx.currentTime + i * 0.09;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.18, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t + 0.25);
    });
  } catch (e) {}
}

      <span class="mini-stamps">${D.stamps.filter(st => stampEarned(p, st)).slice(-4).map(st => `<img src="assets/stamps/${st.id}.webp" alt="">`).join('') || '<span class="muted">Pass Stage 1 for your first stamp!</span>'}</span>

};

/* ---------- path ---------- */
VIEWS.path = main => renderL1(main);
function renderL1(main) {
  const p = me();
  main.innerHTML = `<div class="section-h" style="margin-top:0"><div><span class="eyebrow">Track A</span><h1>The Hangul Path</h1></div><p class="muted" style="max-width:40ch">40 letters in 9 stages. <b class="c-con">Consonants are red</b>, <b class="c-vow">vowels are blue</b>.</p></div>
  <div class="path">${D.stages.map(s => {
    const passed = stagePassed(p, s.id), open = stageOpen(p, s.id);
    const done = (s.lessons || []).filter(l => p.lessons[l.id]).length;
    const state = passed ? 'passed' : open ? 'open' : 'locked';
    const right = s.soon ? '<span class="pill soon">Coming soon</span>' : passed ? `<span class="pill done">✓ Stamp earned</span>` : open ? `<span class="pill">${done}/${s.lessons.length} lessons</span>` : '<span class="pill">🔒 Pass the stage before</span>';
    return `<button class="card stage ${state}" data-stage="${s.id}" ${s.soon ? 'disabled' : ''}>
      <span class="num">${passed ? '✓' : s.id}</span>
      <span><span class="eyebrow">Stage ${s.id} · <span class="ko">${s.ko}</span></span><h3>${esc(s.title)}</h3>
      <span class="lts">${s.display ? `<span class="c-fin">${s.display}</span>` : s.letters.map(x => `<span class="${L[x] ? (L[x].type === 'vow' ? 'c-vow' : 'c-con') : (/[ㅏ-ㅣ]/.test(x) ? 'c-vow' : 'c-con')}">${x}</span>`).join(' ')}</span>
      <span class="muted" style="display:block;font-size:.92rem">${esc(s.blurb)}</span></span>
      <span class="right">${right}</span></button>`;
  }).join('')}</div>`;
  $$('[data-stage]', main).forEach(b => b.onclick = () => {
    const id = +b.dataset.stage;
    if (!stageOpen(p, id)) { toast(`Pass Stage ${id - 1} first, or test out of it.`); return; }
    go('stage', id);
  });
}
VIEWS.stage = (main, id) => {
  const p = me(), s = stageOf(id);
  const allDone = allLessonsDone(p, s), passed = stagePassed(p, id);
  main.innerHTML = `<button class="back" id="bk">← All stages</button>
  <div class="stage-head"><div><span class="eyebrow">Stage ${s.id} · <span class="ko">${s.ko}</span></span><h1>${esc(s.title)}</h1><p class="muted">${esc(s.blurb)}</p></div>
  <div class="big-lts${s.letters.length > 6 ? ' many' : ''}">${s.display ? `<span class="c-fin">${s.display}</span>` : s.letters.map(x => `<span class="${L[x].type === 'vow' ? 'c-vow' : 'c-con'}">${x}</span>`).join('')}</div></div>
  <div class="lessons">
  ${s.lessons.map((l, i) => {
    const open = lessonOpen(p, s, i), rec = p.lessons[l.id];
    const ic = l.type === 'letters' ? `<span class="ic ${L[l.letters[0]].type === 'vow' ? 'c-vow' : 'c-con'}">${l.letters.slice(0, 2).join('')}</span>`
      : l.type === 'finals' ? `<span class="ic c-fin" style="font-size:1rem">${l.finals.slice(0, 2).join('')}</span>`
      : l.type === 'rules' ? `<span class="ic" style="background:var(--plum-soft)">✨</span>`
      : `<span class="ic" style="color:var(--green)">📖</span>`;
    const sub = l.type === 'letters' ? `<span class="ko muted">${l.letters.join('  ')}</span>`
      : l.type === 'finals' ? `<span class="muted">Endings: <span class="ko">${l.finals.join('  ')}</span></span>`
      : l.type === 'rules' ? `<span class="muted">${l.rules.map(r => `${D.rules[r].name} <span class="ko">${D.rules[r].ko}</span>`).join(' · ')}</span>`
      : `<span class="muted">${lessonWords(p, s, l).length} words</span>`;
    return `<button class="card lesson ${open ? '' : 'locked'}" data-lesson="${l.id}">${ic}<span style="flex:1"><span class="eyebrow">Lesson ${i + 1}${l.type === 'words' ? ' · Words' : ''}</span><h3>${esc(l.title)}</h3>${sub}</span>${rec ? starsHTML(rec.stars) : open ? '<span class="pill">Start →</span>' : '<span class="pill">🔒</span>'}</button>`;
  }).join('')}
    <a class="card lesson print-row" href="assets/printables/stage-${s.id}.pdf" target="_blank" rel="noopener">
      <span class="ic" style="background:var(--fin-soft)">🖨️</span>
      <span style="flex:1"><span class="eyebrow">Practice sheet · PDF</span><h3>Write it by hand</h3>
      <span class="muted">Every letter and word from this stage, with tracing rows and blank boxes.</span></span>
      <span class="pill">Open →</span></a>
    <button class="card lesson ${allDone || passed ? '' : 'locked'}" id="chal"><span class="ic" style="background:var(--plum-soft)">🏆</span><span style="flex:1"><span class="eyebrow">Stage challenge</span><h3>Earn your passport stamp</h3><span class="muted">12 questions. Get 10 right to pass.</span></span>${passed ? `<span class="pill done">✓ ${p.stages[id].score}/12</span>` : allDone ? '<span class="pill">Go →</span>' : '<span class="pill">🔒</span>'}</button>
  </div>
  ${passed ? '' : `<div class="card panel" style="margin-top:22px;box-shadow:none;background:var(--paper-2)"><div class="row" style="justify-content:space-between"><div><h3>${s.kind ? 'Know it already?' : 'Already know these letters?'}</h3><p class="muted">${s.kind ? 'Already know this?' : ''} Take the challenge now. If you pass, the whole stage is marked complete.</p></div><button class="btn ghost small" id="testout">Test out</button></div></div>`}`;
  $('#bk', main).onclick = () => go('learn', 1);
  $$('[data-lesson]', main).forEach((b, i) => b.onclick = () => lessonOpen(p, s, i) ? startLesson(b.dataset.lesson) : toast('Finish the lesson before this one first.'));
  $('#chal', main).onclick = () => (allDone || passed) ? startChallenge(id, false) : toast('Finish all the lessons to unlock the challenge.');

};

  const due = dueWords(p).length;
  const stagesWith = [...new Set(mine.map(w => w.stage))];
  main.innerHTML = `<div class="section-h" style="margin-top:0"><div><span class="eyebrow">Track B</span><h1>Word Bank</h1></div>
    <button class="btn blue" id="rv" ${due ? '' : 'disabled'}>Review ${due} due →</button></div>
  <div class="card panel" style="margin-bottom:18px"><div class="row" style="justify-content:space-between"><b>${mine.length} of ${D.WORD_GOAL} words</b><span class="muted">Next badge at ${[100, 250, 500, 750, 1000].find(n => n > mine.length) || 1000}</span></div><div class="bar"><i style="width:${Math.max(1, mine.length / D.WORD_GOAL * 100)}%"></i></div>
  <p class="muted" style="font-size:.9rem">Every word moves through 5 boxes <span class="boxes" style="display:inline-flex;vertical-align:middle"><i class="on"></i><i class="on"></i><i></i><i></i><i></i></span>. Get it right and it moves up a box and comes back later. Miss it and it goes back to box 1.</p></div>
  ${mine.length ? `<div class="chips" style="margin-bottom:14px"><button class="chip" data-f="all" aria-pressed="${filter === 'all'}">All</button>${stagesWith.map(s => `<button class="chip" data-f="${s}" aria-pressed="${filter === String(s)}">${s > 100 ? 'Unit ' + (s - 100) : 'Stage ' + s}</button>`).join('')}</div>
  <div class="wgrid">${shown.map(w => { const r = p.words[w.ko]; return `<button class="card wtile" data-say="${esc(w.ko)}"><span class="em">${w.emoji}</span><span class="ko">${esc(w.ko)}</span><span class="en">${esc(w.en)}</span><span class="boxes" aria-label="Box ${r.box} of 5">${[1, 2, 3, 4, 5].map(i => `<i class="${i <= r.box ? 'on' : ''}"></i>`).join('')}</span></button>`; }).join('')}</div>`
  : `<div class="card panel" style="text-align:center;justify-items:center"><img src="${tiger('think')}" alt="" style="width:130px"><h3>No words yet</h3><p class="muted">Finish Stage 1 lessons to read your first Korean words.</p><button class="btn red" id="gp">Go to the Hangul Path</button></div>`}`;

  const gp = $('#gp', main); if (gp) gp.onclick = () => go('learn', 1);
};

STEP.trace = (box, st) => {
  const d = L[st.letter], color = d.type === 'vow' ? 'vow' : 'con';
  box.innerHTML = `<span class="eyebrow">Trace · follow the numbers</span><h2>Write <span class="ko c-${color}">${st.letter}</span></h2>
    <div class="trace-wrap"><canvas class="trace-bg" id="tg"></canvas><canvas id="ti" aria-label="Tracing area"></canvas></div>
    <div class="row" style="justify-content:center"><button class="btn ghost small" id="t-watch">▶ Watch the strokes</button><button class="btn ghost small" id="t-clear">↺ Clear</button></div>
    <p class="muted" id="t-hint">Start at dot 1 and follow the arrows. Korean is written top to bottom, left to right.</p>`;
  const cg = $('#tg', box), ci = $('#ti', box);
  const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  let W, dpr, userPts = [], cur = null, drawing = false;
  const toPx = v => (v / 100) * W;
  function size() {
    dpr = window.devicePixelRatio || 1; W = ci.clientWidth;
    [cg, ci].forEach(c => { c.width = W * dpr; c.height = W * dpr; c.getContext('2d').setTransform(dpr, 0, 0, dpr, 0, 0); });
    drawGuide(); redrawInk();
  }
  function drawGuide(progress) {
    const g = cg.getContext('2d'); g.clearRect(0, 0, W, W);
    g.lineCap = 'round'; g.lineJoin = 'round';
    d.strokes.forEach((s, si) => {
      g.strokeStyle = cssVar('--line'); g.lineWidth = W * 0.11;
      g.beginPath(); s.forEach(([x, y], k) => k ? g.lineTo(toPx(x), toPx(y)) : g.moveTo(toPx(x), toPx(y))); g.stroke();
    });
    if (progress !== undefined) {
      g.strokeStyle = cssVar('--' + color); g.lineWidth = W * 0.07;
      let left = progress;
      d.strokes.forEach(s => {
        if (left <= 0) return;
        const n = Math.min(s.length, Math.floor(left) + 1); g.beginPath();
        for (let k = 0; k < n; k++) { const [x, y] = s[k]; k ? g.lineTo(toPx(x), toPx(y)) : g.moveTo(toPx(x), toPx(y)); }
        if (n < s.length) { const f = left - Math.floor(left), [x0, y0] = s[n - 1], [x1, y1] = s[n]; g.lineTo(toPx(x0 + (x1 - x0) * f), toPx(y0 + (y1 - y0) * f)); }
        g.stroke(); left -= (s.length - 1);
      });
    }
    d.strokes.forEach((s, si) => {
      const [x, y] = s[0], [x2, y2] = s[1];
      const ang = Math.atan2(y2 - y, x2 - x);
      g.fillStyle = cssVar('--' + color); g.beginPath(); g.arc(toPx(x), toPx(y), W * 0.042, 0, 7); g.fill();
      g.fillStyle = '#fff'; g.font = `800 ${W * 0.05}px Nunito, sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(si + 1, toPx(x), toPx(y) + 1);
      const ax = toPx(x) + Math.cos(ang) * W * 0.09, ay = toPx(y) + Math.sin(ang) * W * 0.09;
      g.save(); g.translate(ax, ay); g.rotate(ang); g.fillStyle = cssVar('--muted'); g.beginPath(); g.moveTo(W * .025, 0); g.lineTo(-W * .015, -W * .018); g.lineTo(-W * .015, W * .018); g.fill(); g.restore();
    });
  }
  function redrawInk() {
    const c = ci.getContext('2d'); c.clearRect(0, 0, W, W);
    c.strokeStyle = cssVar('--' + color); c.lineWidth = W * 0.06; c.lineCap = 'round'; c.lineJoin = 'round';
    userPts.forEach(s => { c.beginPath(); s.forEach(([x, y], k) => k ? c.lineTo(toPx(x), toPx(y)) : c.moveTo(toPx(x), toPx(y))); if (s.length === 1) c.lineTo(toPx(s[0][0]) + .1, toPx(s[0][1])); c.stroke(); });
  }
  const pos = e => { const r = ci.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * 100, (e.clientY - r.top) / r.height * 100]; };
  ci.addEventListener('pointerdown', e => { ci.setPointerCapture(e.pointerId); drawing = true; cur = [pos(e)]; userPts.push(cur); redrawInk(); });
  ci.addEventListener('pointermove', e => { if (!drawing) return; cur.push(pos(e)); redrawInk(); });
  const end = () => { if (!drawing) return; drawing = false; check(); };
  ci.addEventListener('pointerup', end); ci.addEventListener('pointercancel', end);
  function score() {
    const all = userPts.flat(); if (all.length < 3) return { cov: 0, stray: 1 };
    const near = (x, y, r) => all.some(([a, b]) => (a - x) ** 2 + (b - y) ** 2 < r * r);
    let per = d.strokes.map(s => {
      const samples = []; for (let k = 0; k < s.length - 1; k++) { const [x0, y0] = s[k], [x1, y1] = s[k + 1]; const n = Math.max(2, Math.ceil(Math.hypot(x1 - x0, y1 - y0) / 3)); for (let j = 0; j <= n; j++) samples.push([x0 + (x1 - x0) * j / n, y0 + (y1 - y0) * j / n]); }
      return samples.filter(([x, y]) => near(x, y, 11)).length / samples.length;
    });
    const guide = d.strokes.flatMap(s => { const o = []; for (let k = 0; k < s.length - 1; k++) { const [x0, y0] = s[k], [x1, y1] = s[k + 1]; for (let j = 0; j <= 10; j++) o.push([x0 + (x1 - x0) * j / 10, y0 + (y1 - y0) * j / 10]); } return o; });
    const stray = all.filter(([x, y]) => !guide.some(([a, b]) => (a - x) ** 2 + (b - y) ** 2 < 196)).length / all.length;
    return { cov: Math.min(...per), stray };
  }
  let passed = false;
  function check() {
    const { cov, stray } = score();
    if (cov >= 0.72 && stray < 0.3) {
      if (!passed) { passed = true; sfx('good'); gainXP(3); const p = me(); p.letters[st.letter].traced = true; save(); }
      $('#t-hint', box).innerHTML = '<b style="color:var(--green)">훌륭해요! Beautiful writing.</b>';
      foot('✓ Great tracing!', 'good', 'Continue', advance);
    } else if (stray >= 0.3 && userPts.length) {
      $('#t-hint', box).textContent = 'Try to stay on the grey path. Tap ↺ to start again.';
    } else {
      $('#t-hint', box).textContent = 'Keep going: trace every stroke.';
    }
  }
  $('#t-clear', box).onclick = () => { userPts = []; redrawInk(); };
  $('#t-watch', box).onclick = () => {
    const total = d.strokes.reduce((a, s) => a + s.length - 1, 0); const t0 = performance.now();
    const perSeg = d.strokes.some(s => s.length > 10) ? 45 : 450;

/* ================= session builders ================= */
function letterOpts(answer, pool, show) {
  const A = L[answer];
  // never offer a letter that sounds the same as the answer (e.g. ㅐ / ㅔ)
  const uniq = [...new Set(pool)].filter(x => L[x] && x !== answer && !(A.snd && L[x].snd === A.snd));
  // family first: the letter it grows from, letters that grow from it, and its siblings (가 / 카 / 까)
  const fam = x => x === A.pair || L[x].pair === answer || (A.pair && L[x].pair === A.pair);
  const partner = shuffle(uniq.filter(fam));
  const same = shuffle(uniq.filter(x => L[x].type === A.type && !partner.includes(x)));
  const other = shuffle(uniq.filter(x => L[x].type !== A.type));
  return shuffle([answer, ...partner.concat(same, other).slice(0, 3)]).map(x => ({ value: x, html: show(x) }));
}
const glyphHTML = x => `<span class="ko ${L[x].type === 'vow' ? 'c-vow' : 'c-con'}">${x}</span>`;
function hearQ(letter, pool, eyebrow) {
  if (!canSpeak()) {
    // silent device: ask for the sound in writing instead, so the question is still answerable
    return { type: 'choice', clueLetter: letter, eyebrow: eyebrow || 'Sounds', prompt: `Which letter makes the “<span style="color:var(--plum)">${esc(romSyl(L[letter].sample))}</span>” sound?`,
      sub: '<p class="muted">Say it out loud, then pick the letter.</p>', answer: letter, answerText: `<span class="ko">${letter}</span>`,
      options: letterOpts(letter, pool, glyphHTML), onResult: ok => markLetter(letter, ok) };
  }
  return { type: 'choice', clueLetter: letter, eyebrow: eyebrow || 'Listen', prompt: 'Which letter makes this sound?',
    sub: '<p class="muted">Listen, then tap the letter you heard.</p>', audio: L[letter].sample,
    hint: `The sound is “<b>${esc(romSyl(L[letter].sample))}</b>” — pick the letter that makes it.`,
    answer: letter, answerText: `<span class="ko">${letter}</span>`,
    options: letterOpts(letter, pool, glyphHTML), onResult: ok => markLetter(letter, ok) };
}
function soundQ(letter, pool) {
  return { type: 'choice', clueLetter: letter, clueBefore: true, eyebrow: 'What sound?', prompt: `What sound does <span class="ko ${L[letter].type === 'vow' ? 'c-vow' : 'c-con'}" style="font-size:3rem;vertical-align:middle">${letter}</span> make?`, answer: letter, answerText: `“${L[letter].rom}”`,
    options: letterOpts(letter, pool, x => `<span>${esc(L[x].rom)}</span>`), onResult: ok => markLetter(letter, ok) };
}
function markLetter(x, ok) { const p = me(); const r = p.letters[x] = Object.assign({ right: 0, wrong: 0 }, p.letters[x]); ok ? r.right++ : r.wrong++; }
function buildQ(target, known) {
  const cons = known.filter(x => L[x].type === 'con'), vows = known.filter(x => L[x].type === 'vow');
  const t = decompose(target);
  const c = [...new Set([t.i, ...shuffle(cons.filter(x => x !== t.i)).slice(0, 3)])];
  const v = [...new Set([t.v, ...shuffle(vows.filter(x => x !== t.v)).slice(0, 3)])];
  return { type: 'build', target, cons: c, vows: v };
}
function wordQ(w, pool, mode) {
  if (mode === 'listen' && !canSpeak()) mode = 'find';
  const others = shuffle(pool.filter(x => x.ko !== w.ko && x.en !== w.en)).slice(0, 3);
  const opts = shuffle([w, ...others]);
  const onResult = ok => { const p = me(); const r = p.words[w.ko]; if (r) { ok ? r.right++ : r.wrong++; } };
  if (mode === 'meaning') return { type: 'choice', eyebrow: 'Read it', prompt: `<span class="ko" style="font-size:3.4rem">${esc(w.ko)}</span>`, sub: '<p class="muted">What does this mean?</p>', answer: w.ko, answerText: `${w.emoji} ${esc(w.en)}`,
    options: opts.map(o => ({ value: o.ko, html: `<span class="em">${o.emoji}</span><span>${esc(o.en)}</span>` })), onResult };
  if (mode === 'listen') return { type: 'choice', eyebrow: 'Listen', prompt: 'Which word do you hear?', sub: '<p class="muted">Listen, then tap the word you heard.</p>', audio: w.ko,
    hint: `The word sounds like “<b>${esc(w.rom)}</b>” and means <b>${esc(w.en)}</b> ${w.emoji}.`,
    answer: w.ko, answerText: `<span class="ko">${esc(w.ko)}</span>`,
    options: opts.map(o => ({ value: o.ko, html: `<span class="ko">${esc(o.ko)}</span>` })), onResult };
  return { type: 'choice', eyebrow: 'Find the Korean', prompt: `<span style="font-size:3rem">${w.emoji}</span><br>${esc(w.en)}`, answer: w.ko, answerText: `<span class="ko">${esc(w.ko)}</span>`, optAudio: true,
    options: opts.map(o => ({ value: o.ko, html: `<span class="ko">${esc(o.ko)}</span>` })), onResult };
}
function finalListenQ(set) {
  const a = pick(set);
  const fin = decompose(a).t;
  return { type: 'choice', eyebrow: 'Listen to the ending', prompt: 'Which block do you hear?', sub: '<p class="muted">Listen for the sound at the END of the block.</p>', audio: a,
    hint: `The block ends with a “<b>${FIN_ROM[fin] || fin}</b>” sound.`,
    answer: a, answerText: `<span class="ko">${a}</span>`,
    options: shuffle(set).map(x => ({ value: x, html: `<span class="ko">${x}</span>` })) };
}
function finalAskQ([syl, ans]) {
  const others = shuffle(Object.keys(FIN_ROM).filter(x => x !== ans)).slice(0, 3);
  return { type: 'choice', eyebrow: 'Bottom letter', prompt: `Which ending sound does <span class="ko" style="font-size:2.4rem;vertical-align:middle">${syl}</span> make?`,
    sub: `<div class="row" style="justify-content:center">${blockHTML(syl)}<button class="say" data-say="${syl}" aria-label="Play">🔊</button></div>`,
    answer: ans, answerText: `<span class="ko">${ans}</span> “${FIN_ROM[ans]}”`,
    options: shuffle([ans, ...others]).map(x => ({ value: x, html: `<span class="ko c-fin">${x}</span><span>“${FIN_ROM[x]}”</span>` })) };
}
function finalBuildQ(target) {
  const t = decompose(target);
  const cons = [...new Set([t.i, ...shuffle(BASIC_CON.filter(x => x !== t.i)).slice(0, 3)])];
  const vows = [...new Set([t.v, ...shuffle(BASIC_VOW.filter(x => x !== t.v)).slice(0, 3)])];
  const fins = [...new Set([t.t, ...shuffle(['ㄱ', 'ㄴ', 'ㄹ', 'ㅁ', 'ㅂ', 'ㅇ'].filter(x => x !== t.t)).slice(0, 3)])];
  return { type: 'build', target, cons, vows, fins };
}
function ruleQ(ruleId, [w, said, en, wrong]) {
  const r = D.rules[ruleId];
  return { type: 'choice', eyebrow: `Sound rule · ${r.name}`, prompt: `<span class="ko" style="font-size:3rem">${w}</span>`,
    sub: `<p class="muted">${esc(en)}. How is it really said?</p>`, audio: w,
    hint: `${r.name} (<span class="ko">${r.ko}</span>): ${r.text}`,
    answer: said, answerText: `<span class="ko">[${said}]</span>`,
    options: shuffle([said, ...wrong]).map(x => ({ value: x, html: `<span class="ko" style="font-size:1.5rem">[${x}]</span>` })) };
}
function startLesson(id) {
  const { stage, lesson } = lessonById(id); const p = me();
  const knownSoFar = (() => { const out = knownLetters(stage.id - 1); for (const l of stage.lessons) { if (l.letters) out.push(...l.letters); if (l.id === id) break; } return out; })();
  const steps = [{ type: 'intro', eyebrow: `Stage ${stage.id} · Lesson ${stage.lessons.indexOf(lesson) + 1}`, title: lesson.title, html: lesson.intro, img: lesson.img }];
  if (lesson.type === 'letters') {
    lesson.letters.forEach(x => steps.push({ type: 'meet', letter: x }, { type: 'trace', letter: x }));
    const hearable = lesson.letters.filter(x => x !== 'ㅇ');
    const hq = shuffle([...hearable, ...hearable]).slice(0, Math.max(4, hearable.length + 2));
    hq.forEach(x => steps.push(hearQ(x, knownSoFar)));
    shuffle(lesson.letters).slice(0, 3).forEach(x => steps.push(soundQ(x, knownSoFar)));
    shuffle(lesson.build).slice(0, 4).forEach(t => steps.push(buildQ(t, knownSoFar)));
  } else if (lesson.type === 'finals') {
    lesson.finals.forEach(f => steps.push({ type: 'finalcard', fin: D.finals.find(x => x.f === f) }));
    if (lesson.doubles) steps.push({ type: 'doublecard' });
    steps.push(...shuffle([...(canSpeak() ? lesson.listen.map(finalListenQ) : []), ...lesson.ask.map(finalAskQ)]).slice(0, 8));
    steps.push(...shuffle(lesson.build).slice(0, 3).map(finalBuildQ));
  } else if (lesson.type === 'rules') {
    lesson.rules.forEach(r => steps.push({ type: 'rulecard', rule: r }));
    steps.push(...shuffle(lesson.rules.flatMap(r => D.rules[r].items.map(it => ruleQ(r, it)))).slice(0, 8));
  } else {
    const ws = lessonWords(p, stage, lesson);
    ws.forEach((w, k) => steps.push({ type: 'wordcard', word: w, n: k + 1, of: ws.length }));
    const pool = D.words.filter(w => w.stage <= stage.id && (!w.for || w.for === p.family));
    const modes = ['meaning', 'listen', 'find'];
    shuffle(ws).slice(0, Math.min(10, ws.length + 2)).forEach((w, k) => steps.push(wordQ(w, pool, modes[k % 3])));
    if (ws.length < 6) shuffle(ws).forEach((w, k) => steps.push(wordQ(w, pool, modes[(k + 1) % 3])));
  }
  steps.push({ type: 'result', finish: acc => {
    const stars = acc >= .9 ? 3 : acc >= .7 ? 2 : 1;
    const prev = p.lessons[id];
    p.lessons[id] = { stars: Math.max(stars, prev ? prev.stars : 0), at: Date.now() };
    if (!prev) gainXP(20);
    save();
    const last = stage.lessons[stage.lessons.length - 1].id === id;
    return { win: true, stars, title: stars === 3 ? '완벽해요! Perfect!' : stars === 2 ? '잘했어요! Great job!' : '좋아요! Lesson done!',
      text: last ? 'All lessons done. The <b>Stage challenge</b> is unlocked: pass it to earn a passport stamp!' : 'The next lesson is unlocked.' };
  } });
  openPlayer(steps, { title: lesson.title });
}
function startChallenge(stageId, testout) {
  const stage = stageOf(stageId), p = me();
  const letters = stage.letters, known = knownLetters(stageId);
  const hearable = letters.filter(x => x !== 'ㅇ');
  const steps = [{ type: 'intro', eyebrow: testout ? 'Test out' : 'Stage challenge', title: `Stage ${stageId}: ${stage.title}`,
    html: `12 questions about ${stage.kind ? esc(stage.title.toLowerCase()) : `<span class="ko">${letters.join(' ')}</span>`} and the words from this stage. Get <b>10 right</b> to earn your passport stamp! ${testout ? 'If you pass, the whole stage is marked complete.' : ''}` }];
  if (stage.kind === 'finals') {
    const fl = stage.lessons.filter(l => l.type === 'finals');
    steps.push(...shuffle(fl.flatMap(l => [...(canSpeak() ? l.listen.map(finalListenQ) : []), ...l.ask.map(finalAskQ)])).slice(0, 7));
    steps.push(...shuffle(fl.flatMap(l => l.build)).slice(0, 2).map(finalBuildQ));
  } else if (stage.kind === 'rules') {
    steps.push(...shuffle(Object.keys(D.rules).flatMap(r => D.rules[r].items.map(it => ruleQ(r, it)))).slice(0, 9));
  } else {
    shuffle([...hearable, ...hearable]).slice(0, 4).forEach(x => steps.push(hearQ(x, known, 'Challenge · listen')));
    shuffle(letters).slice(0, 3).forEach(x => steps.push(soundQ(x, known)));
    const builds = stage.lessons.flatMap(l => l.build || []);
    shuffle(builds).slice(0, 2).forEach(t => steps.push(buildQ(t, known)));
  }
  const ws = wordsFor(p, stageId), pool = D.words.filter(w => w.stage <= stageId && (!w.for || w.for === p.family));
  shuffle(ws).slice(0, 3).forEach((w, k) => steps.push(wordQ(w, pool, ['meaning', 'listen', 'find'][k])));
  steps.push({ type: 'result', finish: () => {
    const score = P.right, win = score >= Math.ceil(P.total * 0.8);
    if (win) {
      const prev = p.stages[stageId];
      p.stages[stageId] = { passed: true, score: Math.max(score, prev ? prev.score || 0 : 0), at: Date.now() };
      if (!prev || !prev.passed) gainXP(50);
      if (testout) {
        stage.lessons.forEach(l => { if (!p.lessons[l.id]) p.lessons[l.id] = { stars: 3, at: Date.now(), testout: true }; });
        letters.forEach(x => { p.letters[x] = Object.assign({ right: 0, wrong: 0 }, p.letters[x], { seen: true }); });
        ws.forEach(w => { if (addWord(w, 2)) P.newWords++; });
      }
      save();
      const nxt = stageOf(stageId + 1);
      return { win: true, stamp: stampForStage(stageId).id, title: '합격! You passed!', stars: score === P.total ? 3 : score >= P.total - 1 ? 2 : 1,
        text: `You earned the <b>${stampForStage(stageId).label}</b> passport stamp. ${nxt && !nxt.soon ? `Stage ${stageId + 1} is unlocked!` : stageId === D.stages.length ? '🎓 You finished the whole Hangul Path. You can read Korean!' : `Stages 1–${stageId} complete: amazing! More stages are coming soon.`}` };
    }
    save();
    return { win: false, title: 'So close!', stars: 0, text: `You need ${Math.ceil(P.total * 0.8)} right to pass. ${testout ? 'Try the lessons first. They’ll make it easy!' : 'Look at the picture clues again and have another go.'}` };
  } });
  openPlayer(steps, { title: 'Challenge' });
}
function startReview() {
  const p = me();
  const due = shuffle(dueWords(p)).sort((a, b) => p.words[a.ko].box - p.words[b.ko].box).slice(0, 15);
  if (!due.length) { toast('No words to review right now.'); return; }
  const pool = D.words.filter(w => p.words[w.ko] || w.stage <= 1);
  const modes = ['meaning', 'listen', 'find'];
  const steps = [{ type: 'intro', eyebrow: 'Word review', title: `${due.length} words to review`, html: 'Get a word right and it moves up a box, so you’ll see it less often. Miss it and it goes back to box 1 for more practice.' }];
  due.forEach((w, k) => {
    const q = wordQ(w, pool.length >= 4 ? pool : D.words, modes[k % 3]);
    const base = q.onResult;
    q.onResult = ok => { base(ok); const r = p.words[w.ko]; r.box = ok ? Math.min(5, r.box + 1) : 1; r.due = Date.now() + (ok ? BOX_GAP[r.box] : 0) + (ok ? 0 : 10 * 60000); };
    steps.push(q);
  });
  steps.push({ type: 'result', finish: acc => ({ win: acc >= .6, stars: acc >= .9 ? 3 : acc >= .7 ? 2 : 1, title: acc >= .6 ? '복습 끝! Review done!' : 'Good practice!', text: acc >= .6 ? 'Your words are moving up the boxes. Come back tomorrow for the next review!' : 'Missed words go back to box 1 and come back soon. That’s how they stick!' }) });
  openPlayer(steps, { title: 'Word review' });
}

function gameStats(p) { p.games = p.games || { memory: { plays: 0, wins: 0, best: 0 }, swipe: { plays: 0, known: 0 }, speed: { plays: 0, best: 0 } }; return p.games; }
function stampProgress(p, st) {
  if (st.stage) return stagePassed(p, st.stage) ? 1 : 0;
  const g = gameStats(p)[st.game];
  const v = st.game === 'memory' ? g.wins : st.game === 'swipe' ? g.known : g.best;
  return Math.min(1, v / st.goal);
}
const stampEarned = (p, st) => stampProgress(p, st) >= 1;
const stampCount = p => D.stamps.filter(st => stampEarned(p, st)).length;
const stampForStage = id => D.stamps.find(s => s.stage === id);
function checkGameStamps(before) {

    setTimeout(() => { sfx('win'); burst(); toast(`New passport stamp: ${st.label}!`); }, 600);
  });
}
const earnedIds = p => D.stamps.filter(st => stampEarned(p, st)).map(s => s.id);
function mapHTML(p) {

function bindMap(root) {

function stampTile(p, st) {

}

function gamePool(p) {
  const ws = D.words.filter(w => p.words[w.ko] && (!w.for || w.for === p.family));
  if (ws.length >= 6) return { kind: 'words', items: ws.map(w => ({ key: w.ko, ko: w.ko, en: w.en, emoji: w.emoji, rom: w.rom, say: w.ko, word: w })) };
  let ls = Object.keys(L).filter(x => p.letters[x] && p.letters[x].seen);
  if (ls.length < 6) ls = D.stages[0].letters.concat(D.stages[1].letters);
  return { kind: 'letters', items: ls.map(x => ({ key: x, ko: x, en: '“' + L[x].rom + '”', emoji: L[x].emoji, rom: L[x].rom, say: L[x].sample })) };
}
VIEWS.games = main => {
  const p = me(), g = gameStats(p), pool = gamePool(p);
  const src = pool.kind === 'words' ? `your ${pool.items.length} words` : 'the letters you’ve met';

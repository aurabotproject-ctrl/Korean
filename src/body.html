<script>
(() => {
'use strict';
const D = window.HQ_DATA;
// Level 2's words join the shared bank, so reviews, games and the word list cover both levels.
if (window.HQ_L2) D.words = D.words.concat(window.HQ_L2.words);
// Essentials repeats a lot on purpose; only its genuinely new words join the bank.
if (window.HQ_ESS) {
  const have = new Set(D.words.map(w => w.ko));
  D.words = D.words.concat(window.HQ_ESS.words.filter(w => !have.has(w.ko))
    .map(w => Object.assign({ lvl: 0, stage: 90 }, w)));
}
const L = D.letters;
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random() * a.length)];
const DAY = 86400000;
const todayStr = (d = new Date()) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');

/* ================= Hangul maths ================= */
const CHO = 'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ'.split('');
const JUNG = 'ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ'.split('');
const JONG = ['', ...'ㄱㄲㄳㄴㄵㄶㄷㄹㄺㄻㄼㄽㄾㄿㅀㅁㅂㅄㅅㅆㅇㅈㅊㅋㅌㅍㅎ'.split('')];
const VERT = new Set('ㅏㅐㅑㅒㅓㅔㅕㅖㅣ'.split(''));
const HORZ = new Set('ㅗㅛㅜㅠㅡ'.split(''));
const ROM_I = {'ㄱ':'g','ㄲ':'kk','ㄴ':'n','ㄷ':'d','ㄸ':'tt','ㄹ':'r','ㅁ':'m','ㅂ':'b','ㅃ':'pp','ㅅ':'s','ㅆ':'ss','ㅇ':'','ㅈ':'j','ㅉ':'jj','ㅊ':'ch','ㅋ':'k','ㅌ':'t','ㅍ':'p','ㅎ':'h'};
const ROM_V = {'ㅏ':'a','ㅐ':'ae','ㅑ':'ya','ㅒ':'yae','ㅓ':'eo','ㅔ':'e','ㅕ':'yeo','ㅖ':'ye','ㅗ':'o','ㅘ':'wa','ㅙ':'wae','ㅚ':'oe','ㅛ':'yo','ㅜ':'u','ㅝ':'wo','ㅞ':'we','ㅟ':'wi','ㅠ':'yu','ㅡ':'eu','ㅢ':'ui','ㅣ':'i'};
function compose(i, v, t = '') { return String.fromCharCode(0xAC00 + (CHO.indexOf(i) * 21 + JUNG.indexOf(v)) * 28 + JONG.indexOf(t)); }
function decompose(ch) {
  const c = ch.charCodeAt(0) - 0xAC00;
  if (c < 0 || c > 11171) return null;
  return { i: CHO[Math.floor(c / 588)], v: JUNG[Math.floor((c % 588) / 28)], t: JONG[c % 28] };
}
const ROM_F = {'ㄱ':'k','ㄲ':'k','ㅋ':'k','ㄴ':'n','ㄷ':'t','ㅅ':'t','ㅆ':'t','ㅈ':'t','ㅊ':'t','ㅌ':'t','ㅎ':'t','ㄹ':'l','ㅁ':'m','ㅂ':'p','ㅍ':'p','ㅇ':'ng'};
const FIN_ROM = {'ㄱ':'k','ㄴ':'n','ㄷ':'t','ㄹ':'l','ㅁ':'m','ㅂ':'p','ㅇ':'ng'};
const BASIC_CON = 'ㄱㄴㄷㄹㅁㅂㅅㅈㅊㅎ'.split('');
const BASIC_VOW = 'ㅏㅓㅗㅜㅡㅣㅐ'.split('');
function romSyl(s) { const d = decompose(s); if (!d) return s; let r = ROM_I[d.i] + ROM_V[d.v]; if (d.i === 'ㅅ' && d.v === 'ㅣ') r = 'shi'; return r + (ROM_F[d.t] || ''); }
function blockHTML(ch) {
  const d = decompose(ch); if (!d) return '';
  const hz = HORZ.has(d.v), cls = (hz ? 'h' : 'v') + (d.t ? 't' : '');
  const cl = hz && d.t ? 'ht' : cls;
  return `<div class="blk ${cl}" aria-label="${esc(ch)}"><span class="i">${d.i}</span><span class="m">${d.v}</span>${d.t ? `<span class="t">${d.t}</span>` : ''}</div>`;
}

/* ================= storage ================= */
const KEY = 'hangulQuest.v1';
const defaults = () => ({ profiles: [], currentId: null, settings: { tripDate: '', tripPlace: 'Korea', rom: 'auto', rate: 0.85, sfx: true, voiceURI: '', romVoice: false } });
let S;
try { S = JSON.parse(localStorage.getItem(KEY)) || defaults(); } catch (e) { S = defaults(); }
S.settings = Object.assign(defaults().settings, S.settings || {});
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
const me = () => S.profiles.find(p => p.id === S.currentId) || null;
function newProfile(name, avatar, family) {
  return { id: 'p' + Date.now().toString(36), name, avatar, family, xp: 0, streak: 0, lastDay: '', created: Date.now(),
    lessons: {}, stages: {}, letters: {}, words: {}, days: {} };
}

/* ================= progress helpers ================= */
function addXP(n) {
  const p = me(); if (!p || !n) return;
  p.xp += n;
  const t = todayStr();
  if (p.lastDay !== t) {
    const y = todayStr(new Date(Date.now() - DAY));
    p.streak = p.lastDay === y ? p.streak + 1 : 1;
    p.lastDay = t;
  }
  p.days = p.days || {};
  p.days[t] = (p.days[t] || 0) + n;
  save(); updateBar();
}
const stageOf = id => D.stages.find(s => s.id === id);
const lessonById = id => { for (const s of D.stages) for (const l of (s.lessons || [])) if (l.id === id) return { stage: s, lesson: l }; return null; };
const stagePassed = (p, id) => !!(p.stages[id] && p.stages[id].passed);
// Preview mode: a grown-up can open every stage, unit and mission to look around.
// It changes no progress — turning it off puts every lock back exactly as it was.
const PREVIEW_PASS = 'JesusLoveMe3';   // grown-ups only: opens every lock for a look around
const preview = () => !!S.settings.previewAll;
const stageOpen = (p, id) => { const s = stageOf(id); return !!s && !s.soon && (preview() || id === 1 || stagePassed(p, id - 1)); };
function lessonOpen(p, stage, idx) { if (!stageOpen(p, stage.id)) return false; return preview() || idx === 0 || !!p.lessons[stage.lessons[idx - 1].id]; }
const allLessonsDone = (p, stage) => (stage.lessons || []).every(l => p.lessons[l.id]);
function knownLetters(uptoStage) { const out = []; D.stages.forEach(s => { if (s.id <= uptoStage && !s.soon) out.push(...s.letters); }); return out; }
function wordsFor(p, stageId) { return D.words.filter(w => w.stage === stageId && (!w.for || w.for === p.family)); }
function lessonWords(p, stage, lesson) { const ws = wordsFor(p, stage.id); return lesson.slice ? ws.slice(lesson.slice[0], lesson.slice[1]) : ws; }
function lettersLearned(p) { return Object.values(p.letters).filter(x => x.seen).length; }
function wordCount(p) { return Object.keys(p.words).length; }
function addWord(w, box = 1) {
  const p = me(); if (!p || p.words[w.ko]) return false;
  p.words[w.ko] = { box, due: Date.now() + (box > 1 ? BOX_GAP[box] : 0), right: 0, wrong: 0, added: Date.now() };
  rotateWords(p);
  return true;
}
const BOX_GAP = { 1: 0, 2: DAY, 3: 3 * DAY, 4: 7 * DAY, 5: 14 * DAY };
function dueWords(p) {
  const now = Date.now();
  return D.words.filter(w => { const r = p.words[w.ko]; return r && !r.parked && r.due <= now; });
}
// A word bank of 1,000+ would make daily review a chore, so only ACTIVE_WORDS are in
// rotation. New words park themselves until older ones are well known, then take their place.
function rotateWords(p) {
  const recs = Object.entries(p.words);
  const live = recs.filter(([, r]) => !r.parked);
  if (live.length <= ACTIVE_WORDS) {
    // room to spare: wake the oldest parked words
    const parked = recs.filter(([, r]) => r.parked).sort((a, b) => a[1].added - b[1].added);
    parked.slice(0, ACTIVE_WORDS - live.length).forEach(([, r]) => { delete r.parked; r.due = Date.now(); });
  } else {
    // too many: park the newest ones that haven't been answered yet
    live.filter(([, r]) => r.box === 1 && !r.right).sort((a, b) => b[1].added - a[1].added)
        .slice(0, live.length - ACTIVE_WORDS).forEach(([, r]) => { r.parked = true; });
  }
}
function nextStep(p) {
  for (const s of D.stages) {
    if (s.soon) break;
    if (!stageOpen(p, s.id)) break;
    if (stagePassed(p, s.id)) continue;
    const i = s.lessons.findIndex(l => !p.lessons[l.id]);
    if (i >= 0) return { kind: 'lesson', stage: s, lesson: s.lessons[i] };
    return { kind: 'challenge', stage: s };
  }
  return null;
}
function showRom(stageId) { const m = S.settings.rom; return m === 'always' || (m === 'auto' && stageId <= 6); }

/* ================= audio ================= */
let koVoice = null;
function pickVoice() {
  if (!('speechSynthesis' in window)) return;
  const vs = speechSynthesis.getVoices();
  // "Google 한국의" is far and away the most natural-sounding Korean voice, so it wins
  // whenever it's installed. The system voices below it are the fallbacks, in order.
  koVoice = (S.settings.voiceURI && vs.find(v => v.voiceURI === S.settings.voiceURI))
    || vs.find(isBestKo)
    || vs.find(v => /^ko/i.test(v.lang) && /yuna|sora/i.test(v.name))
    || vs.find(v => /^ko/i.test(v.lang)) || null;
}
// The Google Korean voice ships with Chrome; its name is localised, so match on the vendor word
// in a few spellings rather than the whole label.
const isBestKo = v => /^ko/i.test(v.lang) && /google|구글/i.test(v.name);
const hasBestKo = () => ('speechSynthesis' in window) && speechSynthesis.getVoices().some(isBestKo);
// Rough English-letter reading, used only when the device has no Korean voice at all.
function romanize(text) {
  return [...text].map(ch => {
    const d = decompose(ch);
    if (!d) return ch;
    let r = ROM_I[d.i] + ROM_V[d.v] + (ROM_F[d.t] || '');
    if (d.i === 'ㅅ' && d.v === 'ㅣ') r = 'shee';
    return r.replace(/eo/g, 'aw').replace(/eu/g, 'uh').replace(/ae/g, 'eh');
  }).join(' ');
}
if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
let speechBroken = false, unlocked = false;
// Browsers block speech until the page has been tapped once, so prime it on the first touch.
function unlockSpeech() {
  if (unlocked || !('speechSynthesis' in window)) return;
  unlocked = true;
  try { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); } catch (e) {}
}
document.addEventListener('pointerdown', unlockSpeech, true);
document.addEventListener('keydown', unlockSpeech, true);
function canSpeak() {
  if (!('speechSynthesis' in window) || speechBroken || S.settings.noVoice) return false;
  if (!koVoice) pickVoice();
  return !!koVoice || !!S.settings.romVoice;
}
// Chrome quietly wedges its speech queue (an utterance collected by the garbage collector,
// a cancel() that never clears, a pause after ~15s). Hence the kept reference, the resume
// ticker and the one retry: without them the very first lesson sound can silence the rest.
let curUtter = null, resumeTicker = null;
let speakStarted = false;
function speakNow(text, rate, korean) {
  const u = new SpeechSynthesisUtterance(text);
  u.onstart = () => { speakStarted = true; };
  if (korean) { u.lang = 'ko-KR'; if (koVoice) { try { u.voice = koVoice; } catch (e) {} } }
  u.rate = rate;
  u.onerror = e => { if (e.error !== 'interrupted' && e.error !== 'canceled') { speechBroken = true; showVoiceNote(); } };
  u.onend = () => { clearInterval(resumeTicker); resumeTicker = null; };
  curUtter = u;                       // keep a reference so it isn't garbage-collected mid-sentence
  try {
    if (speechSynthesis.speaking || speechSynthesis.pending) speechSynthesis.cancel();
    speechSynthesis.resume();
    speechSynthesis.speak(u);
  } catch (e) {}
  clearInterval(resumeTicker);
  resumeTicker = setInterval(() => { try { if (speechSynthesis.speaking) speechSynthesis.resume(); else { clearInterval(resumeTicker); resumeTicker = null; } } catch (e) {} }, 6000);
  return u;
}
// Chrome on macOS silently skips very short phrases (a single syllable like 아), so short
// items are said twice with a pause — which is what you want when learning a letter anyway.
function padShort(t) {
  const n = [...t].length;
  if (n <= 2) return t + ', ' + t;
  if (n <= 4) return t + '.';
  return t;
}
function say(text, slow) {
  if (!('speechSynthesis' in window)) { toast('This browser can’t speak. Try Safari or Chrome.'); return; }
  if (!koVoice) pickVoice();
  const approx = !koVoice && S.settings.romVoice;
  const spoken = padShort(approx ? romanize(text) : text);
  const rate = approx ? (slow ? 0.6 : 0.8) : (slow ? 0.55 : S.settings.rate);
  unlockSpeech();
  speakStarted = false;
  const utter = speakNow(spoken, rate, !approx);
  // if the queue was wedged, nothing starts at all: clear it out and try once more
  setTimeout(() => {
    try {
      if (!speakStarted && !speechSynthesis.speaking && !speechSynthesis.pending) {
        speechSynthesis.cancel(); speechSynthesis.resume(); speakNow(spoken, rate, !approx);
      }
    } catch (e) {}
  }, 300);
  return utter;
}
function voiceHelp() {
  return 'No Korean voice on this device yet. Easiest fix: open this page in Google Chrome, which comes with the “Google 한국의” voice — the best-sounding one there is. Otherwise, on a Mac: System Settings → Accessibility → Spoken Content → System voice → Manage Voices → add Korean (Yuna), then reload this page. On iPad: Settings → Accessibility → Spoken Content → Voices → Korean.';
}
function showVoiceNote() {
  const n = $('#voice-note');
  if (n) { n.hidden = false; n.innerHTML = `🔇 <b>No Korean voice.</b> ${esc(voiceHelp())}`; }
}
let actx = null;
function sfx(kind) {
  if (!S.settings.sfx) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const notes = kind === 'good' ? [660, 880] : kind === 'win' ? [523, 659, 784, 1046] : [220, 180];
    notes.forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = kind === 'bad' ? 'triangle' : 'sine'; o.frequency.value = f;
      const t = actx.currentTime + i * 0.09;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.18, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t + 0.25);
    });
  } catch (e) {}
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-say]');
  if (b) { e.stopPropagation(); say(b.dataset.say, b.dataset.slow === '1'); }
}, true);

/* ================= ui helpers ================= */
let toastT;
function toast(msg) {
  let t = $('#toast'); if (!t) { t = document.createElement('div'); t.id = 'toast'; t.className = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); }
  t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 3200);
}
function burst() {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const b = document.createElement('div'); b.className = 'burst';
  const items = ['⭐', '🎉', '🇰🇷', '✨', '🐯', '💫'];
  for (let i = 0; i < 28; i++) { const s = document.createElement('span'); s.textContent = pick(items); s.style.left = Math.random() * 100 + '%'; s.style.animationDelay = Math.random() * .6 + 's'; b.appendChild(s); }
  document.body.appendChild(b); setTimeout(() => b.remove(), 2600);
}
const avatarSrcFor = p => `assets/avatars/${p.avatar}.webp`;
const avatarSrc = id => `assets/avatars/${id}.webp`;
const tiger = pose => `assets/mascot/horangi-${pose}.webp`;
const starsHTML = n => `<span class="stars" aria-label="${n} of 3 stars">${'★'.repeat(n)}<span class="off">${'★'.repeat(3 - n)}</span></span>`;
function mnImg(letter) {
  const d = L[letter];
  // tries assets/mnemonics/<name>.webp, then .png, then shows the emoji
  return `<div class="mn-pic"><img alt="Picture clue for ${esc(letter)}" src="assets/mnemonics/${d.img}.webp" data-alt="assets/mnemonics/${d.img}.png" onerror="if(this.dataset.alt){this.src=this.dataset.alt;this.dataset.alt='';}else{this.replaceWith(Object.assign(document.createElement('span'),{className:'em',textContent:'${d.emoji}'}));}"></div>`;
}

// The picture clue: the same mnemonic image from the lesson, shown beside the letter.
function clueHTML(letter) {
  const d = L[letter]; if (!d) return '';
  const cls = d.type === 'vow' ? 'c-vow' : 'c-con';
  return `<div class="clue">${mnImg(letter)}<div class="clue-text"><span class="ko ${cls}">${letter}</span>
    <b>“${esc(d.rom)}”</b><p class="muted">${esc(d.mnemonic)}</p></div></div>`;
}
function updateBar() {
  const p = me();
  $('#tabs').hidden = !p; $('#mebar').hidden = !p;
  if (!p) return;
  $('#st-xp').textContent = p.xp; $('#st-streak').textContent = p.streak;
  $('#me-av').src = avatarSrc(p.avatar); $('#me-name').textContent = p.name;
  const tabFor = { stage: 'learn', path: 'learn', unit: 'learn', essSection: 'learn', passport: 'home' }[route.name] || route.name;
  $$('.tab').forEach(t => t.setAttribute('aria-current', t.dataset.go === tabFor ? 'page' : 'false'));
}

/* ================= router ================= */
let route = { name: 'profiles', arg: null };
function go(name, arg = null) {
  if (name !== 'landing') document.body.classList.remove('on-landing');
  if (!me() && !['profiles', 'newProfile'].includes(name)) name = 'profiles';
  route = { name, arg };
  const main = $('#main');
  main.innerHTML = '';
  (VIEWS[name] || VIEWS.home)(main, arg);
  updateBar();
  window.scrollTo(0, 0);
}
$('#tabs').addEventListener('click', e => { const b = e.target.closest('[data-go]'); if (b) go(b.dataset.go); });
$('#brand').addEventListener('click', () => go(me() ? 'home' : 'profiles'));
$('#brand').addEventListener('dblclick', () => go('landing'));
$('#me-btn').addEventListener('click', () => go('profiles'));

const VIEWS = {};

/* ---------- profiles ---------- */
VIEWS.profiles = main => {
  main.innerHTML = `<div class="who">
    <img class="hero-tiger" src="${tiger('wave')}" alt="Horangi the tiger waving">
    <div><h1>누가 공부해요? <span class="muted" style="font-size:.6em;display:block;margin-top:6px">Who’s learning today?</span></h1></div>
    <div class="who-grid">
      ${S.profiles.map(p => `<button class="who-card" data-id="${p.id}"><img src="${avatarSrcFor(p)}" alt=""><b>${esc(p.name)}</b><span class="pill">⭐ ${p.xp} XP · ${wordCount(p)} words</span></button>`).join('')}
      <button class="who-card add" id="add-p"><span class="plus">+</span><b>Add learner</b></button>
    </div></div>`;
  $$('.who-card[data-id]', main).forEach(b => b.onclick = () => { S.currentId = b.dataset.id; save(); go('home'); });
  $('#add-p', main).onclick = () => go('newProfile');
};
VIEWS.newProfile = main => {
  let av = D.avatars[S.profiles.length % D.avatars.length].id, fam = 'boy';
  main.innerHTML = `<form class="card form-card" id="pf">
    <h2>New learner</h2>
    <div class="field"><label for="pf-name">Name</label><input class="input" id="pf-name" maxlength="20" required autocomplete="off" placeholder="First name"></div>
    <div class="field"><label>Pick an avatar</label><div class="avatars">${D.avatars.map(a => `<button type="button" class="av-opt" data-av="${a.id}" aria-pressed="${a.id === av}" aria-label="${a.label}"><img src="assets/avatars/${a.id}.webp" alt=""></button>`).join('')}</div></div>
    <div class="field"><label>Family words</label>
      <p class="muted" style="font-size:.9rem">In Korean, what you call your older brother and sister depends on whether you’re a boy or a girl.</p>
      <div class="seg">
        <button type="button" data-fam="boy" aria-pressed="true"><span class="ko">형 · 누나</span><br><span class="muted">I’m a boy</span></button>
        <button type="button" data-fam="girl" aria-pressed="false"><span class="ko">오빠 · 언니</span><br><span class="muted">I’m a girl</span></button>
      </div></div>
    <div class="row" style="justify-content:space-between">
      <button type="button" class="btn ghost" id="pf-cancel">Cancel</button>
      <button class="btn red" type="submit">Start learning →</button>
    </div>
  </form>`;
  $$('[data-av]', main).forEach(b => b.onclick = () => { av = b.dataset.av; $$('[data-av]', main).forEach(x => x.setAttribute('aria-pressed', x === b)); });

VIEWS.path = main => renderL1(main);
function renderL1(main) {

    const state = passed ? 'passed' : open ? 'open' : 'locked';

      <span class="muted" style="display:block;font-size:.92rem">${esc(s.blurb)}</span></span>
      <span class="right">${right}</span></button>`;

STEP.trace = (box, st) => {

  const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

      let left = progress;

        if (left <= 0) return;
        const n = Math.min(s.length, Math.floor(left) + 1); g.beginPath();
        for (let k = 0; k < n; k++) { const [x, y] = s[k]; k ? g.lineTo(toPx(x), toPx(y)) : g.moveTo(toPx(x), toPx(y)); }
        if (n < s.length) { const f = left - Math.floor(left), [x0, y0] = s[n - 1], [x1, y1] = s[n]; g.lineTo(toPx(x0 + (x1 - x0) * f), toPx(y0 + (y1 - y0) * f)); }

      const [x, y] = s[0], [x2, y2] = s[1];

      g.fillStyle = '#fff'; g.font = `800 ${W * 0.05}px Nunito, sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(si + 1, toPx(x), toPx(y) + 1);
      const ax = toPx(x) + Math.cos(ang) * W * 0.09, ay = toPx(y) + Math.sin(ang) * W * 0.09;

/* ================= session builders ================= */
function letterOpts(answer, pool, show) {
  const A = L[answer];
  // never offer a letter that sounds the same as the answer (e.g. ㅐ / ㅔ)
  const uniq = [...new Set(pool)].filter(x => L[x] && x !== answer && !(A.snd && L[x].snd === A.snd));
  // family first: the letter it grows from, letters that grow from it, and its siblings (가 / 카 / 까)
  const fam = x => x === A.pair || L[x].pair === answer || (A.pair && L[x].pair === A.pair);
  const partner = shuffle(uniq.filter(fam));
  const same = shuffle(uniq.filter(x => L[x].type === A.type && !partner.includes(x)));
  const other = shuffle(uniq.filter(x => L[x].type !== A.type));
  return shuffle([answer, ...partner.concat(same, other).slice(0, 3)]).map(x => ({ value: x, html: show(x) }));
}
const glyphHTML = x => `<span class="ko ${L[x].type === 'vow' ? 'c-vow' : 'c-con'}">${x}</span>`;
function hearQ(letter, pool, eyebrow) {
  if (!canSpeak()) {
    // silent device: ask for the sound in writing instead, so the question is still answerable
    return { type: 'choice', clueLetter: letter, eyebrow: eyebrow || 'Sounds', prompt: `Which letter makes the “<span style="color:var(--plum)">${esc(romSyl(L[letter].sample))}</span>” sound?`,
      sub: '<p class="muted">Say it out loud, then pick the letter.</p>', answer: letter, answerText: `<span class="ko">${letter}</span>`,
      options: letterOpts(letter, pool, glyphHTML), onResult: ok => markLetter(letter, ok) };
  }
  return { type: 'choice', clueLetter: letter, eyebrow: eyebrow || 'Listen', prompt: 'Which letter makes this sound?',
    sub: '<p class="muted">Listen, then tap the letter you heard.</p>', audio: L[letter].sample,
    hint: `The sound is “<b>${esc(romSyl(L[letter].sample))}</b>” — pick the letter that makes it.`,
    answer: letter, answerText: `<span class="ko">${letter}</span>`,
    options: letterOpts(letter, pool, glyphHTML), onResult: ok => markLetter(letter, ok) };
}
function soundQ(letter, pool) {
  return { type: 'choice', clueLetter: letter, clueBefore: true, eyebrow: 'What sound?', prompt: `What sound does <span class="ko ${L[letter].type === 'vow' ? 'c-vow' : 'c-con'}" style="font-size:3rem;vertical-align:middle">${letter}</span> make?`, answer: letter, answerText: `“${L[letter].rom}”`,
    options: letterOpts(letter, pool, x => `<span>${esc(L[x].rom)}</span>`), onResult: ok => markLetter(letter, ok) };
}
function markLetter(x, ok) { const p = me(); const r = p.letters[x] = Object.assign({ right: 0, wrong: 0 }, p.letters[x]); ok ? r.right++ : r.wrong++; }
function buildQ(target, known) {
  const cons = known.filter(x => L[x].type === 'con'), vows = known.filter(x => L[x].type === 'vow');
  const t = decompose(target);
  const c = [...new Set([t.i, ...shuffle(cons.filter(x => x !== t.i)).slice(0, 3)])];
  const v = [...new Set([t.v, ...shuffle(vows.filter(x => x !== t.v)).slice(0, 3)])];
  return { type: 'build', target, cons: c, vows: v };
}
function wordQ(w, pool, mode) {
  if (mode === 'listen' && !canSpeak()) mode = 'find';
  const others = shuffle(pool.filter(x => x.ko !== w.ko && x.en !== w.en)).slice(0, 3);
  const opts = shuffle([w, ...others]);
  const onResult = ok => { const p = me(); const r = p.words[w.ko]; if (r) { ok ? r.right++ : r.wrong++; } };
  if (mode === 'meaning') return { type: 'choice', eyebrow: 'Read it', prompt: `<span class="ko" style="font-size:3.4rem">${esc(w.ko)}</span>`, sub: '<p class="muted">What does this mean?</p>', answer: w.ko, answerText: `${w.emoji} ${esc(w.en)}`,
    options: opts.map(o => ({ value: o.ko, html: `<span class="em">${o.emoji}</span><span>${esc(o.en)}</span>` })), onResult };
  if (mode === 'listen') return { type: 'choice', eyebrow: 'Listen', prompt: 'Which word do you hear?', sub: '<p class="muted">Listen, then tap the word you heard.</p>', audio: w.ko,
    hint: `The word sounds like “<b>${esc(w.rom)}</b>” and means <b>${esc(w.en)}</b> ${w.emoji}.`,
    answer: w.ko, answerText: `<span class="ko">${esc(w.ko)}</span>`,
    options: opts.map(o => ({ value: o.ko, html: `<span class="ko">${esc(o.ko)}</span>` })), onResult };
  return { type: 'choice', eyebrow: 'Find the Korean', prompt: `<span style="font-size:3rem">${w.emoji}</span><br>${esc(w.en)}`, answer: w.ko, answerText: `<span class="ko">${esc(w.ko)}</span>`, optAudio: true,
    options: opts.map(o => ({ value: o.ko, html: `<span class="ko">${esc(o.ko)}</span>` })), onResult };
}
function finalListenQ(set) {
  const a = pick(set);
  const fin = decompose(a).t;
  return { type: 'choice', eyebrow: 'Listen to the ending', prompt: 'Which block do you hear?', sub: '<p class="muted">Listen for the sound at the END of the block.</p>', audio: a,
    hint: `The block ends with a “<b>${FIN_ROM[fin] || fin}</b>” sound.`,
    answer: a, answerText: `<span class="ko">${a}</span>`,
    options: shuffle(set).map(x => ({ value: x, html: `<span class="ko">${x}</span>` })) };
}
function finalAskQ([syl, ans]) {
  const others = shuffle(Object.keys(FIN_ROM).filter(x => x !== ans)).slice(0, 3);
  return { type: 'choice', eyebrow: 'Bottom letter', prompt: `Which ending sound does <span class="ko" style="font-size:2.4rem;vertical-align:middle">${syl}</span> make?`,
    sub: `<div class="row" style="justify-content:center">${blockHTML(syl)}<button class="say" data-say="${syl}" aria-label="Play">🔊</button></div>`,
    answer: ans, answerText: `<span class="ko">${ans}</span> “${FIN_ROM[ans]}”`,
    options: shuffle([ans, ...others]).map(x => ({ value: x, html: `<span class="ko c-fin">${x}</span><span>“${FIN_ROM[x]}”</span>` })) };
}
function finalBuildQ(target) {
  const t = decompose(target);
  const cons = [...new Set([t.i, ...shuffle(BASIC_CON.filter(x => x !== t.i)).slice(0, 3)])];
  const vows = [...new Set([t.v, ...shuffle(BASIC_VOW.filter(x => x !== t.v)).slice(0, 3)])];
  const fins = [...new Set([t.t, ...shuffle(['ㄱ', 'ㄴ', 'ㄹ', 'ㅁ', 'ㅂ', 'ㅇ'].filter(x => x !== t.t)).slice(0, 3)])];
  return { type: 'build', target, cons, vows, fins };
}
function ruleQ(ruleId, [w, said, en, wrong]) {
  const r = D.rules[ruleId];
  return { type: 'choice', eyebrow: `Sound rule · ${r.name}`, prompt: `<span class="ko" style="font-size:3rem">${w}</span>`,
    sub: `<p class="muted">${esc(en)}. How is it really said?</p>`, audio: w,
    hint: `${r.name} (<span class="ko">${r.ko}</span>): ${r.text}`,
    answer: said, answerText: `<span class="ko">[${said}]</span>`,
    options: shuffle([said, ...wrong]).map(x => ({ value: x, html: `<span class="ko" style="font-size:1.5rem">[${x}]</span>` })) };
}
function startLesson(id) {
  const { stage, lesson } = lessonById(id); const p = me();
  const knownSoFar = (() => { const out = knownLetters(stage.id - 1); for (const l of stage.lessons) { if (l.letters) out.push(...l.letters); if (l.id === id) break; } return out; })();
  const steps = [{ type: 'intro', eyebrow: `Stage ${stage.id} · Lesson ${stage.lessons.indexOf(lesson) + 1}`, title: lesson.title, html: lesson.intro, img: lesson.img }];
  if (lesson.type === 'letters') {
    lesson.letters.forEach(x => steps.push({ type: 'meet', letter: x }, { type: 'trace', letter: x }));
    const hearable = lesson.letters.filter(x => x !== 'ㅇ');
    const hq = shuffle([...hearable, ...hearable]).slice(0, Math.max(4, hearable.length + 2));
    hq.forEach(x => steps.push(hearQ(x, knownSoFar)));
    shuffle(lesson.letters).slice(0, 3).forEach(x => steps.push(soundQ(x, knownSoFar)));
    shuffle(lesson.build).slice(0, 4).forEach(t => steps.push(buildQ(t, knownSoFar)));
  } else if (lesson.type === 'finals') {
    lesson.finals.forEach(f => steps.push({ type: 'finalcard', fin: D.finals.find(x => x.f === f) }));
    if (lesson.doubles) steps.push({ type: 'doublecard' });
    steps.push(...shuffle([...(canSpeak() ? lesson.listen.map(finalListenQ) : []), ...lesson.ask.map(finalAskQ)]).slice(0, 8));
    steps.push(...shuffle(lesson.build).slice(0, 3).map(finalBuildQ));
  } else if (lesson.type === 'rules') {
    lesson.rules.forEach(r => steps.push({ type: 'rulecard', rule: r }));
    steps.push(...shuffle(lesson.rules.flatMap(r => D.rules[r].items.map(it => ruleQ(r, it)))).slice(0, 8));
  } else {
    const ws = lessonWords(p, stage, lesson);
    ws.forEach((w, k) => steps.push({ type: 'wordcard', word: w, n: k + 1, of: ws.length }));
    const pool = D.words.filter(w => w.stage <= stage.id && (!w.for || w.for === p.family));
    const modes = ['meaning', 'listen', 'find'];
    shuffle(ws).slice(0, Math.min(10, ws.length + 2)).forEach((w, k) => steps.push(wordQ(w, pool, modes[k % 3])));
    if (ws.length < 6) shuffle(ws).forEach((w, k) => steps.push(wordQ(w, pool, modes[(k + 1) % 3])));
  }
  steps.push({ type: 'result', finish: acc => {
    const stars = acc >= .9 ? 3 : acc >= .7 ? 2 : 1;
    const prev = p.lessons[id];
    p.lessons[id] = { stars: Math.max(stars, prev ? prev.stars : 0), at: Date.now() };
    if (!prev) gainXP(20);
    save();
    const last = stage.lessons[stage.lessons.length - 1].id === id;
    return { win: true, stars, title: stars === 3 ? '완벽해요! Perfect!' : stars === 2 ? '잘했어요! Great job!' : '좋아요! Lesson done!',
      text: last ? 'All lessons done. The <b>Stage challenge</b> is unlocked: pass it to earn a passport stamp!' : 'The next lesson is unlocked.' };
  } });
  openPlayer(steps, { title: lesson.title });
}
function startChallenge(stageId, testout) {
  const stage = stageOf(stageId), p = me();
  const letters = stage.letters, known = knownLetters(stageId);
  const hearable = letters.filter(x => x !== 'ㅇ');
  const steps = [{ type: 'intro', eyebrow: testout ? 'Test out' : 'Stage challenge', title: `Stage ${stageId}: ${stage.title}`,
    html: `12 questions about ${stage.kind ? esc(stage.title.toLowerCase()) : `<span class="ko">${letters.join(' ')}</span>`} and the words from this stage. Get <b>10 right</b> to earn your passport stamp! ${testout ? 'If you pass, the whole stage is marked complete.' : ''}` }];
  if (stage.kind === 'finals') {
    const fl = stage.lessons.filter(l => l.type === 'finals');
    steps.push(...shuffle(fl.flatMap(l => [...(canSpeak() ? l.listen.map(finalListenQ) : []), ...l.ask.map(finalAskQ)])).slice(0, 7));
    steps.push(...shuffle(fl.flatMap(l => l.build)).slice(0, 2).map(finalBuildQ));
  } else if (stage.kind === 'rules') {
    steps.push(...shuffle(Object.keys(D.rules).flatMap(r => D.rules[r].items.map(it => ruleQ(r, it)))).slice(0, 9));
  } else {
    shuffle([...hearable, ...hearable]).slice(0, 4).forEach(x => steps.push(hearQ(x, known, 'Challenge · listen')));
    shuffle(letters).slice(0, 3).forEach(x => steps.push(soundQ(x, known)));
    const builds = stage.lessons.flatMap(l => l.build || []);
    shuffle(builds).slice(0, 2).forEach(t => steps.push(buildQ(t, known)));
  }
  const ws = wordsFor(p, stageId), pool = D.words.filter(w => w.stage <= stageId && (!w.for || w.for === p.family));
  shuffle(ws).slice(0, 3).forEach((w, k) => steps.push(wordQ(w, pool, ['meaning', 'listen', 'find'][k])));
  steps.push({ type: 'result', finish: () => {
    const score = P.right, win = score >= Math.ceil(P.total * 0.8);
    if (win) {
      const prev = p.stages[stageId];
      p.stages[stageId] = { passed: true, score: Math.max(score, prev ? prev.score || 0 : 0), at: Date.now() };
      if (!prev || !prev.passed) gainXP(50);
      if (testout) {
        stage.lessons.forEach(l => { if (!p.lessons[l.id]) p.lessons[l.id] = { stars: 3, at: Date.now(), testout: true }; });
        letters.forEach(x => { p.letters[x] = Object.assign({ right: 0, wrong: 0 }, p.letters[x], { seen: true }); });
        ws.forEach(w => { if (addWord(w, 2)) P.newWords++; });
      }
      save();
      const nxt = stageOf(stageId + 1);
      return { win: true, stamp: stampForStage(stageId).id, title: '합격! You passed!', stars: score === P.total ? 3 : score >= P.total - 1 ? 2 : 1,
        text: `You earned the <b>${stampForStage(stageId).label}</b> passport stamp. ${nxt && !nxt.soon ? `Stage ${stageId + 1} is unlocked!` : stageId === D.stages.length ? '🎓 You finished the whole Hangul Path. You can read Korean!' : `Stages 1–${stageId} complete: amazing! More stages are coming soon.`}` };
    }
    save();
    return { win: false, title: 'So close!', stars: 0, text: `You need ${Math.ceil(P.total * 0.8)} right to pass. ${testout ? 'Try the lessons first. They’ll make it easy!' : 'Look at the picture clues again and have another go.'}` };
  } });
  openPlayer(steps, { title: 'Challenge' });
}
function startReview() {
  const p = me();
  const due = shuffle(dueWords(p)).sort((a, b) => p.words[a.ko].box - p.words[b.ko].box).slice(0, 15);
  if (!due.length) { toast('No words to review right now.'); return; }
  const pool = D.words.filter(w => p.words[w.ko] || w.stage <= 1);
  const modes = ['meaning', 'listen', 'find'];
  const steps = [{ type: 'intro', eyebrow: 'Word review', title: `${due.length} words to review`, html: 'Get a word right and it moves up a box, so you’ll see it less often. Miss it and it goes back to box 1 for more practice.' }];
  due.forEach((w, k) => {
    const q = wordQ(w, pool.length >= 4 ? pool : D.words, modes[k % 3]);
    const base = q.onResult;
    q.onResult = ok => { base(ok); const r = p.words[w.ko]; r.box = ok ? Math.min(5, r.box + 1) : 1; r.due = Date.now() + (ok ? BOX_GAP[r.box] : 0) + (ok ? 0 : 10 * 60000); };
    steps.push(q);
  });
  steps.push({ type: 'result', finish: acc => ({ win: acc >= .6, stars: acc >= .9 ? 3 : acc >= .7 ? 2 : 1, title: acc >= .6 ? '복습 끝! Review done!' : 'Good practice!', text: acc >= .6 ? 'Your words are moving up the boxes. Come back tomorrow for the next review!' : 'Missed words go back to box 1 and come back soon. That’s how they stick!' }) });
  openPlayer(steps, { title: 'Word review' });
}

function gameStats(p) {
  p.games = p.games || {};
  const dflt = { memory: { plays: 0, wins: 0, best: 0 }, swipe: { plays: 0, known: 0 }, speed: { plays: 0, best: 0 },
    bubbles: { plays: 0, wins: 0, best: 0 }, shop: { plays: 0, paid: 0, streak: 0 } };
  for (const k in dflt) if (!p.games[k]) p.games[k] = dflt[k];
  return p.games;
}

function gamePool(p) {
  const ws = D.words.filter(w => (preview() || p.words[w.ko]) && (!w.for || w.for === p.family));
  if (ws.length >= 6) return { kind: 'words', items: ws.map(w => ({ key: w.ko, ko: w.ko, en: w.en, emoji: w.emoji, rom: w.rom, say: w.ko, word: w })) };
  let ls = Object.keys(L).filter(x => preview() || (p.letters[x] && p.letters[x].seen));
  if (ls.length < 6) ls = D.stages[0].letters.concat(D.stages[1].letters);
  return { kind: 'letters', items: ls.map(x => ({ key: x, ko: x, en: '“' + L[x].rom + '”', emoji: L[x].emoji, rom: L[x].rom, say: L[x].sample })) };
}
function bubBest(g) {
  const b = g.bests || {};

  const k = ks.sort((a, x) => (+x.split('-')[1]) - (+a.split('-')[1]))[0];
  const s = b[k], top = k.split('-')[1];
  return `⏱ 1–${top} in ${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
}

/* --- Memory Match --- */
function playMemory() {
  const p = me(), pool = gamePool(p);
  const box = G ? $('#g-in') : openGame('Memory Match');
  const pairs = shuffle(pool.items).slice(0, 6);
  const cards = shuffle(pairs.flatMap((it, i) => [{ i, side: 'ko', it }, { i, side: 'en', it }]));
  let open = [], matched = 0, moves = 0, lock = false;
  const stat = () => $('#g-stat').textContent = `🔄 ${moves} moves`;
  box.innerHTML = `<p class="muted">Find each Korean ${pool.kind === 'words' ? 'word' : 'letter'} and its ${pool.kind === 'words' ? 'meaning' : 'sound'}.</p>
    <div class="mem">${cards.map((c, k) => `<button class="mcard" data-k="${k}" aria-label="Hidden card"><span class="mback">🐯</span><span class="mface ${c.side}">${c.side === 'ko' ? `<span class="ko">${esc(c.it.ko)}</span>` : `<span class="em">${c.it.emoji}</span><span class="en">${esc(c.it.en)}</span>`}</span></button>`).join('')}</div>`;
  stat();
  $$('.mcard', box).forEach(b => b.onclick = () => {
    const k = +b.dataset.k, c = cards[k];
    if (lock || b.classList.contains('up')) return;
    b.classList.add('up'); b.setAttribute('aria-label', c.side === 'ko' ? c.it.ko : c.it.en);
    if (c.side === 'ko') say(c.it.say);
    open.push([b, c]);
    if (open.length < 2) return;
    moves++; stat();
    const [[b1, c1], [b2, c2]] = open; open = [];
    if (c1.i === c2.i) {
      matched++; sfx('good'); b1.classList.add('ok'); b2.classList.add('ok'); addXP(1);
      if (matched === pairs.length) {
        const g = gameStats(p).memory; g.plays++; g.wins++; if (!g.best || moves < g.best) g.best = moves;
        addXP(10);
        setTimeout(() => { sfx('win'); burst(); gameOver(box, { title: '짝 맞추기 성공!', pose: 'cheer', text: `All pairs found in <b>${moves} moves</b>. ${moves <= 8 ? 'Amazing memory!' : 'Try to beat it with fewer moves!'} (+16 XP)`, again: playMemory }); }, 700);
      }
    } else {
      lock = true; sfx('bad');
      setTimeout(() => { b1.classList.remove('up'); b2.classList.remove('up'); lock = false; }, 950);
    }
  });
}

/* --- Swipe Cards --- */
function playSwipe(mode) {

    const ra = a.word && p.words[a.key], rb = b.word && p.words[b.key];
    return ((ra ? ra.box : 0) - (rb ? rb.box : 0)) || ((ra && ra.due <= now ? 0 : 1) - (rb && rb.due <= now ? 0 : 1));
  });

  let i = 0, known = 0, again = [];
  box.innerHTML = `<div class="chips" style="justify-content:center"><button class="chip" data-mode="ko" aria-pressed="${mode === 'ko'}">Korean first</button><button class="chip" data-mode="en" aria-pressed="${mode === 'en'}">English first</button></div>

    <p class="muted" style="font-size:.9rem">Tap the card to flip it. Swipe or use the buttons (← / → keys work too).</p>
    <div class="row" style="justify-content:center">
      <button class="btn red swbtn" id="sw-no" aria-label="Still learning">✗</button>

  $$('[data-mode]', box).forEach(b => b.onclick = () => playSwipe(b.dataset.mode));

  function render() {
    stat();
    const it = deck[i];
    const front = mode === 'ko' ? `<span class="ko big">${esc(it.ko)}</span>` : `<span class="em">${it.emoji}</span><span class="en">${esc(it.en)}</span>`;
    const back = mode === 'ko' ? `<span class="em">${it.emoji}</span><span class="en">${esc(it.en)}</span>${pool.kind === 'words' && showRom(it.word.stage) ? `<span class="rom">${esc(it.rom)}</span>` : ''}` : `<span class="ko big">${esc(it.ko)}</span><span class="rom">${esc(it.rom)}</span>`;
    $('#sw-stack', box).innerHTML = `${deck[i + 1] ? '<div class="scard under"></div>' : ''}<div class="scard" id="sc" tabindex="0"><div class="sin"><div class="sf front">${front}<span class="muted small">tap to flip</span></div><div class="sf back">${back}</div></div></div>`;
    if (mode === 'ko') say(it.say);
    bindCard($('#sc', box));
  }
  function flip() { const c = $('#sc', box); if (!c) return; c.classList.toggle('flipped'); if (c.classList.contains('flipped') && mode === 'en') say(deck[i].say); }
  function decide(ok) {
    const c = $('#sc', box); if (!c || c.dataset.gone) return;
    c.dataset.gone = 1;
    c.style.transition = 'transform .3s ease, opacity .3s'; c.style.transform = `translateX(${ok ? 140 : -140}%) rotate(${ok ? 18 : -18}deg)`; c.style.opacity = 0;
    const it = deck[i];
    sfx(ok ? 'good' : 'bad');
    if (ok) { known++; addXP(1); } else again.push(it);
    if (it.word) { const r = p.words[it.key]; if (r) { if (ok) { r.right++; if (r.due <= Date.now()) { r.box = Math.min(5, r.box + 1); r.due = Date.now() + BOX_GAP[r.box]; } } else { r.wrong++; r.box = 1; r.due = Date.now() + 10 * 60000; } } }
    else markLetter(it.key, ok);
    save();
    setTimeout(() => {
      i++;
      if (i < deck.length) return render();
      const g = gameStats(p).swipe; g.plays++; g.known += known; addXP(5);
      gameOver(box, { title: known === deck.length ? '완벽해요! Perfect!' : '잘했어요! Deck done!', pose: known >= deck.length * .7 ? 'cheer' : 'thumbs',
        text: `You knew <b>${known} of ${deck.length}</b> cards.${again.length ? `<br>Keep practising: <span class="ko">${again.map(x => esc(x.ko)).join(', ')}</span>` : ''}`, again: () => playSwipe(mode) });
    }, 280);
  }
  function bindCard(c) {
    let x0 = null, dx = 0, moved = false;
    c.addEventListener('pointerdown', e => { x0 = e.clientX; dx = 0; moved = false; c.setPointerCapture(e.pointerId); c.style.transition = 'none'; });
    c.addEventListener('pointermove', e => {
      if (x0 === null) return; dx = e.clientX - x0; if (Math.abs(dx) > 6) moved = true;
      c.style.transform = `translateX(${dx}px) rotate(${dx / 18}deg)`;
      box.querySelector('.hint.left').style.opacity = Math.min(1, Math.max(0, -dx / 90));

      if (x0 === null) return; x0 = null;

  $('#sw-flip', box).onclick = flip;

  G.cleanup = () => document.removeEventListener('keydown', key);
  render();
}

/* --- Speed Read --- */
function playSpeed() {
  const p = me(), pool = gamePool(p);
  const box = G ? $('#g-in') : openGame('Speed Read');
  let score = 0, left = 60, timer = null, cur = null, busy = false;
  const stat = () => $('#g-stat').textContent = `⏱ ${left}s · ⭐ ${score}`;
  box.innerHTML = `<img src="${tiger('point')}" alt="" style="width:140px"><h2>60 seconds. Ready?</h2>
    <p class="muted">Read the Korean and tap the right meaning, as fast as you can.</p><button class="btn red" id="sp-go">Start!</button>`;
  $('#g-stat').textContent = `best ${gameStats(p).speed.best}`;
  $('#sp-go', box).onclick = () => {
    box.innerHTML = `<div class="bar"><i id="sp-t" style="width:100%;transition:width 1s linear"></i></div><div id="sp-q" style="display:grid;gap:18px;width:100%;justify-items:center"></div>`;
    stat(); next();
    timer = setInterval(() => {
      left--; stat(); $('#sp-t').style.width = (left / 60 * 100) + '%';
      if (left <= 0) end();

  };
  if (G.cleanup) G.cleanup();
  G.cleanup = () => clearInterval(timer);
  function next() {

    cur = it;

    $('#sp-q').innerHTML = `<span class="ko" style="font-size:clamp(3rem,14vw,4.5rem);line-height:1.1">${esc(it.ko)}</span>
      <div class="opts">${opts.map(o => `<button class="opt" data-k="${esc(o.key)}"><span class="em">${o.emoji}</span><span>${esc(o.en)}</span></button>`).join('')}</div>`;
    $$('#sp-q .opt').forEach(b => b.onclick = () => {
      if (busy) return; busy = true;

      b.classList.add(ok ? 'right' : 'wrong');
      if (!ok) $$('#sp-q .opt').find(x => x.dataset.k === it.key).classList.add('right');
      sfx(ok ? 'good' : 'bad');
      if (ok) { score++; stat(); }
      setTimeout(next, ok ? 250 : 900);

  }
  function end() {
    clearInterval(timer);
    const g = gameStats(p).speed; g.plays++;

    gameOver(box, { title: best && score ? '신기록! New record!' : `${score} correct!`, pose: score >= 10 ? 'cheer' : 'thumbs',
      text: `You read <b>${score}</b> ${pool.kind === 'words' ? 'words' : 'letters'} in 60 seconds. Best: <b>${g.best}</b>. (+${score} XP)`, again: playSpeed });
  }
}

/* ================= Korean numbers ================= */
/* Sino-Korean (일 이 삼) — used for money, dates, phone numbers, floors. */
const SINO_D = ['', '일', '이', '삼', '사', '오', '육', '칠', '팔', '구'];
const SINO_ROM = { '영': 'yeong', '일': 'il', '이': 'i', '삼': 'sam', '사': 'sa', '오': 'o', '육': 'yuk', '칠': 'chil', '팔': 'pal', '구': 'gu', '십': 'sip', '백': 'baek', '천': 'cheon', '만': 'man', '원': 'won' };
function sinoUnder10k(n) {
  let s = '', r = n;
  [['천', 1000], ['백', 100], ['십', 10]].forEach(([ch, v]) => { const q = Math.floor(r / v); if (q) { s += (q === 1 ? '' : SINO_D[q]) + ch; r %= v; } });
  if (r) s += SINO_D[r];
  return s;
}
function sinoKo(n) {
  if (n === 0) return '영';
  let s = '';
  const man = Math.floor(n / 10000), rest = n % 10000;
  if (man) s += (man === 1 ? '' : sinoUnder10k(man)) + '만';
  if (rest) s += (s ? ' ' : '') + sinoUnder10k(rest);
  return s;
}
/* Native Korean (하나 둘 셋) — used for counting things, people, age, hours. */
const NAT_ONES = ['', '하나', '둘', '셋', '넷', '다섯', '여섯', '일곱', '여덟', '아홉'];
const NAT_TENS = ['', '열', '스물', '서른', '마흔', '쉰', '예순', '일흔', '여든', '아흔'];
const NAT_ROM = { '하나': 'hana', '둘': 'dul', '셋': 'set', '넷': 'net', '다섯': 'daseot', '여섯': 'yeoseot', '일곱': 'ilgop', '여덟': 'yeodeol', '아홉': 'ahop', '열': 'yeol', '스물': 'seumul', '서른': 'seoreun', '마흔': 'maheun', '쉰': 'swin', '예순': 'yesun', '일흔': 'ilheun', '여든': 'yeodeun', '아흔': 'aheun', '백': 'baek' };
function nativeKo(n) {
  if (n === 100) return '백';
  return NAT_TENS[Math.floor(n / 10)] + NAT_ONES[n % 10];
}
/* romanise by splitting the Korean back into the number blocks we built it from */
function romOf(ko, map) {
  const keys = Object.keys(map).sort((a, b) => b.length - a.length);
  const out = []; let i = 0;
  while (i < ko.length) {
    if (ko[i] === ' ') { out.push(' '); i++; continue; }
    const k = keys.find(k => ko.startsWith(k, i));
    if (!k) { i++; continue; }
    out.push(map[k]); i += k.length;
  }
  return out.join('-').replace(/-? -?/g, ' ');
}
const numKo = (n, sys) => sys === 'native' ? nativeKo(n) : sinoKo(n);
const numRom = (n, sys) => sys === 'native' ? romOf(nativeKo(n), NAT_ROM) : romOf(sinoKo(n), SINO_ROM);

/* --- Count to 100 (bubble pop) --- */
const BUB_TOPS = [20, 50, 100];
function playBubbles(opts) {
  const p = me(), g = gameStats(p).bubbles;
  g.bests = g.bests || {};
  const box = G ? $('#g-in') : openGame('Count to 100');
  const o = opts || { top: 100, sys: 'native' };
  const key = o.sys + '-' + o.top;
  const bestOf = k => g.bests[k] || 0;
  const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
  if (G.cleanup) G.cleanup();

  $('#g-stat').textContent = bestOf(key) ? `best ${fmt(bestOf(key))}` : '';
  box.innerHTML = `<div class="bub-intro">
    <img src="${tiger('point')}" alt="" style="width:130px">
    <h2>Pop them in order!</h2>
    <p class="muted" style="max-width:40ch">Bubbles float past with Korean numbers on them. Pop <b>1, 2, 3…</b> all the way up — in the right order. The clock is running!</p>
    <div>
      <p class="muted" style="font-size:.72rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;margin-bottom:6px">Which numbers?</p>
      <div class="pickrow" id="bb-sys">
        <button class="pk ${o.sys === 'native' ? 'on' : ''}" data-sys="native"><span class="ko">하나 둘 셋</span><small>Counting</small></button>
        <button class="pk ${o.sys === 'sino' ? 'on' : ''}" data-sys="sino"><span class="ko">일 이 삼</span><small>Money &amp; time</small></button>
      </div>
    </div>
    <div>
      <p class="muted" style="font-size:.72rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;margin-bottom:6px">How far?</p>
      <div class="pickrow" id="bb-top">${BUB_TOPS.map(t => `<button class="pk ${o.top === t ? 'on' : ''}" data-top="${t}">1–${t}<small>${bestOf(o.sys + '-' + t) ? 'best ' + fmt(bestOf(o.sys + '-' + t)) : 'no time yet'}</small></button>`).join('')}</div>
    </div>
    <button class="btn red" id="bb-go" style="font-size:1.1rem;padding:14px 28px">Start!</button>
  </div>`;
  $$('#bb-sys .pk', box).forEach(b => b.onclick = () => playBubbles({ top: o.top, sys: b.dataset.sys }));
  $$('#bb-top .pk', box).forEach(b => b.onclick = () => playBubbles({ top: +b.dataset.top, sys: o.sys }));
  $('#bb-go', box).onclick = run;

  function run() {
    let cur = 1, penalty = 0, t0 = Date.now(), raf = null, tick = null, done = false;
    const WINDOW = 6;
    const secs = () => (Date.now() - t0) / 1000 + penalty;
    box.innerHTML = `<div class="bub-hud">
        <div class="bub-next"><span class="lbl">Pop</span><b id="bb-n">1</b><span class="rm" id="bb-r"></span></div>
        <span class="pill" id="bb-t">0:00</span>
      </div>
      <div class="bub-wrap" id="bb-w"></div>
      <div class="bar" style="margin-top:10px"><i id="bb-b" style="width:0%"></i></div>
      <p class="muted" style="text-align:center;margin-top:6px;font-size:.82rem">Tap the bubble that says the next number. A wrong pop costs 3 seconds.</p>`;
    const wrap = $('#bb-w', box);
    let W = wrap.clientWidth, H = wrap.clientHeight, live = [];

    const colours = ['#7fd4ff', '#ffd27f', '#ffb3c8', '#b9f0c4', '#d7c1ff', '#ffc9a3'];
    /* Bubbles are given their own lane so two of them never sit on top of each
       other — a small child tapping a drifting bubble should never hit its neighbour. */
    const lanes = () => Math.max(2, Math.min(4, Math.floor(W / 112)));
    function freeLane() {
      const n = lanes(), used = live.map(b => b.lane);
      const open = [...Array(n).keys()].filter(i => !used.includes(i));
      return open.length ? pick(open) : Math.floor(Math.random() * n);
    }
    function makeBubble(n) {
      const ko = numKo(n, o.sys), rom = numRom(n, o.sys);
      const cols = lanes(), lane = freeLane(), lw = W / cols;
      const size = Math.max(70, Math.min(112, Math.min(lw - 10, 60 + ko.length * 13)));
      const el = document.createElement('button');
      el.className = 'bub'; el.type = 'button'; el.style.width = el.style.height = size + 'px';
      el.style.setProperty('--bubc', colours[n % colours.length]);
      el.setAttribute('aria-label', `${ko}, ${rom}, number ${n}`);
      el.innerHTML = `<span class="bko" style="font-size:${ko.length > 3 ? '.92rem' : ko.length > 2 ? '1.06rem' : '1.3rem'}">${esc(ko)}</span><span class="brom">${esc(rom)}</span>`;
      const gap = Math.max(0, lw - size);
      const low = live.filter(x => x.lane === lane).reduce((m, x) => Math.max(m, x.y + x.size), 0);
      const b = { n, el, size, lane, base: lane * lw + gap / 2, drift: gap / 2,
        y: Math.max(H + 20, low + 46) + Math.random() * 50, sp: 24 + Math.random() * 18, ph: Math.random() * 6.3 };
      el.onclick = () => hit(b);
      wrap.appendChild(el); live.push(b);
    }
    function spawnUpTo() {
      const have = new Set(live.map(b => b.n));
      for (let n = cur; n <= Math.min(o.top, cur + WINDOW - 1); n++) if (!have.has(n)) makeBubble(n);
    }
    function hit(b) {
      if (done) return;
      if (b.n !== cur) {
        penalty += 3; sfx('bad');
        b.el.classList.add('no'); setTimeout(() => b.el.classList.remove('no'), 420);
        wrap.classList.add('wrong'); setTimeout(() => wrap.classList.remove('wrong'), 420);
        return;
      }
      sfx('good'); say(numKo(b.n, o.sys));
      b.el.style.setProperty('--tf', b.el.style.transform);
      b.el.classList.add('pop'); const el = b.el;
      setTimeout(() => el.remove(), 340);
      live = live.filter(x => x !== b);
      cur++;
      if (cur > o.top) return finish();
      spawnUpTo(); hud();
    }
    function hud() {
      $('#bb-n', box).textContent = numKo(cur, o.sys);
      $('#bb-r', box).textContent = numRom(cur, o.sys);
      $('#bb-b', box).style.width = ((cur - 1) / o.top * 100) + '%';
    }
    let last = performance.now();
    function frame(now) {
      const dt = Math.min(.05, (now - last) / 1000); last = now;
      const t = now / 1000;
      live.forEach(b => {
        b.y -= b.sp * dt;
        if (b.y < -b.size) {
          const lane = freeLane(), cols = lanes(), lw = W / cols, gap = Math.max(0, lw - b.size);
          const low = live.filter(x => x !== b && x.lane === lane).reduce((m, x) => Math.max(m, x.y + x.size), 0);
          b.lane = lane; b.base = lane * lw + gap / 2; b.drift = gap / 2;
          b.y = Math.max(H + 20, low + 46) + Math.random() * 40;
        }
        const x = b.base + Math.sin(t * .8 + b.ph) * b.drift;
        b.el.style.transform = `translate(${x}px, ${b.y}px)`;
      });
      raf = requestAnimationFrame(frame);
    }
    function finish() {
      done = true; cancelAnimationFrame(raf); clearInterval(tick);
      const time = secs(), prev = bestOf(key), best = !prev || time < prev;
      g.plays++; g.wins++; if (best) g.bests[key] = Math.round(time * 10) / 10;
      const xp = o.top === 100 ? 30 : o.top === 50 ? 18 : 10;
      addXP(xp); sfx('win'); burst();
      gameOver(box, { title: best ? '신기록! New record!' : '백까지 다 셌어요!', pose: 'cheer',
        text: `You popped <b>1 to ${o.top}</b> in <b>${fmt(time)}</b>${penalty ? ` (including ${penalty}s of wrong-pop penalties)` : ' with no mistakes'}.<br>Best for ${o.sys === 'native' ? '하나 둘 셋' : '일 이 삼'} 1–${o.top}: <b>${fmt(g.bests[key])}</b>. (+${xp} XP)`,
        again: () => playBubbles(o) });
    }
    const onResize = () => {
      W = wrap.clientWidth; H = wrap.clientHeight;
      const cols = lanes(), lw = W / cols;
      live.forEach(b => { b.lane = Math.min(b.lane, cols - 1); b.size = Math.min(b.size, lw - 10);
        b.el.style.width = b.el.style.height = b.size + 'px';
        const gap = Math.max(0, lw - b.size); b.base = b.lane * lw + gap / 2; b.drift = gap / 2; });
    };
    addEventListener('resize', onResize);
    G.cleanup = () => { cancelAnimationFrame(raf); clearInterval(tick); removeEventListener('resize', onResize); };
    spawnUpTo();
    /* the first batch spawns below the tank; lift it so play starts with bubbles on screen */
    const lift = Math.min(...live.map(b => b.y)) - H * 0.1;
    live.forEach(b => b.y -= lift);
    hud();
    tick = setInterval(() => { if (!done) $('#bb-t', box).textContent = fmt(secs()); }, 200);
    raf = requestAnimationFrame(frame);
  }
}

    ${[1, 2, 3].map(w => `<div class="section-h"><h2>${WAVE_NAME[w]}</h2><span class="muted">Opens after Stage ${WAVE_GATE[w]}</span></div>
      <div class="grid missions">${D.missions.filter(m => m.wave === w).map(card).join('')}</div>`).join('')}`;
  $$('[data-mission]', main).forEach(b => b.onclick = () => startMission(b.dataset.mission));
};

function startMission(id) {
  const m = D.missions.find(x => x.id === id); if (!m) return;
  const steps = [{ type: 'mIntro', m }];
  m.turns.forEach(t => {
    if (t.npc) steps.push({ type: 'mLine', m, npc: t.npc, alone: !t.q });
    if (t.q) {
      if (t.q.kind === 'reply') steps.push({ type: 'mReply', m, q: t.q });
      else if (t.q.kind === 'listen') steps.push({ type: 'mListen', m, q: t.q });
      else steps.push({ type: 'mSay', m, q: t.q });
    }
  });
  steps.push({ type: 'mDone', m });
  openPlayer(steps, { title: m.title });
}

function printPDF(src) {
  const f = document.createElement('iframe');
  f.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0';
  f.src = src;
  f.onload = () => {
    try { f.contentWindow.focus(); f.contentWindow.print(); }
    catch (e) { window.open(src, '_blank', 'noopener'); }   // some browsers block it — just open the file
    setTimeout(() => f.remove(), 60000);
  };
  f.onerror = () => { f.remove(); window.open(src, '_blank', 'noopener'); };
  document.body.appendChild(f);
  toast('Opening the print dialogue…');
}

/* ================= Level 2: 친구와 가족 ================= */
const L2 = window.HQ_L2 || { units: [], patterns: {}, cast: {}, words: [] };
const CAST = L2.cast;
const L2_GATE = 9;                       // Stage 9 must be passed before Level 2 opens
const ACTIVE_WORDS = 250;                // how many words sit in daily review at once

function l2Open(p) { return preview() || stagePassed(p, L2_GATE) || S.settings.l2Early; }
function l2State(p) { p.l2 = p.l2 || { sets: {}, patterns: {}, dialogues: {}, units: {} }; return p.l2; }
function unitOf(id) { return L2.units.find(u => u.id === id); }
function setDone(p, sid) { return !!l2State(p).sets[sid]; }
function patternDone(p, pid) { return !!l2State(p).patterns[pid]; }
function dialogueDone(p, did) { return !!l2State(p).dialogues[did]; }
function unitParts(u) {
  return [...u.sets.map(s => ({ kind: 'set', id: s.id, o: s })),
          ...u.patterns.map(pid => ({ kind: 'pattern', id: pid, o: L2.patterns[pid] })),
          ...u.dialogues.map(d => ({ kind: 'dialogue', id: d.id, o: d }))];
}
function unitDoneCount(p, u) {
  const st = l2State(p);
  return unitParts(u).filter(x => (x.kind === 'set' ? st.sets : x.kind === 'pattern' ? st.patterns : st.dialogues)[x.id]).length;
}
const unitComplete = (p, u) => unitDoneCount(p, u) === unitParts(u).length;
function unitOpen(p, u) { return preview() || u.id === 1 || unitComplete(p, unitOf(u.id - 1)); }
function l2WordCount(p) { return L2.words.filter(w => p.words[w.ko]).length; }
// Only a slice of the bank is in daily rotation, so review never becomes a chore.
function activeCount(p) { return Object.values(p.words).filter(w => !w.parked).length; }

/* ---------- the Learn view: Level 1 / Level 2 switch ---------- */

function unitCard(p, u) {
  const open = unitOpen(p, u), done = unitDoneCount(p, u), total = unitParts(u).length;
  return `<button class="card unit${open ? '' : ' locked'}${done === total ? ' done' : ''}" ${open ? `data-unit="${u.id}"` : 'disabled'}>
    <span class="ushot">
      <img class="uscene" src="assets/scenes/${u.dialogues[0].scene}.webp" alt="" loading="lazy" onerror="this.remove()">
      <img class="ucast" src="assets/cast/${u.face || u.dialogues[0].with[0]}.webp" alt="" loading="lazy" onerror="this.remove()">
      <img class="ucover" src="assets/units/${u.img}.webp" alt="" loading="lazy" onerror="this.remove()">
      ${open ? '' : '<span class="mlock">🔒 Finish the unit before</span>'}
      ${done === total ? '<span class="mtick">✓</span>' : ''}</span>
    <span class="mbody">
      <span class="eyebrow">Unit ${u.id} · <span class="ko">${esc(u.ko)}</span></span>
      <h3>${esc(u.title)}</h3>
      <span class="muted">${esc(u.blurb)}</span>
      <span class="bar" style="margin-top:6px"><i style="width:${(done / total) * 100}%"></i></span>
      <span class="muted" style="font-size:.85rem">${done} / ${total} parts</span>
    </span></button>`;
}

/* ---------- one unit ---------- */
VIEWS.unit = (main, id) => {
  const p = me(), u = unitOf(+id); if (!u) return go('learn', 2);
  const st = l2State(p);
  const row = (kind, key, icon, eyebrow, title, sub, open) => {
    const fin = (kind === 'set' ? st.sets : kind === 'pattern' ? st.patterns : st.dialogues)[key];
    return `<button class="card lesson${open ? '' : ' locked'}" ${open ? `data-part="${kind}:${key}"` : 'disabled'}>
      <span class="lnum ${kind}">${icon}</span>
      <span style="flex:1;text-align:left"><span class="eyebrow">${eyebrow}</span><h3>${title}</h3><span class="muted">${sub}</span></span>
      <span class="pill${fin ? ' done' : ''}">${fin ? '✓ Done' : open ? 'Start →' : '🔒'}</span></button>`;
  };
  const parts = unitParts(u);
  let openUpTo = true;
  const rows = parts.map((x, i) => {
    const open = preview() || i === 0 || (parts[i - 1] && (parts[i - 1].kind === 'set' ? st.sets : parts[i - 1].kind === 'pattern' ? st.patterns : st.dialogues)[parts[i - 1].id]);
    if (x.kind === 'set') return row('set', x.id, '📚', `Words · set ${x.id}`, esc(x.o.title), `${x.o.words.length} new words`, open);
    if (x.kind === 'pattern') return row('pattern', x.id, '🧩', 'Sentence Lab', esc(x.o.name), `<span class="ko">${esc(x.o.ko)}</span>`, open);
    return row('dialogue', x.id, x.o.talk === 'banmal' ? '🧒' : '👵', `Conversation · ${x.o.talk === 'banmal' ? '반말 (friend)' : '존댓말 (polite)'}`, esc(x.o.title), esc(x.o.intro), open);
  }).join('');
  main.innerHTML = `<button class="btn ghost small" id="bk">← All units</button>
    <div class="section-h"><div><span class="eyebrow">Unit ${u.id} · <span class="ko">${esc(u.ko)}</span></span><h1>${u.emoji} ${esc(u.title)}</h1>
      <p class="muted">${esc(u.blurb)}</p></div></div>
    <div class="grid" style="gap:12px">${rows}</div>
    <div class="card panel" style="margin-top:20px"><h3>By the end of this unit I can…</h3>
      <ul class="can-list">${u.can.map(c => `<li>${esc(c)}</li>`).join('')}</ul></div>`;
  $('#bk', main).onclick = () => go('learn', 2);
  $$('[data-part]', main).forEach(b => b.onclick = () => {
    const [kind, key] = b.dataset.part.split(':');
    if (kind === 'set') startWordSet(u, key);
    else if (kind === 'pattern') startPattern(u, key);
    else startDialogue(u, key);
  });
};

/* ---------- word set lesson ---------- */
function startWordSet(u, sid) {
  const set = u.sets.find(s => s.id === sid);
  const steps = [{ type: 'intro', eyebrow: `Unit ${u.id} · words`, title: set.title,
    html: `<b>${set.words.length} new words</b> for talking about ${esc(u.title.toLowerCase())}. You'll meet each one, then be asked a few.` }];
  set.words.forEach(w => steps.push({ type: 'l2word', w }));
  const quiz = shuffle(set.words).slice(0, 8);
  quiz.forEach(w => steps.push(l2WordQ(w, set.words)));
  steps.push({ type: 'l2done', kind: 'sets', key: sid, unit: u, title: 'Words learned!',
    text: `<b>${set.words.length}</b> new words are in your word bank. They'll come back in your reviews and games.` });
  openPlayer(steps, { title: set.title });
}

function l2WordQ(w, pool) {
  const others = shuffle(pool.filter(x => x.ko !== w.ko)).slice(0, 3);
  const opts = shuffle([w, ...others]).map(x => ({ value: x.ko, html: `<span class="en big">${esc(x.en)}</span>` }));
  return { type: 'choice', eyebrow: 'Quick check', prompt: `What does <span class="ko">${esc(w.ko)}</span> mean?`,

    answerText: `<b>${esc(w.en)}</b>`,
    onResult: ok => { const p = me(); const rec = p.words[w.ko]; if (rec) { rec[ok ? 'right' : 'wrong']++; } } };

  $$('.tile', box).forEach(b => b.onclick = () => {
    if (b.disabled) return;
    b.disabled = true; picked.push(b.dataset.t); say(b.dataset.t); draw();
  });
  $('#t-undo', box).onclick = () => { picked = []; $$('.tile', box).forEach(b => b.disabled = false); draw(); };
  function submit() {
    const ok = picked.join(' ') === want.join(' ');
    $$('.tile', box).forEach(b => b.disabled = true);
    P.total++; if (ok) { P.right++; gainXP(4); }
    sfx(ok ? 'good' : 'bad');
    slot.innerHTML = `<span class="ko">${esc(want.join(' '))}</span>`;
    say(want.join(' '));
    foot(ok ? '✓ 완벽해요! That is exactly it.' : `✗ It should be: <span class="ko">${esc(want.join(' '))}</span>`, ok ? 'good' : 'bad', 'Continue', advance);
  }
  draw();
}

/* ---------- conversations ---------- */
function startDialogue(u, did) {
  const d = u.dialogues.find(x => x.id === did);
  const steps = [{ type: 'l2dIntro', u, d }];
  d.turns.forEach(t => {
    if (t.ko) steps.push({ type: 'mLine', m: dScene(d), npc: { who: CAST[t.who].name, ko: t.ko, rom: t.rom, en: t.en, face: t.who }, alone: !t.q });
    if (t.q) {
      if (t.q.kind === 'reply') steps.push({ type: 'mReply', m: dScene(d), q: t.q });
      else if (t.q.kind === 'listen') steps.push({ type: 'mListen', m: dScene(d), q: t.q });
      else steps.push({ type: 'mSay', m: dScene(d), q: t.q });
    }
  });
  steps.push({ type: 'l2replay', u, d });
  steps.push({ type: 'l2done', kind: 'dialogues', key: did, unit: u, title: 'Conversation complete!',
    text: `You just held a whole conversation in Korean${d.talk === 'banmal' ? ' — in <b>반말</b>, like friends do' : ' — in polite <b>존댓말</b>'}.` });
  openPlayer(steps, { title: d.title });
}
// dialogues borrow the mission renderer, so they need the same shape a mission has
const dScene = d => ({ scene: d.scene, emoji: d.talk === 'banmal' ? '🧒' : '👵', place: d.talk === 'banmal' ? '반말' : '존댓말', face: d.with[0] });

STEP.l2dIntro = (box, st) => {
  const d = st.d;
  box.innerHTML = `<span class="eyebrow">Unit ${st.u.id} · conversation</span><h1>${esc(d.title)}</h1>
    ${mScene(dScene(d), true)}
    <div class="who-row">${d.with.map(c => `<span class="who-chip"><img src="assets/cast/${c}.webp" alt=""><b class="ko">${esc(CAST[c].name)}</b><span class="muted">${esc(CAST[c].en)}</span></span>`).join('')}</div>
    <div class="tipbox ${d.talk === 'banmal' ? '' : 'warn'}">${d.talk === 'banmal'
      ? '🧒 <b>반말</b> — they are your age, so drop the 요.'
      : '👵 <b>존댓말</b> — they are older, so every ending keeps its 요.'}</div>
    ${speech('point', esc(d.intro))}`;
  foot('', '', 'Start the conversation →', advance);
};
STEP.l2replay = (box, st) => {
  const d = st.d;
  const lines = [];
  const lead = d.with[0];
  d.turns.forEach(t => {
    if (t.ko) lines.push({ who: CAST[t.who].name, face: t.who, ko: t.ko, rom: t.rom, en: t.en, me: false });
    if (!t.q) return;
    if (t.q.kind === 'say') { lines.push({ who: 'You', ko: t.q.ko, rom: t.q.rom, en: t.q.en, me: true }); return; }
    if (t.q.kind === 'listen') {
      // a listening question with no spoken line above it is still something they said
      if (!t.ko) lines.push({ who: CAST[t.who || lead].name, face: t.who || lead, ko: t.q.ko, rom: t.q.rom, en: (t.q.options.find(o => o.ok) || {}).en || '', me: false });
      return;
    }
    const r = (t.q.options || []).find(o => o.ok);
    if (r && r.ko) lines.push({ who: 'You', ko: r.ko, rom: r.rom, en: r.en, me: true });
  });
  box.innerHTML = `<span class="eyebrow">The whole conversation</span><h2>${esc(d.title)}</h2>
    <div class="script">${lines.map((l, i) => `<div class="sline ${l.me ? 'mine' : ''}" data-i="${i}">
      ${l.me ? '' : `<img class="sface" src="assets/cast/${l.face}.webp" alt="">`}
      <div class="sbubble"><span class="swho">${esc(l.who)}</span><span class="ko">${esc(l.ko)}</span>
        ${S.settings.rom === 'never' ? '' : `<span class="rom">${esc(l.rom)}</span>`}<span class="en">${esc(l.en)}</span></div></div>`).join('')}</div>
    <div class="row" style="justify-content:center"><button class="btn blue" id="play-all">▶ Play the whole thing</button></div>`;
  $$('.sline', box).forEach(el => el.onclick = () => say(lines[+el.dataset.i].ko));
  $('#play-all', box).onclick = () => {
    let i = 0;
    const next = () => {
      if (i >= lines.length) return;
      const el = $$('.sline', box)[i];
      $$('.sline', box).forEach(x => x.classList.remove('now'));
      el.classList.add('now'); el.scrollIntoView({ block: 'center', behavior: 'smooth' });
      const u = say(lines[i].ko); i++;
      if (u) u.onend = () => setTimeout(next, 420); else setTimeout(next, 1600);
    };
    next();
  };
  gainXP(3);
  foot('', '', 'Finish', advance);
};

/* ---------- shared finish step ---------- */
STEP.l2done = (box, st) => {
  const p = me(), s = l2State(p);
  s[st.kind][st.key] = { at: todayStr(), right: P.right, of: P.total };
  const u = st.unit;
  const finishedUnit = unitComplete(p, u);
  if (finishedUnit) s.units[u.id] = { at: todayStr() };
  save();
  if (finishedUnit) { sfx('win'); burst(); } else sfx('good');
  box.innerHTML = `<img src="${tiger(finishedUnit ? 'cheer' : 'thumbs')}" alt="" style="width:170px">
    <h1>${finishedUnit ? `Unit ${u.id} complete! 🎉` : st.title}</h1>
    <p class="mn-text">${finishedUnit ? `You've finished <b>${esc(u.title)}</b>. ${esc(u.can[0].charAt(0).toUpperCase() + u.can[0].slice(1))} — and three other things you couldn't do this morning.` : st.text}</p>
    <div class="row" style="justify-content:center">${P.total ? `<span class="pill">✓ ${P.right}/${P.total}</span>` : ''}<span class="pill">⭐ +${P.xp} XP</span>${P.newWords ? `<span class="pill done">📚 +${P.newWords} words</span>` : ''}</div>`;
  $('#p-bar').style.width = '100%';
  foot('', '', 'Done', closePlayer);
};

/* ================= Essentials: the survival vocabulary ================= */
const ESS = window.HQ_ESS || { groups: [], sections: [], words: [] };
const essSection = id => ESS.sections.find(s => s.id === id);
function essState(p) { p.ess = p.ess || {}; return p.ess; }
const essDone = (p, id) => !!essState(p)[id];
const essDoneCount = p => ESS.sections.filter(s => essDone(p, s.id)).length;
function essKnown(p, s) { return s.words.filter(w => p.words[w.ko]).length; }

function renderEssentials(box) {
  const p = me();
  box.innerHTML = `<div class="section-h" style="margin-top:14px">
      <div><span class="eyebrow">Essentials · <span class="ko">꼭 필요한 말</span></span><h1>The words you actually need</h1></div>
      <p class="muted" style="max-width:44ch">Every survival word, sorted by the job it does in a sentence. Nothing is locked —
        dip in whenever you like, in any order. ${essDoneCount(p)} of ${ESS.sections.length} lists practised.</p>
    </div>
    ${ESS.groups.map(g => `
      <div class="ess-group">
        <div class="ess-head"><span class="ess-emoji">${g.emoji}</span>
          <div><span class="eyebrow">${esc(g.sub)}</span><h2>${esc(g.title)}</h2>
          <p class="muted">${esc(g.blurb)}</p></div></div>
        <div class="grid ess">${g.sections.map(s => {
          const known = essKnown(p, s), fin = essDone(p, s.id);
          return `<button class="card ess-card${fin ? ' done' : ''}" data-ess="${s.id}">
            <span class="ess-icon">${s.emoji}</span>
            <span style="flex:1;text-align:left">
              <span class="eyebrow">${esc(s.kind)}</span>
              <h3>${esc(s.title)}</h3>
              <span class="muted">${s.words.length} words${known ? ` · ${known} already in your word bank` : ''}</span>
            </span>
            <span class="pill${fin ? ' done' : ''}">${fin ? '✓' : '→'}</span></button>`;
        }).join('')}</div>
      </div>`).join('')}
    <div class="card panel" style="margin-top:20px;display:flex;gap:16px;align-items:center">
      <img src="${tiger('point')}" alt="" style="width:96px;flex:none">
      <div><h3>Print the whole lot</h3>
        <p class="muted" style="font-size:.92rem">Every essential word on paper, grouped exactly like this, with room to write each one.</p>
        <div class="row" style="margin-top:8px">
          <a class="btn small red" href="assets/printables/essentials.pdf" download>⬇︎ Download PDF</a>
          <button class="btn small blue" data-print="essentials">🖨️ Print</button>
        </div></div>
    </div>`;
  $$('[data-ess]', box).forEach(b => b.onclick = () => go('essSection', b.dataset.ess));
  $$('[data-print]', box).forEach(b => b.onclick = () => printPDF(`assets/printables/${b.dataset.print}.pdf`));
}

/* ---------- one list: read it, hear it, then practise it ---------- */
VIEWS.essSection = (main, id) => {
  const p = me(), s = essSection(id);
  if (!s) return go('learn', 'ess');
  main.innerHTML = `<button class="btn ghost small" id="bk">← All essentials</button>
    <div class="section-h"><div><span class="eyebrow">${esc(s.groupTitle)} · ${esc(s.kind)}</span>
      <h1>${s.emoji} ${esc(s.title)}</h1></div>
      <button class="btn red" id="practise">Practise these →</button></div>
    ${s.note ? `<div class="tipbox">💡 ${esc(s.note)}</div>` : ''}
    <div class="ess-list">${s.words.map(w => `
      <div class="card ess-word">
        <button class="ess-main" data-say="${esc(w.ko)}">
          <span class="em">${w.emoji}</span>
          <span class="wtext"><span class="ko">${esc(w.ko)}</span>
            ${S.settings.rom === 'never' ? '' : `<span class="rom">${esc(w.rom)}</span>`}
            <span class="en">${esc(w.en)}</span>
            ${w.note ? `<span class="note">${esc(w.note)}</span>` : ''}</span>
          <span class="spk">🔊</span>
        </button>
        ${w.ex ? `<button class="ess-ex" data-say="${esc(w.ex.ko)}">
          <span class="exlabel">In a sentence</span>
          <span class="ko">${esc(w.ex.ko)}</span>
          ${S.settings.rom === 'never' ? '' : `<span class="rom">${esc(w.ex.rom)}</span>`}
          <span class="en">${esc(w.ex.en)}</span>
          <span class="spk">🔊</span></button>` : ''}
        ${p.words[w.ko] ? '<span class="pill done">in your bank</span>' : ''}
      </div>`).join('')}</div>
    <p class="muted" style="margin-top:16px;text-align:center">Tap a word to hear it, or tap the sentence to hear the whole thing.</p>`;
  $('#bk', main).onclick = () => go('learn', 'ess');
  $('#practise', main).onclick = () => startEssentials(s.id);
};

function startEssentials(id) {
  const s = essSection(id);
  const steps = [{ type: 'intro', eyebrow: `Essentials · ${s.kind}`, title: s.title,
    html: `<b>${s.words.length} words.</b> ${esc(s.note || '')}<br><br>Meet them one at a time, then a quick check on eight of them.` }];
  s.words.forEach(w => steps.push({ type: 'l2word', w }));
  shuffle(s.words).slice(0, 8).forEach(w => steps.push(l2WordQ(w, s.words)));
  steps.push({ type: 'essDone', section: s });
  openPlayer(steps, { title: s.title });
}

STEP.essDone = (box, st) => {
  const p = me(), s = st.section;
  essState(p)[s.id] = { at: todayStr(), right: P.right, of: P.total };
  save();
  sfx('win'); burst();
  const left = ESS.sections.filter(x => !essDone(p, x.id));
  box.innerHTML = `<img src="${tiger('cheer')}" alt="" style="width:170px">
    <h1>${esc(s.title)} ✓</h1>
    <p class="mn-text">That is <b>${s.words.length}</b> more essential words you can use anywhere — in a shop, on a train, at a dinner table.</p>
    <div class="row" style="justify-content:center">${P.total ? `<span class="pill">✓ ${P.right}/${P.total}</span>` : ''}<span class="pill">⭐ +${P.xp} XP</span>${P.newWords ? `<span class="pill done">📚 +${P.newWords} words</span>` : ''}</div>
    ${left.length ? `<p class="muted" style="margin-top:12px">Next up if you like: ${esc(left[0].title)}</p>` : '<p class="muted" style="margin-top:12px">Every essential list done. That is the survival kit complete. 🎉</p>'}`;
  $('#p-bar').style.width = '100%';
  foot('', '', 'Done', closePlayer);
};

/* ================= landing screen ================= */
// The first thing anyone sees. Big, animated, and one tap from the profile picker.
const LANDING_GLYPHS = ['가', 'ㅎ', '한', '글', 'ㅂ', '요', '말', 'ㅅ', '안', 'ㅇ', '어', 'ㅋ'];
const LANDING_SCENES = ['playground', 'snack-shop', 'classroom', 'home-kitchen', 'street-outside', 'birthday',
                        'park-bench', 'palace', 'subway', 'home-living'];

VIEWS.landing = main => {
  const p = me();
  const trip = S.settings.tripDate
    ? Math.ceil((new Date(S.settings.tripDate + 'T00:00:00') - new Date(todayStr() + 'T00:00:00')) / DAY) : null;
  // two words, each kept whole: a title that breaks mid-word looks like a bug
  const title = [{ cls: 'ko', chars: ['한', '글'] }, { cls: 'en', chars: ['Q', 'u', 'e', 's', 't'] }];
  document.body.classList.add('on-landing');
  main.innerHTML = `
  <div class="landing">
    <div class="lfx" aria-hidden="true">
      <span class="lsun"></span>
      <span class="ldots"></span>
      ${LANDING_GLYPHS.map((g, i) => `<span class="lglyph g${i}">${g}</span>`).join('')}
    </div>

    <div class="lhero">
      <div class="lart">
        <img class="lmascot" src="assets/mascot/horangi-wave.webp" alt="" onerror="this.src='assets/logo.webp'">
        <span class="lring"></span>
        <span class="lspark s1">✦</span><span class="lspark s2">✧</span><span class="lspark s3">✦</span>
      </div>

      <div class="lcopy">
        <span class="leyebrow">Learn Korean the fun way</span>
        <h1 class="ltitle">${(() => { let n = 0; return title.map(word =>
          `<span class="lword">${word.chars.map(ch =>
            `<span class="lch ${word.cls}" style="animation-delay:${(0.18 + n++ * 0.07).toFixed(2)}s">${ch}</span>`).join('')}</span>`).join(''); })()}</h1>
        <p class="ltag">Read it. Say it. <b>Live it.</b></p>
        <p class="lsub">Every letter, a thousand words and two dozen real conversations —
          built for two kids with a plane ticket to ${esc(S.settings.tripPlace || 'Korea')}.</p>

        <div class="lstats">
          <span class="lstat"><b>40</b>letters</span>
          <span class="lstat"><b>1,200</b>words</span>
          <span class="lstat"><b>24</b>conversations</span>
          <span class="lstat"><b>12</b>missions</span>
        </div>

        <div class="lcta">
          <button class="btn red lgo" id="l-start">${p ? 'Continue as ' + esc(p.name) : 'Start your quest'} <span class="larrow">→</span></button>
          ${p ? '<button class="btn ghost" id="l-switch">Switch learner</button>' : ''}
        </div>
        ${trip !== null && trip > 0 ? `<p class="lday"><b>D-${trip}</b> until <span class="ko">한국</span> ✈️</p>` : ''}
      </div>
    </div>

    <div class="lstrip" aria-hidden="true">
      <div class="ltrack">
        ${LANDING_SCENES.concat(LANDING_SCENES).map(s =>
          `<img src="assets/scenes/${s}.webp" alt="" loading="lazy" onerror="this.remove()">`).join('')}
      </div>
    </div>

    <p class="lfoot">made for <span class="ko">우리 가족</span> · tap anywhere to begin</p>
  </div>`;

  const leave = () => { document.body.classList.remove('on-landing'); go(me() ? 'home' : 'profiles'); };
  $('#l-start', main).onclick = e => { e.stopPropagation(); unlockSpeech(); leave(); };
  const sw = $('#l-switch', main);
  if (sw) sw.onclick = e => { e.stopPropagation(); document.body.classList.remove('on-landing'); go('profiles'); };
  // the whole screen is a button, but only once the entrance animation has played
  setTimeout(() => { const l = $('.landing', main); if (l) l.onclick = leave; }, 900);
};

/* ================= boot ================= */
go('landing');
})();
</script>

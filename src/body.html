<div class="topbar" id="topbar">
  <div class="dancheong"></div>
  <div class="topbar-in">
    <button class="brand" id="brand" aria-label="한글 Quest home"><img src="assets/logo.webp" alt=""><b>한글 <span>Quest</span></b></button>
    <nav class="tabs" id="tabs" hidden>
      <button class="tab" data-go="home"><span class="ti">🏠</span>Home</button>
      <button class="tab" data-go="path"><span class="ti ko">가</span>Hangul</button>
      <button class="tab" data-go="games"><span class="ti">🎮</span>Games</button>
      <button class="tab" data-go="words"><span class="ti">📚</span>Words</button>
      <button class="tab" data-go="parent"><span class="ti">🔒</span>Grown-ups</button>
    </nav>
    <div class="spacer"></div>
    <div class="style-tog" id="style-tog" hidden role="group" aria-label="Art style">
      <button data-style="cute" aria-pressed="true" title="Cute style">🧸</button>
      <button data-style="anime" aria-pressed="false" title="Anime style">⚡</button>
    </div>
    <div class="row" id="mebar" hidden style="gap:14px">
      <span class="stat hide-sm" title="Day streak">🔥 <span id="st-streak">0</span></span>
      <span class="stat" title="Experience points">⭐ <span id="st-xp">0</span></span>
      <button class="me" id="me-btn" title="Switch learner"><img id="me-av" src="" alt=""><span id="me-name"></span></button>
    </div>
  </div>
</div>
<main id="main"></main>
<div id="player-root"></div>
<script src="data.js"></script>
<script>
(() => {
'use strict';
const D = window.HQ_DATA;
const L = D.letters;
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random() * a.length)];
const DAY = 86400000;
const todayStr = (d = new Date()) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');

/* ================= Hangul maths ================= */
const CHO = 'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ'.split('');
const JUNG = 'ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ'.split('');
const JONG = ['', ...'ㄱㄲㄳㄴㄵㄶㄷㄹㄺㄻㄼㄽㄾㄿㅀㅁㅂㅄㅅㅆㅇㅈㅊㅋㅌㅍㅎ'.split('')];
const VERT = new Set('ㅏㅐㅑㅒㅓㅔㅕㅖㅣ'.split(''));
const HORZ = new Set('ㅗㅛㅜㅠㅡ'.split(''));
const ROM_I = {'ㄱ':'g','ㄲ':'kk','ㄴ':'n','ㄷ':'d','ㄸ':'tt','ㄹ':'r','ㅁ':'m','ㅂ':'b','ㅃ':'pp','ㅅ':'s','ㅆ':'ss','ㅇ':'','ㅈ':'j','ㅉ':'jj','ㅊ':'ch','ㅋ':'k','ㅌ':'t','ㅍ':'p','ㅎ':'h'};
const ROM_V = {'ㅏ':'a','ㅐ':'ae','ㅑ':'ya','ㅒ':'yae','ㅓ':'eo','ㅔ':'e','ㅕ':'yeo','ㅖ':'ye','ㅗ':'o','ㅘ':'wa','ㅙ':'wae','ㅚ':'oe','ㅛ':'yo','ㅜ':'u','ㅝ':'wo','ㅞ':'we','ㅟ':'wi','ㅠ':'yu','ㅡ':'eu','ㅢ':'ui','ㅣ':'i'};
function compose(i, v, t = '') { return String.fromCharCode(0xAC00 + (CHO.indexOf(i) * 21 + JUNG.indexOf(v)) * 28 + JONG.indexOf(t)); }
function decompose(ch) {
  const c = ch.charCodeAt(0) - 0xAC00;
  if (c < 0 || c > 11171) return null;
  return { i: CHO[Math.floor(c / 588)], v: JUNG[Math.floor((c % 588) / 28)], t: JONG[c % 28] };
}
const ROM_F = {'ㄱ':'k','ㄲ':'k','ㅋ':'k','ㄴ':'n','ㄷ':'t','ㅅ':'t','ㅆ':'t','ㅈ':'t','ㅊ':'t','ㅌ':'t','ㅎ':'t','ㄹ':'l','ㅁ':'m','ㅂ':'p','ㅍ':'p','ㅇ':'ng'};
const FIN_ROM = {'ㄱ':'k','ㄴ':'n','ㄷ':'t','ㄹ':'l','ㅁ':'m','ㅂ':'p','ㅇ':'ng'};
const BASIC_CON = 'ㄱㄴㄷㄹㅁㅂㅅㅈㅊㅎ'.split('');
const BASIC_VOW = 'ㅏㅓㅗㅜㅡㅣㅐ'.split('');
function romSyl(s) { const d = decompose(s); if (!d) return s; let r = ROM_I[d.i] + ROM_V[d.v]; if (d.i === 'ㅅ' && d.v === 'ㅣ') r = 'shi'; return r + (ROM_F[d.t] || ''); }
function blockHTML(ch) {
  const d = decompose(ch); if (!d) return '';
  const hz = HORZ.has(d.v), cls = (hz ? 'h' : 'v') + (d.t ? 't' : '');
  const cl = hz && d.t ? 'ht' : cls;
  return `<div class="blk ${cl}" aria-label="${esc(ch)}"><span class="i">${d.i}</span><span class="m">${d.v}</span>${d.t ? `<span class="t">${d.t}</span>` : ''}</div>`;
}

/* ================= storage ================= */
const KEY = 'hangulQuest.v1';
const defaults = () => ({ profiles: [], currentId: null, settings: { tripDate: '', tripPlace: 'Korea', rom: 'auto', rate: 0.85, sfx: true, voiceURI: '', romVoice: false } });
let S;
try { S = JSON.parse(localStorage.getItem(KEY)) || defaults(); } catch (e) { S = defaults(); }
S.settings = Object.assign(defaults().settings, S.settings || {});
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
const me = () => S.profiles.find(p => p.id === S.currentId) || null;
function newProfile(name, avatar, family) {
  return { id: 'p' + Date.now().toString(36), name, avatar, family, xp: 0, streak: 0, lastDay: '', created: Date.now(),
    lessons: {}, stages: {}, letters: {}, words: {}, days: {} };
}

/* ================= progress helpers ================= */
function addXP(n) {
  const p = me(); if (!p || !n) return;
  p.xp += n;
  const t = todayStr();
  if (p.lastDay !== t) {
    const y = todayStr(new Date(Date.now() - DAY));
    p.streak = p.lastDay === y ? p.streak + 1 : 1;
    p.lastDay = t;
  }
  p.days[t] = (p.days[t] || 0) + n;
  save(); updateBar();
}
const stageOf = id => D.stages.find(s => s.id === id);
const lessonById = id => { for (const s of D.stages) for (const l of (s.lessons || [])) if (l.id === id) return { stage: s, lesson: l }; return null; };
const stagePassed = (p, id) => !!(p.stages[id] && p.stages[id].passed);
const stageOpen = (p, id) => { const s = stageOf(id); return !!s && !s.soon && (id === 1 || stagePassed(p, id - 1)); };
function lessonOpen(p, stage, idx) { if (!stageOpen(p, stage.id)) return false; return idx === 0 || !!p.lessons[stage.lessons[idx - 1].id]; }
const allLessonsDone = (p, stage) => (stage.lessons || []).every(l => p.lessons[l.id]);
function knownLetters(uptoStage) { const out = []; D.stages.forEach(s => { if (s.id <= uptoStage && !s.soon) out.push(...s.letters); }); return out; }
function wordsFor(p, stageId) { return D.words.filter(w => w.stage === stageId && (!w.for || w.for === p.family)); }
function lessonWords(p, stage, lesson) { const ws = wordsFor(p, stage.id); return lesson.slice ? ws.slice(lesson.slice[0], lesson.slice[1]) : ws; }
function lettersLearned(p) { return Object.values(p.letters).filter(x => x.seen).length; }
function wordCount(p) { return Object.keys(p.words).length; }
function addWord(w, box = 1) {
  const p = me(); if (!p || p.words[w.ko]) return false;
  p.words[w.ko] = { box, due: Date.now() + (box > 1 ? BOX_GAP[box] : 0), right: 0, wrong: 0, added: Date.now() };
  return true;
}
const BOX_GAP = { 1: 0, 2: DAY, 3: 3 * DAY, 4: 7 * DAY, 5: 14 * DAY };
function dueWords(p) { const now = Date.now(); return D.words.filter(w => p.words[w.ko] && p.words[w.ko].due <= now); }
function nextStep(p) {
  for (const s of D.stages) {
    if (s.soon) break;
    if (!stageOpen(p, s.id)) break;
    if (stagePassed(p, s.id)) continue;
    const i = s.lessons.findIndex(l => !p.lessons[l.id]);
    if (i >= 0) return { kind: 'lesson', stage: s, lesson: s.lessons[i] };
    return { kind: 'challenge', stage: s };
  }
  return null;
}
function showRom(stageId) { const m = S.settings.rom; return m === 'always' || (m === 'auto' && stageId <= 6); }

/* ================= audio ================= */
let koVoice = null;
function pickVoice() {
  if (!('speechSynthesis' in window)) return;
  const vs = speechSynthesis.getVoices();
  koVoice = (S.settings.voiceURI && vs.find(v => v.voiceURI === S.settings.voiceURI))
    || vs.find(v => /^ko/i.test(v.lang) && /yuna|sora|google/i.test(v.name))
    || vs.find(v => /^ko/i.test(v.lang)) || null;
}
// Rough English-letter reading, used only when the device has no Korean voice at all.
function romanize(text) {
  return [...text].map(ch => {
    const d = decompose(ch);
    if (!d) return ch;
    let r = ROM_I[d.i] + ROM_V[d.v] + (ROM_F[d.t] || '');
    if (d.i === 'ㅅ' && d.v === 'ㅣ') r = 'shee';
    return r.replace(/eo/g, 'aw').replace(/eu/g, 'uh').replace(/ae/g, 'eh');
  }).join(' ');
}
if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
let speechBroken = false, unlocked = false;
// Browsers block speech until the page has been tapped once, so prime it on the first touch.
function unlockSpeech() {
  if (unlocked || !('speechSynthesis' in window)) return;
  unlocked = true;
  try { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); } catch (e) {}
}
document.addEventListener('pointerdown', unlockSpeech, true);
document.addEventListener('keydown', unlockSpeech, true);
function canSpeak() {
  if (!('speechSynthesis' in window) || speechBroken) return false;
  if (!koVoice) pickVoice();
  return !!koVoice || !!S.settings.romVoice;
}
// Chrome quietly wedges its speech queue (an utterance collected by the garbage collector,
// a cancel() that never clears, a pause after ~15s). Hence the kept reference, the resume
// ticker and the one retry: without them the very first lesson sound can silence the rest.
let curUtter = null, resumeTicker = null;
let speakStarted = false;
function speakNow(text, rate, korean) {
  const u = new SpeechSynthesisUtterance(text);
  u.onstart = () => { speakStarted = true; };
  if (korean) { u.lang = 'ko-KR'; if (koVoice) u.voice = koVoice; }
  u.rate = rate;
  u.onerror = e => { if (e.error !== 'interrupted' && e.error !== 'canceled') { speechBroken = true; showVoiceNote(); } };
  u.onend = () => { clearInterval(resumeTicker); resumeTicker = null; };
  curUtter = u;                       // keep a reference so it isn't garbage-collected mid-sentence
  try {
    if (speechSynthesis.speaking || speechSynthesis.pending) speechSynthesis.cancel();
    speechSynthesis.resume();
    speechSynthesis.speak(u);
  } catch (e) {}
  clearInterval(resumeTicker);
  resumeTicker = setInterval(() => { try { if (speechSynthesis.speaking) speechSynthesis.resume(); else { clearInterval(resumeTicker); resumeTicker = null; } } catch (e) {} }, 6000);
  return u;
}
function say(text, slow) {
  if (!('speechSynthesis' in window)) { toast('This browser can’t speak. Try Safari or Chrome.'); return; }
  if (!koVoice) pickVoice();
  const approx = !koVoice && S.settings.romVoice;
  const spoken = approx ? romanize(text) : text;
  const rate = approx ? (slow ? 0.6 : 0.8) : (slow ? 0.55 : S.settings.rate);
  unlockSpeech();
  speakStarted = false;
  speakNow(spoken, rate, !approx);
  // if the queue was wedged, nothing starts at all: clear it out and try once more
  setTimeout(() => {
    try {
      if (!speakStarted && !speechSynthesis.speaking && !speechSynthesis.pending) {
        speechSynthesis.cancel(); speechSynthesis.resume(); speakNow(spoken, rate, !approx);
      }
    } catch (e) {}
  }, 300);
}
function voiceHelp() {
  return 'No Korean voice on this device yet. On a Mac: System Settings → Accessibility → Spoken Content → System voice → Manage Voices → add Korean (Yuna), then reload this page. On iPad: Settings → Accessibility → Spoken Content → Voices → Korean.';
}
function showVoiceNote() {
  const n = $('#voice-note');
  if (n) { n.hidden = false; n.innerHTML = `🔇 <b>No Korean voice.</b> ${esc(voiceHelp())}`; }
}
let actx = null;
function sfx(kind) {
  if (!S.settings.sfx) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const notes = kind === 'good' ? [660, 880] : kind === 'win' ? [523, 659, 784, 1046] : [220, 180];
    notes.forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = kind === 'bad' ? 'triangle' : 'sine'; o.frequency.value = f;
      const t = actx.currentTime + i * 0.09;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.18, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t + 0.25);
    });
  } catch (e) {}
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-say]');
  if (b) { e.stopPropagation(); say(b.dataset.say, b.dataset.slow === '1'); }
}, true);

/* ================= ui helpers ================= */
let toastT;
function toast(msg) {
  let t = $('#toast'); if (!t) { t = document.createElement('div'); t.id = 'toast'; t.className = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); }
  t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 3200);
}
function burst() {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const b = document.createElement('div'); b.className = 'burst';
  const items = ['⭐', '🎉', '🇰🇷', '✨', '🐯', '💫'];
  for (let i = 0; i < 28; i++) { const s = document.createElement('span'); s.textContent = pick(items); s.style.left = Math.random() * 100 + '%'; s.style.animationDelay = Math.random() * .6 + 's'; b.appendChild(s); }
  document.body.appendChild(b); setTimeout(() => b.remove(), 2600);
}
// Art style: 'cute' or 'anime'. Anime images live in assets/anime/… (stamps are shared).
// If an anime picture hasn't been added yet, the cute one is shown instead.
const styleOf = p => (p && p.style) || 'cute';
const stylePath = (st, path) => st === 'anime' && !path.startsWith('assets/stamps/') ? path.replace('assets/', 'assets/anime/') : path;
function A(path) { return stylePath(styleOf(me()), path); }
const avatarSrcFor = p => stylePath(styleOf(p), `assets/avatars/${p.avatar}.webp`);
document.addEventListener('error', e => {
  const t = e.target;
  if (t.tagName === 'IMG' && t.src.includes('/assets/anime/')) t.src = t.src.replace('/assets/anime/', '/assets/');
}, true);
function applyStyle() {
  const st = styleOf(me());
  document.documentElement.setAttribute('data-style', st);
  const logo = $('#brand img'); if (logo) logo.src = A('assets/logo.webp');
  $$('#style-tog button').forEach(b => b.setAttribute('aria-pressed', b.dataset.style === st));
}
function setStyle(st) {
  const p = me(); if (!p) return;
  p.style = st; save(); applyStyle();
  go(route.name, route.arg);
  toast(st === 'anime' ? '⚡ Anime style on' : '🧸 Cute style on');
}
const avatarSrc = id => A(`assets/avatars/${id}.webp`);
const tiger = pose => A(`assets/mascot/horangi-${pose}.webp`);
const starsHTML = n => `<span class="stars" aria-label="${n} of 3 stars">${'★'.repeat(n)}<span class="off">${'★'.repeat(3 - n)}</span></span>`;
function mnImg(letter) {
  const d = L[letter];
  // tries assets/mnemonics/<name>.webp, then .png, then shows the emoji
  return `<div class="mn-pic"><img alt="Picture clue for ${esc(letter)}" src="${A(`assets/mnemonics/${d.img}.webp`)}" data-alt="${A(`assets/mnemonics/${d.img}.png`)}" onerror="if(this.dataset.alt){this.src=this.dataset.alt;this.dataset.alt='';}else{this.replaceWith(Object.assign(document.createElement('span'),{className:'em',textContent:'${d.emoji}'}));}"></div>`;
}

function updateBar() {
  const p = me();
  $('#tabs').hidden = !p; $('#mebar').hidden = !p; $('#style-tog').hidden = !p;
  if (!p) return;
  $('#st-xp').textContent = p.xp; $('#st-streak').textContent = p.streak;
  $('#me-av').src = avatarSrc(p.avatar); $('#me-name').textContent = p.name;
  const tabFor = { stage: 'path', passport: 'home' }[route.name] || route.name;
  $$('.tab').forEach(t => t.setAttribute('aria-current', t.dataset.go === tabFor ? 'page' : 'false'));
}

/* ================= router ================= */
let route = { name: 'profiles', arg: null };
function go(name, arg = null) {
  if (!me() && !['profiles', 'newProfile'].includes(name)) name = 'profiles';
  applyStyle();
  route = { name, arg };
  const main = $('#main');
  main.innerHTML = '';
  (VIEWS[name] || VIEWS.home)(main, arg);
  updateBar();
  window.scrollTo(0, 0);
}
$('#tabs').addEventListener('click', e => { const b = e.target.closest('[data-go]'); if (b) go(b.dataset.go); });
$('#brand').addEventListener('click', () => go(me() ? 'home' : 'profiles'));
$('#me-btn').addEventListener('click', () => go('profiles'));
$('#style-tog').addEventListener('click', e => { const b = e.target.closest('[data-style]'); if (b) setStyle(b.dataset.style); });

const VIEWS = {};

/* ---------- profiles ---------- */
VIEWS.profiles = main => {
  main.innerHTML = `<div class="who">
    <img class="hero-tiger" src="${tiger('wave')}" alt="Horangi the tiger waving">
    <div><h1>누가 공부해요? <span class="muted" style="font-size:.6em;display:block;margin-top:6px">Who’s learning today?</span></h1></div>
    <div class="who-grid">
      ${S.profiles.map(p => `<button class="who-card" data-id="${p.id}"><img src="${avatarSrcFor(p)}" alt=""><b>${esc(p.name)}</b><span class="pill">⭐ ${p.xp} XP · ${wordCount(p)} words</span></button>`).join('')}
      <button class="who-card add" id="add-p"><span class="plus">+</span><b>Add learner</b></button>
    </div></div>`;
  $$('.who-card[data-id]', main).forEach(b => b.onclick = () => { S.currentId = b.dataset.id; save(); go('home'); });
  $('#add-p', main).onclick = () => go('newProfile');
};
VIEWS.newProfile = main => {
  let av = D.avatars[S.profiles.length % D.avatars.length].id, fam = 'boy';
  let sty = styleOf(me());
  main.innerHTML = `<form class="card form-card" id="pf">
    <h2>New learner</h2>
    <div class="field"><label for="pf-name">Name</label><input class="input" id="pf-name" maxlength="20" required autocomplete="off" placeholder="First name"></div>
    <div class="field"><label>Pick your style</label>
      <p class="muted" style="font-size:.9rem">Same lessons either way. You can switch any time with the buttons at the top.</p>
      <div class="seg">
        <button type="button" data-sty="cute" aria-pressed="${sty === 'cute'}"><span style="font-size:1.3rem">🧸</span> Cute<br><span class="muted">Soft and friendly</span></button>
        <button type="button" data-sty="anime" aria-pressed="${sty === 'anime'}"><span style="font-size:1.3rem">⚡</span> Anime<br><span class="muted">Bold and dramatic</span></button>
      </div></div>
    <div class="field"><label>Pick an avatar</label><div class="avatars">${D.avatars.map(a => `<button type="button" class="av-opt" data-av="${a.id}" aria-pressed="${a.id === av}" aria-label="${a.label}"><img src="${stylePath(sty, `assets/avatars/${a.id}.webp`)}" alt=""></button>`).join('')}</div></div>
    <div class="field"><label>Family words</label>
      <p class="muted" style="font-size:.9rem">In Korean, what you call your older brother and sister depends on whether you’re a boy or a girl.</p>
      <div class="seg">
        <button type="button" data-fam="boy" aria-pressed="true"><span class="ko">형 · 누나</span><br><span class="muted">I’m a boy</span></button>
        <button type="button" data-fam="girl" aria-pressed="false"><span class="ko">오빠 · 언니</span><br><span class="muted">I’m a girl</span></button>
      </div></div>
    <div class="row" style="justify-content:space-between">
      <button type="button" class="btn ghost" id="pf-cancel">Cancel</button>
      <button class="btn red" type="submit">Start learning →</button>
    </div>
  </form>`;
  $$('[data-av]', main).forEach(b => b.onclick = () => { av = b.dataset.av; $$('[data-av]', main).forEach(x => x.setAttribute('aria-pressed', x === b)); });
  $$('[data-sty]', main).forEach(b => b.onclick = () => {
    sty = b.dataset.sty;
    $$('[data-sty]', main).forEach(x => x.setAttribute('aria-pressed', x === b));
    document.documentElement.setAttribute('data-style', sty);   // preview the look straight away
    $$('[data-av] img', main).forEach((img, i) => img.src = stylePath(sty, `assets/avatars/${D.avatars[i].id}.webp`));
  });
  $$('[data-fam]', main).forEach(b => b.onclick = () => { fam = b.dataset.fam; $$('[data-fam]', main).forEach(x => x.setAttribute('aria-pressed', x === b)); });
  $('#pf-cancel', main).onclick = () => { applyStyle(); go('profiles'); };
  $('#pf', main).onsubmit = e => {
    e.preventDefault();
    const name = $('#pf-name', main).value.trim(); if (!name) return;
    const p = newProfile(name, av, fam); p.style = sty; S.profiles.push(p); S.currentId = p.id; save();
    go('home'); toast(`환영해요, ${name}! Already know some Hangul? Try “Test out” on a stage.`);
  };
  $('#pf-name', main).focus();
};

/* ---------- home ---------- */
VIEWS.home = main => {
  const p = me(); const nx = nextStep(p); const due = dueWords(p).length;
  const trip = S.settings.tripDate ? Math.ceil((new Date(S.settings.tripDate + 'T00:00:00') - new Date(todayStr() + 'T00:00:00')) / DAY) : null;
  const family = S.profiles.reduce((a, q) => a + wordCount(q), 0);

  P = { steps, i: 0, right: 0, total: 0, xp: 0, opts, answered: false, newWords: 0 };
  const root = $('#player-root');
  root.innerHTML = `<div class="player" role="dialog" aria-modal="true" aria-label="${esc(opts.title)}">
    <div class="p-top"><button class="x" id="p-x" aria-label="Close">✕</button><div class="bar"><i id="p-bar" style="width:0"></i></div><span class="stat" id="p-xp">⭐ 0</span></div>
    <div class="p-body" id="p-body"><div class="p-in" id="p-in"></div></div>
    <div class="p-foot" id="p-foot"><div class="p-foot-in"><span class="msg" id="p-msg"></span><button class="btn red" id="p-next">Continue</button></div></div></div>`;
  document.body.style.overflow = 'hidden';
  let armedX = false;
  $('#p-x').onclick = () => {
    if (P.i >= P.steps.length - 1 || P.i === 0 || armedX) return closePlayer();
    armedX = true; toast('Tap ✕ again to leave. This lesson won’t be saved.');
    setTimeout(() => armedX = false, 3500);
  };
  $('#p-next').onclick = () => P.onNext && P.onNext();

}
function closePlayer() { $('#player-root').innerHTML = ''; document.body.style.overflow = ''; if (window.speechSynthesis) speechSynthesis.cancel(); P = null; go(route.name, route.arg); }
function gainXP(n) { P.xp += n; addXP(n); $('#p-xp').textContent = '⭐ ' + P.xp; }
function foot(msg, state, label, fn, enabled = true) {
  const f = $('#p-foot'); f.className = 'p-foot' + (state ? ' ' + state : '');
  $('#p-msg').innerHTML = msg || ''; const b = $('#p-next'); b.textContent = label; b.disabled = !enabled;
  b.className = 'btn ' + (state === 'bad' ? 'red' : state === 'good' ? 'green' : 'red');
  P.onNext = fn;
}
function advance() { P.i++; renderStep(); }
function renderStep() {

  const box = $('#p-in'); box.innerHTML = ''; $('#p-body').scrollTop = 0;

STEP.trace = (box, st) => {
  const d = L[st.letter], color = d.type === 'vow' ? 'vow' : 'con';
  box.innerHTML = `<span class="eyebrow">Trace · follow the numbers</span><h2>Write <span class="ko c-${color}">${st.letter}</span></h2>
    <div class="trace-wrap"><canvas class="trace-bg" id="tg"></canvas><canvas id="ti" aria-label="Tracing area"></canvas></div>
    <div class="row" style="justify-content:center"><button class="btn ghost small" id="t-watch">▶ Watch the strokes</button><button class="btn ghost small" id="t-clear">↺ Clear</button></div>
    <p class="muted" id="t-hint">Start at dot 1 and follow the arrows. Korean is written top to bottom, left to right.</p>`;
  const cg = $('#tg', box), ci = $('#ti', box);
  const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  let W, dpr, userPts = [], cur = null, drawing = false;
  const toPx = v => (v / 100) * W;
  function size() {
    dpr = window.devicePixelRatio || 1; W = ci.clientWidth;
    [cg, ci].forEach(c => { c.width = W * dpr; c.height = W * dpr; c.getContext('2d').setTransform(dpr, 0, 0, dpr, 0, 0); });
    drawGuide(); redrawInk();
  }
  function drawGuide(progress) {
    const g = cg.getContext('2d'); g.clearRect(0, 0, W, W);
    g.lineCap = 'round'; g.lineJoin = 'round';
    d.strokes.forEach((s, si) => {
      g.strokeStyle = cssVar('--line'); g.lineWidth = W * 0.11;
      g.beginPath(); s.forEach(([x, y], k) => k ? g.lineTo(toPx(x), toPx(y)) : g.moveTo(toPx(x), toPx(y))); g.stroke();
    });
    if (progress !== undefined) {
      g.strokeStyle = cssVar('--' + color); g.lineWidth = W * 0.07;
      let left = progress;
      d.strokes.forEach(s => {
        if (left <= 0) return;
        const n = Math.min(s.length, Math.floor(left) + 1); g.beginPath();
        for (let k = 0; k < n; k++) { const [x, y] = s[k]; k ? g.lineTo(toPx(x), toPx(y)) : g.moveTo(toPx(x), toPx(y)); }
        if (n < s.length) { const f = left - Math.floor(left), [x0, y0] = s[n - 1], [x1, y1] = s[n]; g.lineTo(toPx(x0 + (x1 - x0) * f), toPx(y0 + (y1 - y0) * f)); }
        g.stroke(); left -= (s.length - 1);
      });
    }
    d.strokes.forEach((s, si) => {
      const [x, y] = s[0], [x2, y2] = s[1];
      const ang = Math.atan2(y2 - y, x2 - x);
      g.fillStyle = cssVar('--' + color); g.beginPath(); g.arc(toPx(x), toPx(y), W * 0.042, 0, 7); g.fill();
      g.fillStyle = '#fff'; g.font = `800 ${W * 0.05}px Nunito, sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(si + 1, toPx(x), toPx(y) + 1);
      const ax = toPx(x) + Math.cos(ang) * W * 0.09, ay = toPx(y) + Math.sin(ang) * W * 0.09;
      g.save(); g.translate(ax, ay); g.rotate(ang); g.fillStyle = cssVar('--muted'); g.beginPath(); g.moveTo(W * .025, 0); g.lineTo(-W * .015, -W * .018); g.lineTo(-W * .015, W * .018); g.fill(); g.restore();
    });
  }
  function redrawInk() {
    const c = ci.getContext('2d'); c.clearRect(0, 0, W, W);
    c.strokeStyle = cssVar('--' + color); c.lineWidth = W * 0.06; c.lineCap = 'round'; c.lineJoin = 'round';
    userPts.forEach(s => { c.beginPath(); s.forEach(([x, y], k) => k ? c.lineTo(toPx(x), toPx(y)) : c.moveTo(toPx(x), toPx(y))); if (s.length === 1) c.lineTo(toPx(s[0][0]) + .1, toPx(s[0][1])); c.stroke(); });
  }
  const pos = e => { const r = ci.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * 100, (e.clientY - r.top) / r.height * 100]; };
  ci.addEventListener('pointerdown', e => { ci.setPointerCapture(e.pointerId); drawing = true; cur = [pos(e)]; userPts.push(cur); redrawInk(); });
  ci.addEventListener('pointermove', e => { if (!drawing) return; cur.push(pos(e)); redrawInk(); });
  const end = () => { if (!drawing) return; drawing = false; check(); };
  ci.addEventListener('pointerup', end); ci.addEventListener('pointercancel', end);
  function score() {
    const all = userPts.flat(); if (all.length < 3) return { cov: 0, stray: 1 };
    const near = (x, y, r) => all.some(([a, b]) => (a - x) ** 2 + (b - y) ** 2 < r * r);
    let per = d.strokes.map(s => {
      const samples = []; for (let k = 0; k < s.length - 1; k++) { const [x0, y0] = s[k], [x1, y1] = s[k + 1]; const n = Math.max(2, Math.ceil(Math.hypot(x1 - x0, y1 - y0) / 3)); for (let j = 0; j <= n; j++) samples.push([x0 + (x1 - x0) * j / n, y0 + (y1 - y0) * j / n]); }
      return samples.filter(([x, y]) => near(x, y, 11)).length / samples.length;
    });
    const guide = d.strokes.flatMap(s => { const o = []; for (let k = 0; k < s.length - 1; k++) { const [x0, y0] = s[k], [x1, y1] = s[k + 1]; for (let j = 0; j <= 10; j++) o.push([x0 + (x1 - x0) * j / 10, y0 + (y1 - y0) * j / 10]); } return o; });
    const stray = all.filter(([x, y]) => !guide.some(([a, b]) => (a - x) ** 2 + (b - y) ** 2 < 196)).length / all.length;
    return { cov: Math.min(...per), stray };
  }
  let passed = false;
  function check() {
    const { cov, stray } = score();
    if (cov >= 0.72 && stray < 0.3) {
      if (!passed) { passed = true; sfx('good'); gainXP(3); const p = me(); p.letters[st.letter].traced = true; save(); }
      $('#t-hint', box).innerHTML = '<b style="color:var(--green)">훌륭해요! Beautiful writing.</b>';
      foot('✓ Great tracing!', 'good', 'Continue', advance);
    } else if (stray >= 0.3 && userPts.length) {
      $('#t-hint', box).textContent = 'Try to stay on the grey path. Tap ↺ to start again.';
    } else {
      $('#t-hint', box).textContent = 'Keep going: trace every stroke.';
    }
  }
  $('#t-clear', box).onclick = () => { userPts = []; redrawInk(); };
  $('#t-watch', box).onclick = () => {
    const total = d.strokes.reduce((a, s) => a + s.length - 1, 0); const t0 = performance.now();
    const perSeg = d.strokes.some(s => s.length > 10) ? 45 : 450;
    const tick = t => { const pr = (t - t0) / perSeg; drawGuide(Math.min(pr, total)); if (pr < total + 1) requestAnimationFrame(tick); else drawGuide(); };
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(size);
  foot('', '', 'Skip', advance);
};

/* ================= session builders ================= */
function letterOpts(answer, pool, show) {
  const A = L[answer];
  // never offer a letter that sounds the same as the answer (e.g. ㅐ / ㅔ)
  const uniq = [...new Set(pool)].filter(x => L[x] && x !== answer && !(A.snd && L[x].snd === A.snd));
  // family first: the letter it grows from, letters that grow from it, and its siblings (가 / 카 / 까)
  const fam = x => x === A.pair || L[x].pair === answer || (A.pair && L[x].pair === A.pair);
  const partner = shuffle(uniq.filter(fam));
  const same = shuffle(uniq.filter(x => L[x].type === A.type && !partner.includes(x)));
  const other = shuffle(uniq.filter(x => L[x].type !== A.type));
  return shuffle([answer, ...partner.concat(same, other).slice(0, 3)]).map(x => ({ value: x, html: show(x) }));
}
const glyphHTML = x => `<span class="ko ${L[x].type === 'vow' ? 'c-vow' : 'c-con'}">${x}</span>`;
function hearQ(letter, pool, eyebrow) {
  if (!canSpeak()) {
    // silent device: ask for the sound in writing instead, so the question is still answerable
    return { type: 'choice', eyebrow: eyebrow || 'Sounds', prompt: `Which letter makes the “<span style="color:var(--plum)">${esc(romSyl(L[letter].sample))}</span>” sound?`,
      sub: '<p class="muted">Say it out loud, then pick the letter.</p>', answer: letter, answerText: `<span class="ko">${letter}</span>`,
      options: letterOpts(letter, pool, glyphHTML), onResult: ok => markLetter(letter, ok) };
  }
  return { type: 'choice', eyebrow: eyebrow || 'Listen', prompt: 'Which letter makes this sound?',
    sub: '<p class="muted">Listen, then tap the letter you heard.</p>', audio: L[letter].sample, answer: letter, answerText: `<span class="ko">${letter}</span>`,
    options: letterOpts(letter, pool, glyphHTML), onResult: ok => markLetter(letter, ok) };
}
function soundQ(letter, pool) {
  return { type: 'choice', eyebrow: 'What sound?', prompt: `What sound does <span class="ko ${L[letter].type === 'vow' ? 'c-vow' : 'c-con'}" style="font-size:3rem;vertical-align:middle">${letter}</span> make?`, answer: letter, answerText: `“${L[letter].rom}”`,
    options: letterOpts(letter, pool, x => `<span>${esc(L[x].rom)}</span>`), onResult: ok => markLetter(letter, ok) };
}
function markLetter(x, ok) { const p = me(); const r = p.letters[x] = Object.assign({ right: 0, wrong: 0 }, p.letters[x]); ok ? r.right++ : r.wrong++; }
function buildQ(target, known) {
  const cons = known.filter(x => L[x].type === 'con'), vows = known.filter(x => L[x].type === 'vow');
  const t = decompose(target);
  const c = [...new Set([t.i, ...shuffle(cons.filter(x => x !== t.i)).slice(0, 3)])];
  const v = [...new Set([t.v, ...shuffle(vows.filter(x => x !== t.v)).slice(0, 3)])];
  return { type: 'build', target, cons: c, vows: v };
}
function wordQ(w, pool, mode) {
  if (mode === 'listen' && !canSpeak()) mode = 'find';
  const others = shuffle(pool.filter(x => x.ko !== w.ko && x.en !== w.en)).slice(0, 3);
  const opts = shuffle([w, ...others]);
  const onResult = ok => { const p = me(); const r = p.words[w.ko]; if (r) { ok ? r.right++ : r.wrong++; } };
  if (mode === 'meaning') return { type: 'choice', eyebrow: 'Read it', prompt: `<span class="ko" style="font-size:3.4rem">${esc(w.ko)}</span>`, sub: '<p class="muted">What does this mean?</p>', answer: w.ko, answerText: `${w.emoji} ${esc(w.en)}`,
    options: opts.map(o => ({ value: o.ko, html: `<span class="em">${o.emoji}</span><span>${esc(o.en)}</span>` })), onResult };
  if (mode === 'listen') return { type: 'choice', eyebrow: 'Listen', prompt: 'Which word do you hear?', sub: '<p class="muted">Listen, then tap the word you heard.</p>', audio: w.ko, answer: w.ko, answerText: `<span class="ko">${esc(w.ko)}</span>`,
    options: opts.map(o => ({ value: o.ko, html: `<span class="ko">${esc(o.ko)}</span>` })), onResult };
  return { type: 'choice', eyebrow: 'Find the Korean', prompt: `<span style="font-size:3rem">${w.emoji}</span><br>${esc(w.en)}`, answer: w.ko, answerText: `<span class="ko">${esc(w.ko)}</span>`, optAudio: true,
    options: opts.map(o => ({ value: o.ko, html: `<span class="ko">${esc(o.ko)}</span>` })), onResult };
}
function finalListenQ(set) {
  const a = pick(set);
  return { type: 'choice', eyebrow: 'Listen to the ending', prompt: 'Which block do you hear?', sub: '<p class="muted">Listen for the sound at the END of the block.</p>', audio: a, answer: a, answerText: `<span class="ko">${a}</span>`,
    options: shuffle(set).map(x => ({ value: x, html: `<span class="ko">${x}</span>` })) };
}
function finalAskQ([syl, ans]) {
  const others = shuffle(Object.keys(FIN_ROM).filter(x => x !== ans)).slice(0, 3);
  return { type: 'choice', eyebrow: 'Bottom letter', prompt: `Which ending sound does <span class="ko" style="font-size:2.4rem;vertical-align:middle">${syl}</span> make?`,
    sub: `<div class="row" style="justify-content:center">${blockHTML(syl)}<button class="say" data-say="${syl}" aria-label="Play">🔊</button></div>`,
    answer: ans, answerText: `<span class="ko">${ans}</span> “${FIN_ROM[ans]}”`,
    options: shuffle([ans, ...others]).map(x => ({ value: x, html: `<span class="ko c-fin">${x}</span><span>“${FIN_ROM[x]}”</span>` })) };
}
function finalBuildQ(target) {
  const t = decompose(target);
  const cons = [...new Set([t.i, ...shuffle(BASIC_CON.filter(x => x !== t.i)).slice(0, 3)])];
  const vows = [...new Set([t.v, ...shuffle(BASIC_VOW.filter(x => x !== t.v)).slice(0, 3)])];
  const fins = [...new Set([t.t, ...shuffle(['ㄱ', 'ㄴ', 'ㄹ', 'ㅁ', 'ㅂ', 'ㅇ'].filter(x => x !== t.t)).slice(0, 3)])];
  return { type: 'build', target, cons, vows, fins };
}
function ruleQ(ruleId, [w, said, en, wrong]) {
  const r = D.rules[ruleId];
  return { type: 'choice', eyebrow: `Sound rule · ${r.name}`, prompt: `<span class="ko" style="font-size:3rem">${w}</span>`,
    sub: `<p class="muted">${esc(en)}. How is it really said?</p>`, audio: w, answer: said, answerText: `<span class="ko">[${said}]</span>`,
    options: shuffle([said, ...wrong]).map(x => ({ value: x, html: `<span class="ko" style="font-size:1.5rem">[${x}]</span>` })) };
}
function startLesson(id) {
  const { stage, lesson } = lessonById(id); const p = me();
  const knownSoFar = (() => { const out = knownLetters(stage.id - 1); for (const l of stage.lessons) { if (l.letters) out.push(...l.letters); if (l.id === id) break; } return out; })();
  const steps = [{ type: 'intro', eyebrow: `Stage ${stage.id} · Lesson ${stage.lessons.indexOf(lesson) + 1}`, title: lesson.title, html: lesson.intro, img: lesson.img }];
  if (lesson.type === 'letters') {
    lesson.letters.forEach(x => steps.push({ type: 'meet', letter: x }, { type: 'trace', letter: x }));
    const hearable = lesson.letters.filter(x => x !== 'ㅇ');
    const hq = shuffle([...hearable, ...hearable]).slice(0, Math.max(4, hearable.length + 2));
    hq.forEach(x => steps.push(hearQ(x, knownSoFar)));
    shuffle(lesson.letters).slice(0, 3).forEach(x => steps.push(soundQ(x, knownSoFar)));
    shuffle(lesson.build).slice(0, 4).forEach(t => steps.push(buildQ(t, knownSoFar)));
  } else if (lesson.type === 'finals') {
    lesson.finals.forEach(f => steps.push({ type: 'finalcard', fin: D.finals.find(x => x.f === f) }));
    if (lesson.doubles) steps.push({ type: 'doublecard' });
    steps.push(...shuffle([...(canSpeak() ? lesson.listen.map(finalListenQ) : []), ...lesson.ask.map(finalAskQ)]).slice(0, 8));
    steps.push(...shuffle(lesson.build).slice(0, 3).map(finalBuildQ));
  } else if (lesson.type === 'rules') {
    lesson.rules.forEach(r => steps.push({ type: 'rulecard', rule: r }));
    steps.push(...shuffle(lesson.rules.flatMap(r => D.rules[r].items.map(it => ruleQ(r, it)))).slice(0, 8));
  } else {
    const ws = lessonWords(p, stage, lesson);
    ws.forEach((w, k) => steps.push({ type: 'wordcard', word: w, n: k + 1, of: ws.length }));
    const pool = D.words.filter(w => w.stage <= stage.id && (!w.for || w.for === p.family));
    const modes = ['meaning', 'listen', 'find'];
    shuffle(ws).slice(0, Math.min(10, ws.length + 2)).forEach((w, k) => steps.push(wordQ(w, pool, modes[k % 3])));
    if (ws.length < 6) shuffle(ws).forEach((w, k) => steps.push(wordQ(w, pool, modes[(k + 1) % 3])));
  }
  steps.push({ type: 'result', finish: acc => {
    const stars = acc >= .9 ? 3 : acc >= .7 ? 2 : 1;
    const prev = p.lessons[id];
    p.lessons[id] = { stars: Math.max(stars, prev ? prev.stars : 0), at: Date.now() };
    if (!prev) gainXP(20);
    save();
    const last = stage.lessons[stage.lessons.length - 1].id === id;
    return { win: true, stars, title: stars === 3 ? '완벽해요! Perfect!' : stars === 2 ? '잘했어요! Great job!' : '좋아요! Lesson done!',
      text: last ? 'All lessons done. The <b>Stage challenge</b> is unlocked: pass it to earn a passport stamp!' : 'The next lesson is unlocked.' };
  } });
  openPlayer(steps, { title: lesson.title });
}
function startChallenge(stageId, testout) {
  const stage = stageOf(stageId), p = me();
  const letters = stage.letters, known = knownLetters(stageId);
  const hearable = letters.filter(x => x !== 'ㅇ');
  const steps = [{ type: 'intro', eyebrow: testout ? 'Test out' : 'Stage challenge', title: `Stage ${stageId}: ${stage.title}`,
    html: `12 questions about ${stage.kind ? esc(stage.title.toLowerCase()) : `<span class="ko">${letters.join(' ')}</span>`} and the words from this stage. Get <b>10 right</b> to earn your passport stamp! ${testout ? 'If you pass, the whole stage is marked complete.' : ''}` }];
  if (stage.kind === 'finals') {
    const fl = stage.lessons.filter(l => l.type === 'finals');
    steps.push(...shuffle(fl.flatMap(l => [...(canSpeak() ? l.listen.map(finalListenQ) : []), ...l.ask.map(finalAskQ)])).slice(0, 7));
    steps.push(...shuffle(fl.flatMap(l => l.build)).slice(0, 2).map(finalBuildQ));
  } else if (stage.kind === 'rules') {
    steps.push(...shuffle(Object.keys(D.rules).flatMap(r => D.rules[r].items.map(it => ruleQ(r, it)))).slice(0, 9));
  } else {
    shuffle([...hearable, ...hearable]).slice(0, 4).forEach(x => steps.push(hearQ(x, known, 'Challenge · listen')));
    shuffle(letters).slice(0, 3).forEach(x => steps.push(soundQ(x, known)));
    const builds = stage.lessons.flatMap(l => l.build || []);
    shuffle(builds).slice(0, 2).forEach(t => steps.push(buildQ(t, known)));
  }
  const ws = wordsFor(p, stageId), pool = D.words.filter(w => w.stage <= stageId && (!w.for || w.for === p.family));
  shuffle(ws).slice(0, 3).forEach((w, k) => steps.push(wordQ(w, pool, ['meaning', 'listen', 'find'][k])));
  steps.push({ type: 'result', finish: () => {
    const score = P.right, win = score >= Math.ceil(P.total * 0.8);
    if (win) {
      const prev = p.stages[stageId];
      p.stages[stageId] = { passed: true, score: Math.max(score, prev ? prev.score || 0 : 0), at: Date.now() };
      if (!prev || !prev.passed) gainXP(50);
      if (testout) {
        stage.lessons.forEach(l => { if (!p.lessons[l.id]) p.lessons[l.id] = { stars: 3, at: Date.now(), testout: true }; });
        letters.forEach(x => { p.letters[x] = Object.assign({ right: 0, wrong: 0 }, p.letters[x], { seen: true }); });
        ws.forEach(w => { if (addWord(w, 2)) P.newWords++; });
      }
      save();
      const nxt = stageOf(stageId + 1);
      return { win: true, stamp: stampForStage(stageId).id, title: '합격! You passed!', stars: score === P.total ? 3 : score >= P.total - 1 ? 2 : 1,
        text: `You earned the <b>${stampForStage(stageId).label}</b> passport stamp. ${nxt && !nxt.soon ? `Stage ${stageId + 1} is unlocked!` : stageId === D.stages.length ? '🎓 You finished the whole Hangul Path. You can read Korean!' : `Stages 1–${stageId} complete: amazing! More stages are coming soon.`}` };
    }
    save();
    return { win: false, title: 'So close!', stars: 0, text: `You need ${Math.ceil(P.total * 0.8)} right to pass. ${testout ? 'Try the lessons first. They’ll make it easy!' : 'Look at the picture clues again and have another go.'}` };
  } });
  openPlayer(steps, { title: 'Challenge' });
}
function startReview() {
  const p = me();
  const due = shuffle(dueWords(p)).sort((a, b) => p.words[a.ko].box - p.words[b.ko].box).slice(0, 15);
  if (!due.length) { toast('No words to review right now.'); return; }
  const pool = D.words.filter(w => p.words[w.ko] || w.stage <= 1);
  const modes = ['meaning', 'listen', 'find'];
  const steps = [{ type: 'intro', eyebrow: 'Word review', title: `${due.length} words to review`, html: 'Get a word right and it moves up a box, so you’ll see it less often. Miss it and it goes back to box 1 for more practice.' }];
  due.forEach((w, k) => {
    const q = wordQ(w, pool.length >= 4 ? pool : D.words, modes[k % 3]);
    const base = q.onResult;
    q.onResult = ok => { base(ok); const r = p.words[w.ko]; r.box = ok ? Math.min(5, r.box + 1) : 1; r.due = Date.now() + (ok ? BOX_GAP[r.box] : 0) + (ok ? 0 : 10 * 60000); };
    steps.push(q);
  });
  steps.push({ type: 'result', finish: acc => ({ win: acc >= .6, stars: acc >= .9 ? 3 : acc >= .7 ? 2 : 1, title: acc >= .6 ? '복습 끝! Review done!' : 'Good practice!', text: acc >= .6 ? 'Your words are moving up the boxes. Come back tomorrow for the next review!' : 'Missed words go back to box 1 and come back soon. That’s how they stick!' }) });
  openPlayer(steps, { title: 'Word review' });
}

function gameStats(p) { p.games = p.games || { memory: { plays: 0, wins: 0, best: 0 }, swipe: { plays: 0, known: 0 }, speed: { plays: 0, best: 0 } }; return p.games; }
function stampProgress(p, st) {

  const g = gameStats(p)[st.game];
  const v = st.game === 'memory' ? g.wins : st.game === 'swipe' ? g.known : g.best;
  return Math.min(1, v / st.goal);
}

/* ================= games ================= */
function gamePool(p) {
  const ws = D.words.filter(w => p.words[w.ko] && (!w.for || w.for === p.family));
  if (ws.length >= 6) return { kind: 'words', items: ws.map(w => ({ key: w.ko, ko: w.ko, en: w.en, emoji: w.emoji, rom: w.rom, say: w.ko, word: w })) };
  let ls = Object.keys(L).filter(x => p.letters[x] && p.letters[x].seen);
  if (ls.length < 6) ls = D.stages[0].letters.concat(D.stages[1].letters);
  return { kind: 'letters', items: ls.map(x => ({ key: x, ko: x, en: '“' + L[x].rom + '”', emoji: L[x].emoji, rom: L[x].rom, say: L[x].sample })) };
}

/* --- Memory Match --- */
function playMemory() {
  const p = me(), pool = gamePool(p);
  const box = G ? $('#g-in') : openGame('Memory Match');
  const pairs = shuffle(pool.items).slice(0, 6);
  const cards = shuffle(pairs.flatMap((it, i) => [{ i, side: 'ko', it }, { i, side: 'en', it }]));
  let open = [], matched = 0, moves = 0, lock = false;
  const stat = () => $('#g-stat').textContent = `🔄 ${moves} moves`;
  box.innerHTML = `<p class="muted">Find each Korean ${pool.kind === 'words' ? 'word' : 'letter'} and its ${pool.kind === 'words' ? 'meaning' : 'sound'}.</p>
    <div class="mem">${cards.map((c, k) => `<button class="mcard" data-k="${k}" aria-label="Hidden card"><span class="mback">🐯</span><span class="mface ${c.side}">${c.side === 'ko' ? `<span class="ko">${esc(c.it.ko)}</span>` : `<span class="em">${c.it.emoji}</span><span class="en">${esc(c.it.en)}</span>`}</span></button>`).join('')}</div>`;
  stat();
  $$('.mcard', box).forEach(b => b.onclick = () => {
    const k = +b.dataset.k, c = cards[k];
    if (lock || b.classList.contains('up')) return;
    b.classList.add('up'); b.setAttribute('aria-label', c.side === 'ko' ? c.it.ko : c.it.en);
    if (c.side === 'ko') say(c.it.say);
    open.push([b, c]);
    if (open.length < 2) return;
    moves++; stat();
    const [[b1, c1], [b2, c2]] = open; open = [];
    if (c1.i === c2.i) {
      matched++; sfx('good'); b1.classList.add('ok'); b2.classList.add('ok'); addXP(1);
      if (matched === pairs.length) {
        const g = gameStats(p).memory; g.plays++; g.wins++; if (!g.best || moves < g.best) g.best = moves;
        addXP(10);
        setTimeout(() => { sfx('win'); burst(); gameOver(box, { title: '짝 맞추기 성공!', pose: 'cheer', text: `All pairs found in <b>${moves} moves</b>. ${moves <= 8 ? 'Amazing memory!' : 'Try to beat it with fewer moves!'} (+16 XP)`, again: playMemory }); }, 700);
      }
    } else {
      lock = true; sfx('bad');
      setTimeout(() => { b1.classList.remove('up'); b2.classList.remove('up'); lock = false; }, 950);
    }
  });
}

/* --- Swipe Cards --- */
function playSwipe(mode) {
  const p = me(), pool = gamePool(p);
  const box = G ? $('#g-in') : openGame('Swipe Cards');
  mode = typeof mode === 'string' ? mode : 'ko';
  // due words first, then the rest
  const now = Date.now();
  const items = pool.items.slice().sort((a, b) => {
    const ra = a.word && p.words[a.key], rb = b.word && p.words[b.key];
    return ((ra ? ra.box : 0) - (rb ? rb.box : 0)) || ((ra && ra.due <= now ? 0 : 1) - (rb && rb.due <= now ? 0 : 1));
  });
  const deck = shuffle(items.slice(0, 20)).slice(0, 15);
  let i = 0, known = 0, again = [];
  box.innerHTML = `<div class="chips" style="justify-content:center"><button class="chip" data-mode="ko" aria-pressed="${mode === 'ko'}">Korean first</button><button class="chip" data-mode="en" aria-pressed="${mode === 'en'}">English first</button></div>
    <div class="swipe-zone"><div class="hint left">✗ Still learning</div><div class="hint right">Knew it ✓</div><div id="sw-stack"></div></div>
    <p class="muted" style="font-size:.9rem">Tap the card to flip it. Swipe or use the buttons (← / → keys work too).</p>
    <div class="row" style="justify-content:center">
      <button class="btn red swbtn" id="sw-no" aria-label="Still learning">✗</button>
      <button class="btn ghost" id="sw-flip">↻ Flip</button>
      <button class="btn green swbtn" id="sw-yes" aria-label="Knew it">✓</button></div>`;
  $$('[data-mode]', box).forEach(b => b.onclick = () => playSwipe(b.dataset.mode));
  const stat = () => $('#g-stat').textContent = `${Math.min(i + 1, deck.length)} / ${deck.length}`;
  function render() {
    stat();
    const it = deck[i];
    const front = mode === 'ko' ? `<span class="ko big">${esc(it.ko)}</span>` : `<span class="em">${it.emoji}</span><span class="en">${esc(it.en)}</span>`;
    const back = mode === 'ko' ? `<span class="em">${it.emoji}</span><span class="en">${esc(it.en)}</span>${pool.kind === 'words' && showRom(it.word.stage) ? `<span class="rom">${esc(it.rom)}</span>` : ''}` : `<span class="ko big">${esc(it.ko)}</span><span class="rom">${esc(it.rom)}</span>`;
    $('#sw-stack', box).innerHTML = `${deck[i + 1] ? '<div class="scard under"></div>' : ''}<div class="scard" id="sc" tabindex="0"><div class="sin"><div class="sf front">${front}<span class="muted small">tap to flip</span></div><div class="sf back">${back}</div></div></div>`;
    if (mode === 'ko') say(it.say);
    bindCard($('#sc', box));
  }
  function flip() { const c = $('#sc', box); if (!c) return; c.classList.toggle('flipped'); if (c.classList.contains('flipped') && mode === 'en') say(deck[i].say); }
  function decide(ok) {
    const c = $('#sc', box); if (!c || c.dataset.gone) return;
    c.dataset.gone = 1;
    c.style.transition = 'transform .3s ease, opacity .3s'; c.style.transform = `translateX(${ok ? 140 : -140}%) rotate(${ok ? 18 : -18}deg)`; c.style.opacity = 0;
    const it = deck[i];
    sfx(ok ? 'good' : 'bad');
    if (ok) { known++; addXP(1); } else again.push(it);
    if (it.word) { const r = p.words[it.key]; if (r) { if (ok) { r.right++; if (r.due <= Date.now()) { r.box = Math.min(5, r.box + 1); r.due = Date.now() + BOX_GAP[r.box]; } } else { r.wrong++; r.box = 1; r.due = Date.now() + 10 * 60000; } } }
    else markLetter(it.key, ok);
    save();
    setTimeout(() => {
      i++;
      if (i < deck.length) return render();
      const g = gameStats(p).swipe; g.plays++; g.known += known; addXP(5);
      gameOver(box, { title: known === deck.length ? '완벽해요! Perfect!' : '잘했어요! Deck done!', pose: known >= deck.length * .7 ? 'cheer' : 'thumbs',
        text: `You knew <b>${known} of ${deck.length}</b> cards.${again.length ? `<br>Keep practising: <span class="ko">${again.map(x => esc(x.ko)).join(', ')}</span>` : ''}`, again: () => playSwipe(mode) });
    }, 280);
  }
  function bindCard(c) {
    let x0 = null, dx = 0, moved = false;
    c.addEventListener('pointerdown', e => { x0 = e.clientX; dx = 0; moved = false; c.setPointerCapture(e.pointerId); c.style.transition = 'none'; });
    c.addEventListener('pointermove', e => {
      if (x0 === null) return; dx = e.clientX - x0; if (Math.abs(dx) > 6) moved = true;
      c.style.transform = `translateX(${dx}px) rotate(${dx / 18}deg)`;
      box.querySelector('.hint.left').style.opacity = Math.min(1, Math.max(0, -dx / 90));
      box.querySelector('.hint.right').style.opacity = Math.min(1, Math.max(0, dx / 90));
    });
    const up = () => {
      if (x0 === null) return; x0 = null;
      $$('.hint', box).forEach(h => h.style.opacity = 0);
      if (!moved) { c.style.transform = ''; flip(); return; }
      if (Math.abs(dx) > 90) decide(dx > 0);
      else { c.style.transition = 'transform .2s'; c.style.transform = ''; }
    };
    c.addEventListener('pointerup', up); c.addEventListener('pointercancel', up);
  }
  $('#sw-no', box).onclick = () => decide(false);
  $('#sw-yes', box).onclick = () => decide(true);
  $('#sw-flip', box).onclick = flip;
  const key = e => { if (!$('#sc')) return; if (e.key === 'ArrowLeft') decide(false); else if (e.key === 'ArrowRight') decide(true); else if (e.key === ' ' || e.key === 'ArrowUp') { e.preventDefault(); flip(); } };
  if (G.cleanup) G.cleanup();
  document.addEventListener('keydown', key);
  G.cleanup = () => document.removeEventListener('keydown', key);
  render();
}

/* --- Speed Read --- */
function playSpeed() {
  const p = me(), pool = gamePool(p);
  const box = G ? $('#g-in') : openGame('Speed Read');
  let score = 0, left = 60, timer = null, cur = null, busy = false;
  const stat = () => $('#g-stat').textContent = `⏱ ${left}s · ⭐ ${score}`;
  box.innerHTML = `<img src="${tiger('point')}" alt="" style="width:140px"><h2>60 seconds. Ready?</h2>
    <p class="muted">Read the Korean and tap the right meaning, as fast as you can.</p><button class="btn red" id="sp-go">Start!</button>`;
  $('#g-stat').textContent = `best ${gameStats(p).speed.best}`;
  $('#sp-go', box).onclick = () => {
    box.innerHTML = `<div class="bar"><i id="sp-t" style="width:100%;transition:width 1s linear"></i></div><div id="sp-q" style="display:grid;gap:18px;width:100%;justify-items:center"></div>`;
    stat(); next();
    timer = setInterval(() => {
      left--; stat(); $('#sp-t').style.width = (left / 60 * 100) + '%';
      if (left <= 0) end();
    }, 1000);
  };
  if (G.cleanup) G.cleanup();
  G.cleanup = () => clearInterval(timer);
  function next() {
    busy = false;
    let it; do { it = pick(pool.items); } while (cur && it.key === cur.key && pool.items.length > 1);
    cur = it;
    const opts = shuffle([it, ...shuffle(pool.items.filter(x => x.key !== it.key && x.en !== it.en)).slice(0, 3)]);
    $('#sp-q').innerHTML = `<span class="ko" style="font-size:clamp(3rem,14vw,4.5rem);line-height:1.1">${esc(it.ko)}</span>
      <div class="opts">${opts.map(o => `<button class="opt" data-k="${esc(o.key)}"><span class="em">${o.emoji}</span><span>${esc(o.en)}</span></button>`).join('')}</div>`;
    $$('#sp-q .opt').forEach(b => b.onclick = () => {
      if (busy) return; busy = true;
      const ok = b.dataset.k === it.key;
      b.classList.add(ok ? 'right' : 'wrong');
      if (!ok) $$('#sp-q .opt').find(x => x.dataset.k === it.key).classList.add('right');
      sfx(ok ? 'good' : 'bad');
      if (ok) { score++; stat(); }
      setTimeout(next, ok ? 250 : 900);
    });
  }
  function end() {
    clearInterval(timer);
    const g = gameStats(p).speed; g.plays++;
    const best = score > g.best; if (best) g.best = score;
    addXP(score);
    if (score) { sfx('win'); if (best) burst(); }
    gameOver(box, { title: best && score ? '신기록! New record!' : `${score} correct!`, pose: score >= 10 ? 'cheer' : 'thumbs',
      text: `You read <b>${score}</b> ${pool.kind === 'words' ? 'words' : 'letters'} in 60 seconds. Best: <b>${g.best}</b>. (+${score} XP)`, again: playSpeed });
  }
}

/* ================= boot ================= */
go(me() ? 'home' : 'profiles');
})();
</script>
